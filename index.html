  <style>
    #modalContent input, #modalContent select, #modalContent textarea {
      background-color: #0b0d11;
      color: #f8fafc;
      border-color: #3f3f46;
    }
    #modalContent input:disabled, #modalContent input[readonly] {
      background-color: #27272a !important;
      color: #a1a1aa !important;
    }
    #modalContent label { color: #d4d4d8; }
    #modalContent h3 { color: #fbbf24; }
    #modalContent p.text-slate-500 { color: #a1a1aa; }
    #modalContent .bg-slate-50, #modalContent .bg-slate-100 { background-color: #20242e; color: #f4f4f5; border-color: #3f3f46; }
    #modalContent .text-slate-900, #modalContent .text-slate-700 { color: #f4f4f5; }
    #modalContent .border-slate-200 { border-color: #2e3440; }
    #hisabPrintArea {
      background-color: #14171f !important;
      color: #f8fafc !important;
      border-color: #27272a !important;
    }
    #hisabPrintArea input {
      background-color: #0b0d11 !important;
      color: #f8fafc !important;
      border-color: #3f3f46 !important;
    }
    #hisabPrintArea input:focus {
      border-color: #f59e0b !important;
    }
    #hisabPrintArea input:disabled, #hisabPrintArea input[readonly] {
      background-color: #1f2430 !important;
      color: #9ca3af !important;
    }
    #hisabPrintArea input[data-hisab-lot-field="lotNo"],
    #hisabPrintArea input[data-draft-lot-input] {
      color: #fbbf24 !important;
    }
    #hisabPrintArea thead {
      background-color: #f59e0b !important;
      color: #09090b !important;
    }
    #hisabPrintArea thead th {
      border-color: rgba(217, 119, 6, 0.4) !important;
    }
    #hisabPrintArea tbody tr {
      background-color: #14171f;
      border-color: #27272a !important;
    }
    #hisabPrintArea tbody td {
      border-color: #27272a !important;
      color: #f4f4f5 !important;
    }
    #hisabPrintArea [data-hisab-date-label],
    #hisabPrintArea [data-draft-date-label] {
      color: #f8fafc !important;
    }
    #hisabPrintArea .relative.border {
      background-color: #0b0d11 !important;
      border-color: #3f3f46 !important;
    }
    * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0b0d11; color: #f8fafc; }
    .lot-bold { font-weight: 800; letter-spacing: 0.02em; }
    .cell-paid-bright, .cell-paid-light {
      background-color: #15803d !important;
      color: #ffffff !important;
      border-color: #22c55e !important;
    }
    .cell-paid-bright .sub-text, .cell-paid-light .sub-text {
      color: #dcfce7 !important;
      font-weight: 700;
    }
    .cell-status-clear {
      background-color: #fef08a !important;
      color: #713f12 !important;
      border-color: #eab308 !important;
    }
    .cell-status-clear .sub-text {
      color: #854d0e !important;
    }
    body.view-mode-active .edit-only-control {
      display: none !important;
    }
    .sticky-lot {
      position: sticky;
      left: 0;
      z-index: 10;
      background: #14171f;
      box-shadow: 2px 0 8px -2px rgba(0, 0, 0, 0.65);
    }
    thead .sticky-lot {
      z-index: 20;
      background: #f59e0b;
      color: #09090b;
    }
    .table-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
    .table-scroll::-webkit-scrollbar-track { background: #14171f; }
    .table-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; height: 0; width: 0; }
    @media print {
      body * { visibility: hidden !important; }
      #hisabPrintArea, #hisabPrintArea * { visibility: visible !important; }
      #hisabPrintArea {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        background: #ffffff !important;
        color: #0f172a !important;
        padding: 16px !important;
        box-shadow: none !important;
      }
      #hisabPrintArea input, #hisabPrintArea td, #hisabPrintArea span {
        background: transparent !important;
        color: #0f172a !important;
        border-color: #cbd5e1 !important;
      }
      body.printing-thermal #hisabPrintArea,
      body.printing-thermal #hisabPrintArea * {
        visibility: hidden !important;
      }
      body.printing-thermal #thermalPrintReceipt,
      body.printing-thermal #thermalPrintReceipt * {
        visibility: visible !important;
      }
      body.printing-thermal #thermalPrintReceipt {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 76mm !important;
        max-width: 76mm !important;
        padding: 2mm !important;
        margin: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        font-family: 'Courier New', monospace !important;
        font-size: 11px !important;
        box-shadow: none !important;
        border: none !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>

    <button id="moveDoneBtn" type="button" class="px-2.5 py-1 rounded-lg bg-amber-500 hover:bg-amber-400 text-zinc-950 text-xs font-extrabold">Done</button>
  </div>

  <!-- Full-Screen Login / Register Auth Gate -->
  <div id="authGateOverlay" class="fixed inset-0 z-[45] bg-[#0b0d11] hidden flex-col items-center justify-center p-4 overflow-y-auto"></div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-amber-500 text-zinc-950 px-4 py-2 rounded-full text-xs sm:text-sm font-bold shadow-xl opacity-0 pointer-events-none transition-opacity duration-200 z-[60]"></div>

  <!-- Generic Modal Backdrop -->
  <div id="modalBackdrop" class="fixed inset-0 bg-black/75 backdrop-blur-xs hidden items-center justify-center p-3 z-[50]">
    <div id="modalContent" class="bg-[#181b22] text-zinc-100 rounded-2xl shadow-2xl w-full max-w-lg max-h-[92vh] overflow-y-auto border border-zinc-700">
      <!-- Dynamic Modal Body -->
    </div>
  </div>

  <!-- Hisab Fullscreen Overlay -->
  <div id="hisabOverlay" class="fixed inset-0 bg-[#0b0d11] hidden flex-col z-40 overflow-y-auto">
    <div class="bg-[#161922] text-white px-3 py-2.5 flex items-center justify-between sticky top-0 z-10 border-b border-zinc-800 no-print">
      <div class="flex items-center gap-2">
        <button id="hisabBackBtn" type="button" class="px-3 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-xs sm:text-sm font-semibold">← Back</button>
        <h2 id="hisabTitle" class="text-sm sm:text-base font-bold text-amber-400">Hisab</h2>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="hisabSaveBtn" type="button" class="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold text-xs sm:text-sm">💾 Save Hisab</button>
        <button id="hisabThermalBtn" type="button" class="px-3 py-1.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-zinc-950 font-bold text-xs sm:text-sm">🧾 3" Print</button>
        <button id="hisabPrintBtn" type="button" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs sm:text-sm">🖨️ Print</button>
        <button id="hisabShareBtn" type="button" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm">📄 PDF / WhatsApp</button>
      </div>
    </div>
    <div class="p-3 sm:p-5 max-w-4xl w-full mx-auto">
      <div id="hisabPrintArea" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6">
        <!-- Dynamic Hisab Content -->
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'lot_tracker_v2_data';
      const SYNC_CONFIG_KEY = 'lot_tracker_v2_sync_cfg';
      const USER_KEY = 'lot_tracker_v2_user';
      const USER_SESSION_KEY = 'lot_tracker_v2_session';
      const DEFAULT_EDIT_PIN = '4311';
      const USER_CATEGORIES = ['Master', 'Fabrication', 'Tanki', 'Washing', 'Packing', 'Embroidery', 'Laser', 'Print'];

      const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('lot_tracker_sync_channel') : null;

      let appMode = 'view'; // 'edit' | 'view' (default View Mode)
      let activeSession = null;
      let state = {
        activeUser: 'Shameem',
        editPin: DEFAULT_EDIT_PIN,
        tables: ['Main'],
        activeTable: 'Main',
        rows: [],
        users: [],
        notifications: [],
        savedHisabs: [],
        alterData: {},
        daybook: {},
        settledDaybookKeys: [],
        hisabMeta: {
          master: {},
          embroidery: {},
          fabrication: {},
          washing: {},
          tanki: {},
          packing: {},
          laser: {},
          print: {}
        },
        syncConfig: {
          firebaseUrl: 'https://addis-lot-tracking-default-rtdb.asia-southeast1.firebasedatabase.app',
          roomCode: 'shameem-saleem-factory',
          autoSync: true,
          lastSyncedAt: null
        }
      };

      let currentSearch = '';
      let syncTimer = null;
      let pollTimer = null;
      let isPushPending = false;
      let lastLocalMutationAt = 0;
      let lastCloudUpdatedAt = 0;
      let lastPushFailed = false;

      function todayISO() {
        const d = new Date();
        const off = d.getTimezoneOffset();
        const local = new Date(d.getTime() - off * 60000);
        return local.toISOString().slice(0, 10);
      }

      function formatDateDMY(val) {
        if (!val) return '';
        const m = String(val).match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return `${m[3]}-${m[2]}-${m[1]}`;
        return String(val);
      }

      function getColumnNameSuggestions(dept) {
        const set = new Set();
        state.rows.forEach(r => {
          const n = dept === 'master' ? (r.masterName || '') : (r[dept]?.name || '');
          if (n.trim()) set.add(n.trim());
        });
        return Array.from(set).sort((a, b) => a.localeCompare(b));
      }

      function buildDatalistHtml(id, dept) {
        const list = getColumnNameSuggestions(dept);
        return `<datalist id="${id}">${list.map(n => `<option value="${escapeHtml(n)}"></option>`).join('')}</datalist>`;
      }

      function getRoleConfig() {
        if (!activeSession) {
          return {
            isLoggedIn: false,
            isAdmin: false,
            category: 'Guest',
            userName: '',
            visibleCols: [],
            canAddRow: false,
            canToggleMode: false,
            hisabDept: null
          };
        }
        const isAdmin = activeSession.type === 'admin';
        const category = isAdmin ? 'Admin' : (activeSession.category || 'Packing');
        const userName = activeSession.name || '';
        const allCols = ['lotNo', 'peice', 'size', 'fabric', 'master', 'embroidery', 'fabrication', 'tanki', 'washing', 'packing', 'jama', 'laser', 'print'];
        let visibleCols = allCols;
        if (!isAdmin) {
          if (category === 'Master') {
            visibleCols = ['lotNo', 'peice', 'size', 'fabric', 'master', 'embroidery', 'fabrication', 'laser', 'print'];
          } else if (category === 'Fabrication') {
            visibleCols = ['lotNo', 'peice', 'size', 'fabric', 'master', 'embroidery', 'fabrication', 'tanki'];
          } else if (category === 'Tanki') {
            visibleCols = ['lotNo', 'fabrication', 'tanki', 'washing'];
          } else if (category === 'Washing') {
            visibleCols = ['lotNo', 'tanki', 'washing', 'packing'];
          } else if (category === 'Packing') {
            visibleCols = ['lotNo', 'washing', 'packing', 'jama'];
          } else {
            visibleCols = ['lotNo', 'peice', 'size', 'fabric', category.toLowerCase()];
          }
        }
        return {
          isLoggedIn: true,
          isAdmin,
          category,
          userName,
          visibleCols,
          canAddRow: isAdmin || category === 'Master',
          canToggleMode: isAdmin || ['Master', 'Fabrication', 'Tanki', 'Washing', 'Packing'].includes(category),
          hisabDept: isAdmin ? null : category.toLowerCase()
        };
      }

      function addNotification(notif) {
        if (!Array.isArray(state.notifications)) state.notifications = [];
        state.notifications.unshift(Object.assign({
          id: 'notif_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
          status: 'pending',
          createdAt: Date.now()
        }, notif));
        if (state.notifications.length > 200) state.notifications = state.notifications.slice(0, 200);
        updateNotifBadge();
      }

      function getMyNotifications() {
        const rc = getRoleConfig();
        if (!rc.isLoggedIn || !Array.isArray(state.notifications)) return [];
        if (rc.isAdmin) {
          return state.notifications.filter(n => n.targetRole === 'admin');
        }
        if (rc.category === 'Tanki') {
          return state.notifications.filter(n =>
            n.targetRole === 'tanki' &&
            (!n.targetName || n.targetName.trim().toLowerCase() === rc.userName.trim().toLowerCase())
          );
        }
        return state.notifications.filter(n =>
          n.targetRole === 'user' &&
          n.targetName && n.targetName.trim().toLowerCase() === rc.userName.trim().toLowerCase()
        );
      }

      function updateNotifBadge() {
        const badge = document.getElementById('notifBadge');
        if (!badge) return;
        const pendingCount = getMyNotifications().filter(n => n.status === 'pending').length;
        if (pendingCount > 0) {
          badge.textContent = String(pendingCount);
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      }

      function updateRoleUI() {
        const rc = getRoleConfig();
        const uEl = document.getElementById('activeUserName');
        if (uEl) {
          uEl.textContent = rc.isAdmin ? rc.userName : (rc.isLoggedIn ? `${rc.userName} (${rc.category})` : 'Login');
        }
        const uDot = document.getElementById('activeUserDot');
        if (uDot) {
          uDot.className = 'w-1.5 h-1.5 rounded-full ' + (rc.isAdmin ? 'bg-emerald-400' : 'bg-amber-400');
        }

        const adminOnlyIds = ['alterBtn', 'pendingLotsBtn', 'backupRestoreBtn', 'daybookBtn', 'addTableBtn'];
        adminOnlyIds.forEach(id => {
          const el = document.getElementById(id);
          if (!el) return;
          el.disabled = !rc.isAdmin;
          el.classList.toggle('opacity-40', !rc.isAdmin);
          el.classList.toggle('pointer-events-none', !rc.isAdmin);
        });

        const addRowEl = document.getElementById('addRowBtn');
        if (addRowEl) {
          addRowEl.disabled = !rc.canAddRow;
          addRowEl.classList.toggle('opacity-40', !rc.canAddRow);
          addRowEl.classList.toggle('pointer-events-none', !rc.canAddRow);
        }

        const modeBtn = document.getElementById('appModeToggleBtn');
        if (modeBtn) {
          if (!rc.canToggleMode && appMode !== 'view') {
            appMode = 'view';
            document.body.classList.add('view-mode-active');
            modeBtn.textContent = '👁️ View Mode';
            modeBtn.className = 'inline-flex items-center gap-1 bg-sky-600 hover:bg-sky-700 border border-sky-500 px-2 py-1 rounded-full text-[11px] font-bold text-white shrink-0 whitespace-nowrap transition';
          }
          modeBtn.disabled = !rc.canToggleMode;
          modeBtn.classList.toggle('opacity-50', !rc.canToggleMode);
        }

        const hisabBtn = document.getElementById('hisabDropdownBtn');
        if (hisabBtn) {
          hisabBtn.textContent = rc.isAdmin ? '📒 Hisab ▾' : '📒 My Hisab';
        }
        updateNotifBadge();
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('opacity-0');
        el.classList.add('opacity-100');
        clearTimeout(el._t);
        el._t = setTimeout(() => {
          el.classList.remove('opacity-100');
          el.classList.add('opacity-0');
        }, 2500);
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function normalizeLotNo(val) {
        const s = String(val || '').trim();
        if (!s) return '';
        const pureNum = s.match(/^0*(\d+)$/);
        if (pureNum) return String(parseInt(pureNum[1], 10));
        const sufNum = s.match(/^0*(\d+)([A-Za-z]+)$/);
        if (sufNum) return String(parseInt(sufNum[1], 10)) + sufNum[2];
        return s;
      }

      function uid() {
        return 'lot_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      function createEmptyPackingLines() {
        return [
          { date: '', peice: '', rate: '', ripit: '', name: '' },
          { date: '', peice: '', rate: '', ripit: '', name: '' },
          { date: '', peice: '', rate: '', ripit: '', name: '' },
          { date: '', peice: '', rate: '', ripit: '', name: '' }
        ];
      }

      function createRow(lotNo, tableKey) {
        return {
          id: uid(),
          tableKey: tableKey || state.activeTable || 'Main',
          lotNo: lotNo !== undefined ? normalizeLotNo(lotNo) : '',
          date: todayISO(),
          peice: '',
          size: '',
          fabric: '',
          masterName: '',
          masterPaid: false,
          embroidery: { enabled: false, date: '', peice: '', rate: '', name: '', paid: false },
          fabrication: { rate: '', name: '', goneEntries: [{ date: '', peice: '' }], status: 'Pending', paid: false },
          tanki: { rate: '', name: '', goneEntries: [{ date: '', peice: '' }], status: 'Pending', paid: false },
          washing: { washingType: '', rate: '', name: '', goneEntries: [{ date: '', peice: '' }], status: 'Pending', paid: false },
          packing: { rate: '', name: '', goneEntries: [{ date: '', peice: '', ripit: '' }], status: 'Pending', paid: false },
          laser: { enabled: false, date: '', peice: '', name: '', paid: false },
          print: { enabled: false, date: '', peice: '', name: '', paid: false },
          updatedBy: state.activeUser,
          updatedAt: Date.now()
        };
      }

      function seedInitialData() {
        const r1 = createRow('101');
        r1.date = todayISO();
        r1.peice = '120';
        r1.size = '28-34';
        r1.fabric = '3/1 Denim';
        r1.masterName = 'Master Akram';
        r1.embroidery = { enabled: true, date: todayISO(), peice: '120', rate: '12', name: 'Raju Emb', paid: false };
        r1.fabrication = { rate: '45', name: 'Imran Fab', goneEntries: [{ date: todayISO(), peice: '100' }], paid: false };

        const r2 = createRow('102');
        r2.date = todayISO();
        r2.peice = '80';
        r2.size = '30-36';
        r2.fabric = 'Knitted';
        r2.masterName = 'Master Akram';
        r2.masterPaid = false;

        state.rows = [r1, r2];
      }

      function normalizeRowStages(r) {
        if (!r.laser && r.damage) { r.laser = r.damage; delete r.damage; }
        if (!r.laser) r.laser = { enabled: false, date: '', peice: '', name: '', paid: false };
        if (r.laser.enabled === undefined) {
          r.laser.enabled = !!(r.laser.name || r.laser.peice || r.laser.paid);
        }
        if (!r.embroidery) r.embroidery = { enabled: false, date: '', peice: '', rate: '', name: '', paid: false };
        if (r.embroidery.enabled === undefined) {
          r.embroidery.enabled = !!(r.embroidery.name || r.embroidery.peice || r.embroidery.paid);
        }
        if (!r.print) r.print = { enabled: false, date: '', peice: '', name: '', paid: false };
        if (r.print.enabled === undefined) {
          r.print.enabled = !!(r.print.name || r.print.peice || r.print.paid);
        }

        ['fabrication', 'tanki', 'washing'].forEach(d => {
          if (!r[d]) r[d] = { rate: '', name: '', goneEntries: [{ date: '', peice: '' }], status: 'Pending', paid: false };
          if (!r[d].status) r[d].status = 'Pending';
          if (!Array.isArray(r[d].goneEntries)) {
            r[d].goneEntries = (r[d].peice || r[d].date)
              ? [{ date: r[d].date || '', peice: r[d].peice || '' }]
              : [{ date: '', peice: '' }];
          }
          if (r[d].goneEntries.length === 0) r[d].goneEntries.push({ date: '', peice: '' });
        });

        if (!r.packing) r.packing = { rate: '', name: '', goneEntries: [{ date: '', peice: '', ripit: '' }], status: 'Pending', paid: false };
        if (!r.packing.status) r.packing.status = 'Pending';
        if (!Array.isArray(r.packing.goneEntries)) {
          const oldLines = Array.isArray(r.packing.lines) ? r.packing.lines.filter(l => l.peice || l.date || l.name) : [];
          const firstNamed = oldLines.find(l => l.name);
          if (!r.packing.name && firstNamed) r.packing.name = firstNamed.name;
          if (!r.packing.rate && firstNamed) r.packing.rate = firstNamed.rate || '';
          r.packing.goneEntries = oldLines.length
            ? oldLines.map(l => ({ date: l.date || '', peice: l.peice || '', ripit: l.ripit || '' }))
            : [{ date: '', peice: '', ripit: '' }];
        }
        if (r.packing.goneEntries.length === 0) r.packing.goneEntries.push({ date: '', peice: '', ripit: '' });
        if (r.lotNo) r.lotNo = normalizeLotNo(r.lotNo);
        const suf = (r.lotNo || '').match(/^\d+([A-Za-z]+)$/);
        if (suf) {
          const letter = suf[1].toUpperCase();
          r.tableKey = letter;
          if (!state.tables.includes(letter)) state.tables.push(letter);
        } else if (/^\d+$/.test(r.lotNo || '')) {
          r.tableKey = 'Main';
        } else if (!r.tableKey) {
          r.tableKey = 'Main';
        }
        return r;
      }

      function parseLotSortKey(lotNo) {
        const s = normalizeLotNo(lotNo);
        const m = s.match(/^(\d+)([A-Za-z]*)$/);
        if (m) return { num: parseInt(m[1], 10), suf: m[2].toUpperCase(), raw: s };
        return { num: Number.MAX_SAFE_INTEGER, suf: s.toUpperCase(), raw: s };
      }

      function deduplicateAndSortRows() {
        const seen = new Map();
        const deduped = [];
        state.rows.forEach(rawRow => {
          const r = normalizeRowStages(rawRow);
          const key = (r.tableKey || 'Main') + '::' + (r.lotNo || r.id).toLowerCase();
          if (!r.lotNo) {
            deduped.push(r);
            return;
          }
          if (seen.has(key)) {
            const existing = seen.get(key);
            if (!existing.peice && r.peice) existing.peice = r.peice;
            if (!existing.size && r.size) existing.size = r.size;
            if (!existing.fabric && r.fabric) existing.fabric = r.fabric;
            if (!existing.masterName && r.masterName) existing.masterName = r.masterName;
            if (r.masterPaid) existing.masterPaid = true;
            ['embroidery', 'laser', 'print'].forEach(d => {
              if (!existing[d]?.name && r[d]?.name) existing[d] = r[d];
              if (r[d]?.paid) existing[d].paid = true;
            });
            ['fabrication', 'tanki', 'washing', 'packing'].forEach(d => {
              if (!existing[d]?.name && r[d]?.name) existing[d].name = r[d].name;
              if (!existing[d]?.rate && r[d]?.rate) existing[d].rate = r[d].rate;
              if (r[d]?.status === 'Clear') existing[d].status = 'Clear';
              if (r[d]?.paid) existing[d].paid = true;
            });
          } else {
            seen.set(key, r);
            deduped.push(r);
          }
        });

        deduped.sort((a, b) => {
          const ka = parseLotSortKey(a.lotNo);
          const kb = parseLotSortKey(b.lotNo);
          if (ka.suf !== kb.suf) return ka.suf.localeCompare(kb.suf);
          if (ka.num !== kb.num) return ka.num - kb.num;
          return ka.raw.localeCompare(kb.raw);
        });
        state.rows = deduped;
      }

      function fillMissingLotsUpTo(enteredLot, excludeRowId) {
        const norm = normalizeLotNo(enteredLot);
        if (!norm) return;
        const sufMatch = norm.match(/^(\d+)([A-Za-z]+)$/);
        if (sufMatch) {
          const targetNum = parseInt(sufMatch[1], 10);
          const suf = sufMatch[2];
          const tKey = suf.toUpperCase();
          if (!state.tables.includes(tKey)) state.tables.push(tKey);
          let maxSufNum = 0;
          state.rows.forEach(r => {
            if (r.id === excludeRowId) return;
            const m = normalizeLotNo(r.lotNo).match(/^(\d+)([A-Za-z]+)$/);
            if (m && m[2].toLowerCase() === suf.toLowerCase()) {
              const n = parseInt(m[1], 10);
              if (n > maxSufNum) maxSufNum = n;
            }
          });
          if (maxSufNum > 0 && targetNum > maxSufNum + 1 && (targetNum - maxSufNum) <= 500) {
            for (let n = maxSufNum + 1; n < targetNum; n++) {
              const lotStr = String(n) + suf;
              if (!state.rows.some(r => normalizeLotNo(r.lotNo).toLowerCase() === lotStr.toLowerCase())) {
                state.rows.push(createRow(lotStr, tKey));
              }
            }
          }
        } else if (/^\d+$/.test(norm)) {
          const targetNum = parseInt(norm, 10);
          let maxNum = 0;
          state.rows.forEach(r => {
            if (r.id === excludeRowId) return;
            const l = normalizeLotNo(r.lotNo);
            if (/^\d+$/.test(l)) {
              const n = parseInt(l, 10);
              if (n > maxNum) maxNum = n;
            }
          });
          if (maxNum > 0 && targetNum > maxNum + 1 && (targetNum - maxNum) <= 500) {
            for (let n = maxNum + 1; n < targetNum; n++) {
              const lotStr = String(n);
              if (!state.rows.some(r => normalizeLotNo(r.lotNo) === lotStr)) {
                state.rows.push(createRow(lotStr, 'Main'));
              }
            }
          }
        }
      }

      function loadLocalState() {
        try {
          const savedUser = localStorage.getItem(USER_KEY);
          if (savedUser === 'Shameem' || savedUser === 'Saleem') {
            state.activeUser = savedUser;
          }
          const savedSess = localStorage.getItem(USER_SESSION_KEY);
          if (savedSess) {
            const sObj = JSON.parse(savedSess);
            if (sObj && sObj.name && (sObj.type === 'admin' || sObj.type === 'user')) {
              activeSession = sObj;
              state.activeUser = sObj.name;
            }
          }

          const savedSync = localStorage.getItem(SYNC_CONFIG_KEY);
          if (savedSync) {
            const parsedSync = JSON.parse(savedSync);
            state.syncConfig = Object.assign(state.syncConfig, parsedSync);
            if (!state.syncConfig.firebaseUrl) state.syncConfig.firebaseUrl = 'https://addis-lot-tracking-default-rtdb.asia-southeast1.firebasedatabase.app';
          }
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.rows)) {
              if (parsed.editPin) state.editPin = String(parsed.editPin);
              if (Array.isArray(parsed.tables) && parsed.tables.length) state.tables = parsed.tables;
              if (parsed.activeTable && state.tables.includes(parsed.activeTable)) state.activeTable = parsed.activeTable;
              state.rows = parsed.rows.map(normalizeRowStages);
              deduplicateAndSortRows();
              state.users = Array.isArray(parsed.users) ? parsed.users : [];
              state.notifications = Array.isArray(parsed.notifications) ? parsed.notifications : [];
              state.savedHisabs = Array.isArray(parsed.savedHisabs) ? parsed.savedHisabs : [];
              state.alterData = (parsed.alterData && typeof parsed.alterData === 'object') ? parsed.alterData : {};
              state.daybook = (parsed.daybook && typeof parsed.daybook === 'object') ? parsed.daybook : {};
              state.settledDaybookKeys = Array.isArray(parsed.settledDaybookKeys) ? parsed.settledDaybookKeys : [];
              state.hisabMeta = Object.assign({ master: {}, embroidery: {}, fabrication: {}, washing: {}, tanki: {}, packing: {}, laser: {}, print: {} }, parsed.hisabMeta || {});
              if (parsed.updatedAt) lastLocalMutationAt = Number(parsed.updatedAt) || 0;
              return;
            }
          }
        } catch (e) {
          // Ignore storage errors in restricted environments
        }
        seedInitialData();
      }

      function saveLocalState(skipBroadcast) {
        try {
          localStorage.setItem(USER_KEY, state.activeUser);
          if (activeSession) localStorage.setItem(USER_SESSION_KEY, JSON.stringify(activeSession)); else localStorage.removeItem(USER_SESSION_KEY);
          localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(state.syncConfig));
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            editPin: state.editPin,
            tables: state.tables,
            activeTable: state.activeTable,
            rows: state.rows,
            users: state.users,
            notifications: state.notifications,
            savedHisabs: state.savedHisabs,
            alterData: state.alterData,
            daybook: state.daybook,
            settledDaybookKeys: state.settledDaybookKeys,
            hisabMeta: state.hisabMeta,
            updatedAt: Date.now()
          }));
        } catch (e) {
          // Ignore storage quota errors
        }
        if (!skipBroadcast && bc) {
          bc.postMessage({
            type: 'SYNC_UPDATE',
            rows: state.rows,
            users: state.users,
            notifications: state.notifications,
            savedHisabs: state.savedHisabs,
            hisabMeta: state.hisabMeta
          });
        }
        if (!skipBroadcast) {
          lastLocalMutationAt = Date.now();
          if (getFirebaseEndpoint() && state.syncConfig.autoSync) isPushPending = true;
        }
        updateNotifBadge();
        scheduleCloudPush();
      }

      function updateSyncBadge(status, text) {
        const dot = document.getElementById('syncStatusDot');
        const btn = document.getElementById('syncSettingsBtn');
        if (dot) {
          dot.className = 'w-1.5 h-1.5 rounded-full ' + (
            status === 'synced' ? 'bg-emerald-400' :
            status === 'syncing' ? 'bg-amber-400 animate-pulse' :
            status === 'error' ? 'bg-rose-400' : 'bg-sky-400'
          );
        }
        if (btn) btn.title = 'Settings & Sync (' + text + ')';
      }

      function getFirebaseEndpoint() {
        const base = (state.syncConfig.firebaseUrl || '').trim().replace(/^https?:/i, m => m.toLowerCase()).replace(/\/+$/, '');
        const room = (state.syncConfig.roomCode || 'default-room').trim().replace(/[^a-zA-Z0-9_-]/g, '');
        if (!base) return null;
        return base + '/lot_tracker/' + room + '.json';
      }

      function scheduleCloudPush() {
        const url = getFirebaseEndpoint();
        if (!url || !state.syncConfig.autoSync) {
          updateSyncBadge('local', 'Local Auto-Sync');
          return;
        }
        updateSyncBadge('syncing', 'Syncing...');
        clearTimeout(syncTimer);
        syncTimer = setTimeout(async () => {
          try {
            const pushTs = Date.now();
            const res = await fetch(url, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                editPin: state.editPin,
                tables: state.tables,
                activeTable: state.activeTable,
                rows: state.rows,
                users: state.users,
                notifications: state.notifications,
                savedHisabs: state.savedHisabs,
                alterData: state.alterData,
                daybook: state.daybook,
                settledDaybookKeys: state.settledDaybookKeys,
                hisabMeta: state.hisabMeta,
                updatedBy: state.activeUser,
                updatedAt: pushTs
              })
            });
            if (res.ok) {
              isPushPending = false;
              lastPushFailed = false;
              lastCloudUpdatedAt = pushTs;
              state.syncConfig.lastSyncedAt = pushTs;
              updateSyncBadge('synced', 'Cloud Synced');
            } else {
              isPushPending = false;
              lastPushFailed = true;
              updateSyncBadge('error', 'Sync Error ' + res.status);
              if (res.status === 401 || res.status === 403) {
                showToast('Firebase Permission Denied (' + res.status + ')! Firebase Rules me read/write true karein.');
              }
            }
          } catch (err) {
            isPushPending = false;
            lastPushFailed = true;
            updateSyncBadge('error', 'Offline (Saved)');
          }
        }, 600);
      }

      async function pullFromCloud(silent) {
        const url = getFirebaseEndpoint();
        if (!url) return;
        if (silent && isPushPending) return;
        try {
          const res = await fetch(url);
          if (!res.ok) {
            if (!silent && (res.status === 401 || res.status === 403)) {
              showToast('Firebase Permission Denied (' + res.status + ')! Rules check karein.');
            }
            return;
          }
          const data = await res.json();
          if (silent && (isPushPending || lastPushFailed)) return;
          if (silent && data && data.updatedAt && data.updatedAt === lastCloudUpdatedAt) return;
          if (data && Array.isArray(data.rows)) {
            if (data.updatedAt) lastCloudUpdatedAt = data.updatedAt;
            if (data.editPin) state.editPin = String(data.editPin);
            if (Array.isArray(data.tables) && data.tables.length) {
              const tSet = new Set([...(state.tables || ['Main']), ...data.tables]);
              state.tables = Array.from(tSet);
              if (!state.tables.includes(state.activeTable)) state.activeTable = state.tables[0] || 'Main';
            }

            // Smart row-level merge: never drop local rows that aren't in cloud yet
            const rowKeyOf = (r) => {
              const norm = normalizeLotNo(r.lotNo || '');
              return norm ? ((r.tableKey || 'Main') + '::' + norm.toLowerCase()) : ('id::' + r.id);
            };
            const mergedMap = new Map();
            let localHadNewer = false;
            (state.rows || []).forEach(lr => {
              const nr = normalizeRowStages(lr);
              mergedMap.set(rowKeyOf(nr), nr);
            });
            data.rows.forEach(crRaw => {
              const cr = normalizeRowStages(crRaw);
              const k = rowKeyOf(cr);
              const existing = mergedMap.get(k);
              if (!existing) {
                mergedMap.set(k, cr);
              } else {
                const lTs = Number(existing.updatedAt) || 0;
                const cTs = Number(cr.updatedAt) || 0;
                if (cTs > lTs) {
                  mergedMap.set(k, cr);
                } else if (lTs > cTs) {
                  localHadNewer = true;
                }
              }
            });
            state.rows = Array.from(mergedMap.values());
            deduplicateAndSortRows();

            // Merge users by id
            const userMap = new Map();
            (state.users || []).forEach(u => userMap.set(u.id, u));
            (Array.isArray(data.users) ? data.users : []).forEach(cu => {
              const lu = userMap.get(cu.id);
              if (!lu || (lu.status === 'pending' && cu.status !== 'pending')) userMap.set(cu.id, cu);
            });
            state.users = Array.from(userMap.values());

            // Merge notifications by id
            const notifMap = new Map();
            (state.notifications || []).forEach(n => notifMap.set(n.id, n));
            (Array.isArray(data.notifications) ? data.notifications : []).forEach(cn => {
              const ln = notifMap.get(cn.id);
              if (!ln || (ln.status === 'pending' && cn.status !== 'pending')) notifMap.set(cn.id, cn);
            });
            state.notifications = Array.from(notifMap.values()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 200);

            // Merge savedHisabs by id
            const hisabMap = new Map();
            (state.savedHisabs || []).forEach(h => hisabMap.set(h.id, h));
            (Array.isArray(data.savedHisabs) ? data.savedHisabs : []).forEach(ch => {
              if (!hisabMap.has(ch.id)) hisabMap.set(ch.id, ch);
            });
            state.savedHisabs = Array.from(hisabMap.values());

            if (data.alterData && typeof data.alterData === 'object') {
              state.alterData = Object.assign({}, data.alterData, state.alterData);
            }
            if (data.daybook && typeof data.daybook === 'object') {
              state.daybook = Object.assign({}, data.daybook, state.daybook);
            }
            if (Array.isArray(data.settledDaybookKeys)) {
              state.settledDaybookKeys = Array.from(new Set([...(state.settledDaybookKeys || []), ...data.settledDaybookKeys]));
            }
            if (data.hisabMeta && typeof data.hisabMeta === 'object') {
              Object.keys(data.hisabMeta).forEach(dept => {
                state.hisabMeta[dept] = Object.assign({}, data.hisabMeta[dept] || {}, state.hisabMeta[dept] || {});
              });
            }

            if (data.updatedAt) lastLocalMutationAt = Math.max(lastLocalMutationAt, Number(data.updatedAt) || 0);
            saveLocalState(true);
            if (localHadNewer) scheduleCloudPush();
            updateRoleUI();
            const isTypingInTable = document.activeElement && document.activeElement.closest && document.activeElement.closest('#lotTableBody');
            if (!isTypingInTable) renderTable();
            updateSyncBadge('synced', 'Cloud Synced');
            if (!silent) showToast('Cloud data synced!');
          }
        } catch (err) {
          if (!silent) showToast('Offline: using local data');
        }
      }

      function startSyncPolling() {
        clearInterval(pollTimer);
        if (!state.syncConfig.autoSync) {
          clearTimeout(syncTimer);
          isPushPending = false;
          updateSyncBadge('local', 'Live Sync OFF');
          return;
        }
        if (getFirebaseEndpoint() && state.syncConfig.autoSync) {
          pullFromCloud(true);
          pollTimer = setInterval(() => pullFromCloud(true), 4000);
        }
      }

      if (bc) {
        bc.onmessage = (ev) => {
          if (ev.data && ev.data.type === 'SYNC_UPDATE') {
            state.rows = ev.data.rows;
            if (ev.data.users) state.users = ev.data.users;
            if (ev.data.notifications) state.notifications = ev.data.notifications;
            state.savedHisabs = ev.data.savedHisabs || state.savedHisabs;
            state.hisabMeta = ev.data.hisabMeta || state.hisabMeta;
            updateRoleUI();
            renderTable();
            updateSyncBadge('synced', 'Tab Synced');
          }
        };
      }

      function getStageComeEntries(row, dept) {
        if (dept === 'fabrication') {
          return (row.peice || row.date) ? [{ date: row.date || '', peice: row.peice || '' }] : [];
        }
        if (dept === 'tanki') {
          return (row.fabrication?.goneEntries || []).filter(g => (g.peice || '').trim() !== '' || (g.date || '').trim() !== '');
        }
        if (dept === 'washing') {
          return (row.tanki?.goneEntries || []).filter(g => (g.peice || '').trim() !== '' || (g.date || '').trim() !== '');
        }
        if (dept === 'packing') {
          return (row.washing?.goneEntries || []).filter(g => (g.peice || '').trim() !== '' || (g.date || '').trim() !== '');
        }
        return [];
      }

      function getStageTotals(row, dept) {
        const comeList = getStageComeEntries(row, dept);
        const goneList = (row[dept]?.goneEntries || []).filter(g => (g.peice || '').trim() !== '' || (g.date || '').trim() !== '');
        const come = comeList.reduce((s, x) => s + (parseFloat(x.peice) || 0), 0);
        const gone = goneList.reduce((s, x) => s + (parseFloat(x.peice) || 0), 0);
        return { come, gone, balance: come - gone, comeList, goneList };
      }

      function getPackingTotalPeice(row) {
        return getStageTotals(row, 'packing').gone;
      }

      function applyJamaAutoClear(row) {
        if (!row) return;
        const jama = getPackingTotalPeice(row);
        if (jama > 0) {
          ['fabrication', 'tanki', 'washing'].forEach(d => {
            if (row[d]) row[d].status = 'Clear';
          });
          const basePcs = parseFloat(row.peice) || getStageTotals(row, 'packing').come || 0;
          if (basePcs > 0 && jama >= basePcs * 0.9) {
            if (row.packing) row.packing.status = 'Clear';
          }
        }
      }

      function getPackingPrimaryName(row) {
        return (row.packing?.name || '').trim();
      }

      function renderTableTabs() {
        const container = document.getElementById('tableTabsList');
        if (!container) return;
        container.innerHTML = state.tables.map(t => {
          const isActive = t === state.activeTable;
          const count = state.rows.filter(r => (r.tableKey || 'Main') === t).length;
          return `<button type="button" data-switch-table="${escapeHtml(t)}" class="px-3 py-1 rounded-md text-xs font-extrabold shrink-0 transition ${isActive ? 'bg-amber-500 text-zinc-950 shadow' : 'bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700'}">
            ${escapeHtml(t === 'Main' ? 'Main Table' : 'Table ' + t)} <span class="opacity-75 text-[10px]">(${count})</span>
          </button>`;
        }).join('');
        container.querySelectorAll('[data-switch-table]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.activeTable = btn.getAttribute('data-switch-table');
            saveLocalState(true);
            renderTable();
            scrollToLatestLot();
          });
        });
      }

      function renderTable() {
        renderTableTabs();
        const rc = getRoleConfig();
        if (!rc.isLoggedIn) {
          const tbody = document.getElementById('lotTableBody');
          if (tbody) tbody.innerHTML = '';
          return;
        }
        const visSet = new Set(rc.visibleCols);
        const tblEl = document.getElementById('mainTableElement');
        if (tblEl) {
          tblEl.classList.toggle('min-w-[1250px]', rc.isAdmin);
          tblEl.classList.toggle('min-w-full', !rc.isAdmin);
        }
        document.querySelectorAll('#mainTableElement thead th[data-col]').forEach(th => {
          th.classList.toggle('hidden', !visSet.has(th.getAttribute('data-col')));
        });
        const colClass = (col) => visSet.has(col) ? '' : 'hidden';

        const tbody = document.getElementById('lotTableBody');
        const q = currentSearch.trim().toLowerCase();
        let tableRows = state.rows.filter(r => (r.tableKey || 'Main') === state.activeTable);
        if (!rc.isAdmin && rc.category !== 'Master') {
          const uname = rc.userName.trim().toLowerCase();
          tableRows = tableRows.filter(r => {
            if (rc.category === 'Fabrication') return (r.fabrication?.name || '').trim().toLowerCase() === uname;
            if (rc.category === 'Tanki') return (r.tanki?.name || '').trim().toLowerCase() === uname;
            if (rc.category === 'Washing') return (r.washing?.name || '').trim().toLowerCase() === uname;
            if (rc.category === 'Packing') return getPackingPrimaryName(r).trim().toLowerCase() === uname;
            const dKey = rc.category.toLowerCase();
            return (r[dKey]?.name || '').trim().toLowerCase() === uname;
          });
        }

        const filtered = tableRows.filter(r => {
          if (!q) return true;
          return [
            r.lotNo, r.size, r.fabric, r.masterName,
            r.embroidery?.name, r.fabrication?.name, r.tanki?.name,
            r.washing?.name, getPackingPrimaryName(r), r.laser?.name, r.print?.name
          ].some(v => (v || '').toLowerCase().includes(q));
        });

        let totalPcs = 0;
        let totalJama = 0;
        tableRows.forEach(r => {
          totalPcs += parseFloat(r.peice) || 0;
          totalJama += getPackingTotalPeice(r);
        });
        document.getElementById('totalLotsCount').textContent = tableRows.length;
        document.getElementById('totalPiecesCount').textContent = totalPcs;
        document.getElementById('totalJamaCount').textContent = totalJama;

        if (!filtered.length) {
          const emptyMsg = (!rc.isAdmin && rc.category !== 'Master')
            ? `Aapke naam (<strong>${escapeHtml(rc.userName)}</strong> — ${escapeHtml(rc.category)}) ke koi lots is table me nahi mile.`
            : 'No lots found. Click <strong>+ Add Row</strong> to start.';
          tbody.innerHTML = `<tr><td colspan="13" class="text-center py-8 text-slate-400">${emptyMsg}</td></tr>`;
          return;
        }

        tbody.innerHTML = filtered.map((row, idx) => {
          const isFirst = idx === 0 && !q;
          const jamaTotal = getPackingTotalPeice(row);
          const packName = getPackingPrimaryName(row);
          const isBlackoutForMaster = (!rc.isAdmin && rc.category === 'Master' && row.createdByRole === 'Master' && !row.masterFinalSubmitted);
          const blackTdCls = isBlackoutForMaster ? 'bg-black text-black border-zinc-900 pointer-events-none select-none' : '';
          const canInlineEdit = rc.isAdmin && appMode === 'edit';

          function renderJobCell(cellType, data, stageStats) {
            const hideCls = colClass(cellType);
            if (isBlackoutForMaster) {
              return `<td class="${hideCls} px-2 py-2 border-r bg-black border-zinc-900 text-black select-none pointer-events-none"><div class="opacity-0">.</div></td>`;
            }
            if ((cellType === 'embroidery' || cellType === 'laser' || cellType === 'print') && !data?.enabled) {
              return `<td data-row-id="${row.id}" data-cell="${cellType}" data-disabled-job="1" class="${hideCls} cell-trigger cursor-not-allowed px-2 py-2 border-r border-blue-500 bg-blue-700 text-white text-center align-middle select-none">
                <div class="text-2xl font-extrabold leading-none tracking-tight">X</div>
              </td>`;
            }
            const hasName = (data?.name || '').trim() !== '';
            const isStage = !!stageStats;
            const isClear = isStage && data?.status === 'Clear';
            const paidClass = data?.paid
              ? (data?.paidLight ? 'cell-paid-light' : 'cell-paid-bright')
              : (isClear ? 'cell-status-clear' : 'hover:bg-zinc-800/80');

            let subHtml = '';
            if (isStage) {
              if (stageStats.come || stageStats.gone) {
                const balColor = data?.paid ? 'text-rose-200' : (isClear ? 'text-rose-700' : 'text-rose-400');
                subHtml = `<div class="sub-text text-[11px] ${data?.paid ? 'text-emerald-100' : (isClear ? 'text-zinc-800' : 'text-zinc-300')} mt-0.5 font-medium">${stageStats.come} - ${stageStats.gone} <span class="${balColor} font-bold">(${stageStats.balance})</span></div>`;
              }
            } else if (data?.peice) {
              subHtml = `<div class="sub-text text-[11px] ${data?.paid ? 'text-emerald-100' : (isClear ? 'text-zinc-800' : 'text-zinc-400')} mt-0.5">${escapeHtml(data.peice + ' pcs')}</div>`;
            }

            const statusBtnHtml = isStage
              ? `<div class="mt-1"><button type="button" ${rc.isAdmin ? `data-toggle-stage-status="${row.id}" data-stage-dept="${cellType}"` : 'disabled'} class="px-2 py-0.5 rounded-full text-[10px] font-bold border transition ${isClear ? 'bg-amber-400 border-amber-600 text-zinc-950' : 'bg-zinc-800 border-zinc-600 text-zinc-300'}">${isClear ? 'Clear' : 'Pending'}</button></div>`
              : '';

            return `<td data-row-id="${row.id}" data-cell="${cellType}" class="${hideCls} cell-trigger cursor-pointer px-2 py-2 border-r border-zinc-800 text-center align-middle transition ${paidClass}">
              ${hasName ? `<div class="font-semibold text-xs sm:text-sm leading-tight">${escapeHtml(data.name)}</div>` : `<div class="text-zinc-600 text-xs">+ Entry</div>`}
              ${subHtml}
              ${statusBtnHtml}
            </td>`;
          }

          return `<tr class="hover:bg-zinc-900/60 transition">
            <!-- Lot no (Bold, always visible; inline edit for Admin in Edit Mode) -->
            <td class="${colClass('lotNo')} sticky-lot px-2 py-2 border-r border-zinc-800 text-center">
              ${canInlineEdit
                ? `<input type="text" data-lot-input="${row.id}" value="${escapeHtml(row.lotNo)}" placeholder="${isFirst ? 'Lot #' : ''}" class="lot-bold w-full min-w-[52px] text-center bg-transparent border border-transparent hover:border-zinc-600 focus:border-amber-400 focus:bg-zinc-900 rounded px-1 py-1 text-amber-400 text-sm focus:outline-none" />`
                : `<div class="lot-bold text-amber-400 text-sm py-1 text-center min-w-[48px]">${escapeHtml(row.lotNo || '-')}</div>`}
            </td>

            <!-- piece (Click opens entry modal) -->
            <td data-row-id="${row.id}" data-cell="peice" class="${colClass('peice')} cell-trigger cursor-pointer px-2 py-2 border-r border-zinc-800 text-center hover:bg-zinc-800/80 transition">
              ${row.peice ? `<div class="font-bold text-white">${escapeHtml(row.peice)}</div><div class="text-[10px] text-zinc-400">${escapeHtml(formatDateDMY(row.date))}</div>` : `<span class="text-amber-400 text-xs font-medium">+ Piece</span>`}
            </td>

            <!-- size -->
            <td class="${colClass('size')} px-1.5 py-2 border-r border-zinc-800 text-center ${blackTdCls}">
              ${isBlackoutForMaster ? '<span class="opacity-0">.</span>' : `<input type="text" ${!canInlineEdit ? 'readonly disabled' : ''} data-inline-field="size" data-row-id="${row.id}" value="${escapeHtml(row.size)}" placeholder="-" class="w-full text-center bg-transparent border border-transparent hover:border-zinc-600 focus:border-amber-400 focus:bg-zinc-900 rounded px-1 py-1 text-zinc-200 text-xs sm:text-sm focus:outline-none" />`}
            </td>

            <!-- fabric -->
            <td class="${colClass('fabric')} px-1.5 py-2 border-r border-zinc-800 text-center ${blackTdCls}">
              ${isBlackoutForMaster ? '<span class="opacity-0">.</span>' : `<input type="text" ${!canInlineEdit ? 'readonly disabled' : ''} data-inline-field="fabric" data-row-id="${row.id}" value="${escapeHtml(row.fabric)}" placeholder="-" class="w-full text-center bg-transparent border border-transparent hover:border-zinc-600 focus:border-amber-400 focus:bg-zinc-900 rounded px-1 py-1 text-zinc-200 text-xs sm:text-sm focus:outline-none" />`}
            </td>

            <!-- Master -->
            <td data-row-id="${row.id}" data-cell="master" class="${colClass('master')} ${isBlackoutForMaster ? blackTdCls : `cell-trigger cursor-pointer px-2 py-2 border-r border-zinc-800 text-center transition ${row.masterPaid ? (row.masterPaidLight ? 'cell-paid-light' : 'cell-paid-bright') : 'hover:bg-zinc-800/80'}`}">
              ${isBlackoutForMaster ? '<span class="opacity-0">.</span>' : (row.masterName ? `<div class="font-semibold text-xs sm:text-sm">${escapeHtml(row.masterName)}</div><div class="sub-text text-[10px] ${row.masterPaid ? 'text-emerald-100' : 'text-zinc-400'}">${row.masterPaid ? 'PAID' : 'Unpaid'}</div>` : `<span class="text-zinc-600 text-xs">-</span>`)}
            </td>

            <!-- Embroidery -->
            ${renderJobCell('embroidery', row.embroidery)}

            <!-- Fabrication -->
            ${renderJobCell('fabrication', row.fabrication, getStageTotals(row, 'fabrication'))}

            <!-- Tanki -->
            ${renderJobCell('tanki', row.tanki, getStageTotals(row, 'tanki'))}

            <!-- washing -->
            ${renderJobCell('washing', row.washing, getStageTotals(row, 'washing'))}

            <!-- packing -->
            ${renderJobCell('packing', { name: packName, status: row.packing?.status, paid: row.packing?.paid, paidLight: row.packing?.paidLight }, getStageTotals(row, 'packing'))}

            <!-- Jama -->
            ${(() => {
              const basePcs = parseFloat(row.peice) || getStageTotals(row, 'packing').come || 0;
              const isJamaDone = basePcs > 0 && jamaTotal >= basePcs * 0.9;
              return `<td class="${colClass('jama')} px-2 py-2 border-r text-center transition ${isJamaDone ? 'bg-green-700 border-green-500 text-white' : 'bg-rose-700 border-rose-500 text-white'}">
                <div class="font-extrabold text-sm">${jamaTotal || 0}</div>
                <div class="text-[10px] font-semibold ${isJamaDone ? 'text-emerald-100' : 'text-rose-100'}">${basePcs > 0 ? Math.round((jamaTotal / basePcs) * 100) + '% Jama' : 'Jama'}</div>
              </td>`;
            })()}

            <!-- Laser -->
            ${renderJobCell('laser', row.laser)}

            <!-- Print -->
            ${renderJobCell('print', row.print)}
          </tr>`;
        }).join('');
      }

      function getNextTableLetter() {
        const letters = state.tables.filter(t => t !== 'Main');
        if (!letters.length) return 'A';
        const last = letters[letters.length - 1];
        if (last.length === 1 && last < 'Z') {
          return String.fromCharCode(last.charCodeAt(0) + 1);
        }
        return 'T' + (letters.length + 1);
      }

      function addNewTable() {
        if (appMode === 'view') return;
        const nextKey = getNextTableLetter();
        state.tables.push(nextKey);
        state.activeTable = nextKey;
        const firstLot = '1' + nextKey;
        state.rows.push(createRow(firstLot, nextKey));
        saveLocalState();
        renderTable();
        showToast('Table ' + nextKey + ' added (Lot ' + firstLot + ')');
      }

      function getNextLotNo(tableKey) {
        const tKey = tableKey || state.activeTable || 'Main';
        const tRows = state.rows.filter(r => (r.tableKey || 'Main') === tKey);
        if (tRows.length === 0) {
          return tKey === 'Main' ? '1' : ('1' + tKey);
        }
        const lastLot = normalizeLotNo(tRows[tRows.length - 1].lotNo || '');
        const suffixMatch = lastLot.match(/^(\d+)([A-Za-z]+)$/);
        if (suffixMatch) {
          const num = parseInt(suffixMatch[1], 10) + 1;
          return String(num) + suffixMatch[2];
        }
        const match = lastLot.match(/^(.*?)(\d+)$/);
        if (match) {
          const prefix = match[1];
          const num = parseInt(match[2], 10) + 1;
          return prefix + String(num);
        }
        if (lastLot === '') {
          return tKey === 'Main' ? String(tRows.length + 1) : (String(tRows.length + 1) + tKey);
        }
        return lastLot + '-2';
      }

      function addNewRow() {
        const rc = getRoleConfig();
        if (!rc.canAddRow) {

          return;
        }

          currentSearch = '';
          const si = document.getElementById('searchInput');
          const cb = document.getElementById('clearSearchBtn');
          if (si) si.value = '';
          if (cb) cb.classList.add('hidden');
        }
        const nextLot = getNextLotNo(state.activeTable);
        const nr = createRow(nextLot, state.activeTable);
        if (!rc.isAdmin && rc.category === 'Master') {
          nr.createdByRole = 'Master';
          nr.masterFinalSubmitted = false;
          nr.masterName = rc.userName;
        }
        state.rows.push(nr);
        deduplicateAndSortRows();
        saveLocalState();
        renderTable();
        scrollToLatestLot();
        showToast('Row added: Lot ' + nextLot);
      }
