<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Lot Production &amp; Hisab Tracker — Shameem &amp; Saleem</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #f1f5f9; color: #0f172a; }
    .lot-bold { font-weight: 800; letter-spacing: 0.02em; }
    .cell-paid-bright {
      background-color: #22c55e !important;
      color: #052e16 !important;
      border-color: #16a34a !important;
    }
    .cell-paid-bright .sub-text {
      color: #064e3b !important;
      font-weight: 600;
    }
    .sticky-lot {
      position: sticky;
      left: 0;
      z-index: 10;
      background: #ffffff;
      box-shadow: 2px 0 6px -2px rgba(15, 23, 42, 0.12);
    }
    thead .sticky-lot {
      z-index: 20;
      background: #0f172a;
    }
    .table-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
    .table-scroll::-webkit-scrollbar-track { background: #e2e8f0; }
    .table-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    @media print {
      body * { visibility: hidden !important; }
      #hisabPrintArea, #hisabPrintArea * { visibility: visible !important; }
      #hisabPrintArea {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        background: #ffffff !important;
        padding: 16px !important;
        box-shadow: none !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Bar -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-full mx-auto px-3 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <!-- Brand & Active User -->
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-indigo-500 flex items-center justify-center font-extrabold text-lg shadow">L</div>
        <div>
          <h1 class="text-sm sm:text-base font-bold leading-tight">Lot Production Tracker</h1>
          <div class="flex items-center gap-2 text-xs text-slate-300">
            <button id="userSwitchBtn" type="button" class="inline-flex items-center gap-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2 py-0.5 rounded-full text-xs font-semibold text-amber-300 transition">
              <span id="activeUserDot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
              <span>User: <strong id="activeUserName">Shameem</strong></span>
              <span class="text-slate-400">▾</span>
            </button>
            <button id="syncSettingsBtn" type="button" class="inline-flex items-center gap-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2 py-0.5 rounded-full text-xs transition">
              <span id="syncStatusDot" class="w-2 h-2 rounded-full bg-sky-400"></span>
              <span id="syncStatusText">Local Auto-Sync</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Top Utility Buttons: Backup, Add Row -->
      <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">

          💾 Backup
        </button>
        <button id="addRowBtn" type="button" class="px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs sm:text-sm shadow transition">
          + Add Row
        </button>
      </div>

    <!-- Department Hisab Bar (All 8 Departments - Unpaid Only) -->
    <div class="bg-slate-950/60 border-t border-slate-800 px-3 py-1.5 flex items-center gap-1.5 overflow-x-auto table-scroll">
      <span class="text-[11px] font-semibold text-slate-400 shrink-0 mr-1">Hisab:</span>
      <button type="button" id="topMasterBtn" data-hisab-dept="master" class="px-2.5 py-1 rounded-md bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs shrink-0 transition">Master</button>
      <button type="button" id="topEmbroideryBtn" data-hisab-dept="embroidery" class="px-2.5 py-1 rounded-md bg-violet-500 hover:bg-violet-600 text-white font-bold text-xs shrink-0 transition">Embroidery</button>
      <button type="button" data-hisab-dept="fabrication" class="px-2.5 py-1 rounded-md bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold text-xs shrink-0 transition">Fabrication</button>
      <button type="button" data-hisab-dept="washing" class="px-2.5 py-1 rounded-md bg-blue-500 hover:bg-blue-600 text-white font-bold text-xs shrink-0 transition">Washing</button>
      <button type="button" data-hisab-dept="tanki" class="px-2.5 py-1 rounded-md bg-teal-500 hover:bg-teal-600 text-slate-950 font-bold text-xs shrink-0 transition">Tanki</button>
      <button type="button" data-hisab-dept="packing" class="px-2.5 py-1 rounded-md bg-orange-500 hover:bg-orange-600 text-slate-950 font-bold text-xs shrink-0 transition">Packing</button>
      <button type="button" data-hisab-dept="laser" class="px-2.5 py-1 rounded-md bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs shrink-0 transition">Laser</button>
      <button type="button" data-hisab-dept="print" class="px-2.5 py-1 rounded-md bg-fuchsia-500 hover:bg-fuchsia-600 text-white font-bold text-xs shrink-0 transition">Print</button>
    </div>

    <!-- Search & Quick Filter Bar -->
    <div class="bg-slate-800/90 border-t border-slate-700 px-3 py-1.5 flex flex-wrap items-center justify-between gap-2 text-xs">
      <div class="flex items-center gap-2 flex-1 min-w-[200px] max-w-md">
        <input id="searchInput" type="text" placeholder="Search Lot no, Master, Fabric, Karigar..." class="w-full bg-slate-900 border border-slate-700 rounded-md px-2.5 py-1 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-indigo-400" />
        <button id="clearSearchBtn" type="button" class="hidden px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-slate-200">Clear</button>
      </div>
      <div class="flex items-center gap-3 text-slate-300">
        <span>Total Lots: <strong id="totalLotsCount" class="text-white">0</strong></span>
        <span>Total Peice: <strong id="totalPiecesCount" class="text-emerald-400">0</strong></span>
        <span>Total Jama: <strong id="totalJamaCount" class="text-sky-400">0</strong></span>
      </div>
    </div>
  </header>

  <!-- Main Table Container -->
  <main class="flex-1 p-2 sm:p-4 overflow-hidden flex flex-col">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden">
      <div class="table-scroll overflow-x-auto overflow-y-auto flex-1">
        <table class="w-full border-collapse text-left text-xs sm:text-sm min-w-[1250px]">
          <thead class="bg-slate-900 text-white sticky top-0 z-20">
            <tr>
              <th class="sticky-lot px-3 py-2.5 border-b border-r border-slate-700 w-24 text-center">Lot no</th>
              <th class="px-3 py-2.5 border-b border-r border-slate-700 w-24 text-center">peice</th>
              <th class="px-3 py-2.5 border-b border-r border-slate-700 w-24 text-center">size</th>
              <th class="px-3 py-2.5 border-b border-r border-slate-700 w-28 text-center">fabric</th>
              <th class="px-3 py-2.5 border-b border-r border-slate-700 w-28 text-center">Master</th>
              <th class="px-3 py-2.5 border-b border-r border-slate-700 w-32 text-center">Embroidery</th>
              <th class="px-3 py-2.5 border-b border-r border-slate-700 w-32 text-center">Fabrication</th>
              <th class="px-3 py-2.5 border-b border-r border-slate-700 w-28 text-center">Tanki</th>
              <th class="px-3 py-2.5 border-b border-r border-slate-700 w-32 text-center">washing</th>
              <th class="px-3 py-2.5 border-b border-r border-slate-700 w-32 text-center">packing</th>
              <th class="px-3 py-2.5 border-b border-r border-slate-700 w-24 text-center">Jama</th>
              <th class="px-3 py-2.5 border-b border-r border-slate-700 w-28 text-center">Laser</th>
              <th class="px-3 py-2.5 border-b border-slate-700 w-28 text-center">Print</th>
            </tr>
          </thead>
          <tbody id="lotTableBody" class="divide-y divide-slate-200">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-full text-xs sm:text-sm font-medium shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-50"></div>

  <!-- Generic Modal Backdrop -->
  <div id="modalBackdrop" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs hidden items-center justify-center p-3 z-40">
    <div id="modalContent" class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[92vh] overflow-y-auto border border-slate-200">
      <!-- Dynamic Modal Body -->
    </div>
  </div>

  <!-- Hisab (Master / Embroidery) Fullscreen Overlay -->
  <div id="hisabOverlay" class="fixed inset-0 bg-slate-100 hidden flex-col z-40 overflow-y-auto">
    <div class="bg-slate-900 text-white px-3 py-2.5 flex items-center justify-between sticky top-0 z-10 no-print">
      <div class="flex items-center gap-2">
        <button id="hisabBackBtn" type="button" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs sm:text-sm font-semibold">← Back</button>
        <h2 id="hisabTitle" class="text-sm sm:text-base font-bold">Hisab</h2>
      </div>
      <div class="flex items-center gap-2">
        <button id="hisabPrintBtn" type="button" class="px-3 py-1.5 rounded-lg bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold text-xs sm:text-sm">🖨️ Print</button>
        <button id="hisabShareBtn" type="button" class="px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs sm:text-sm">📲 JPEG / WhatsApp</button>
      </div>
    </div>
    <div class="p-3 sm:p-5 max-w-4xl w-full mx-auto">
      <div id="hisabPrintArea" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6">
        <!-- Dynamic Hisab Content -->
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'lot_tracker_v2_data';
      const SYNC_CONFIG_KEY = 'lot_tracker_v2_sync_cfg';
      const USER_KEY = 'lot_tracker_v2_user';

      const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('lot_tracker_sync_channel') : null;

      let state = {
        activeUser: 'Shameem',
        rows: [],
        hisabMeta: {
          master: {},
          embroidery: {},
          fabrication: {},
          washing: {},
          tanki: {},
          packing: {},
          laser: {},
          print: {}
        },
        syncConfig: {
          firebaseUrl: '',
          roomCode: 'shameem-saleem-factory',
          autoSync: true,
          lastSyncedAt: null
        }
      };

      let currentSearch = '';
      let syncTimer = null;
      let pollTimer = null;

      function todayISO() {
        const d = new Date();
        const off = d.getTimezoneOffset();
        const local = new Date(d.getTime() - off * 60000);
        return local.toISOString().slice(0, 10);
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('opacity-0');
        el.classList.add('opacity-100');
        clearTimeout(el._t);
        el._t = setTimeout(() => {
          el.classList.remove('opacity-100');
          el.classList.add('opacity-0');
        }, 2500);
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function uid() {
        return 'lot_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      function createEmptyPackingLines() {
        return [
          { date: '', peice: '', rate: '', ripit: '', name: '' },
          { date: '', peice: '', rate: '', ripit: '', name: '' },
          { date: '', peice: '', rate: '', ripit: '', name: '' },
          { date: '', peice: '', rate: '', ripit: '', name: '' }
        ];
      }

      function createRow(lotNo) {
        return {
          id: uid(),
          lotNo: lotNo !== undefined ? String(lotNo) : '',
          date: todayISO(),
          peice: '',
          size: '',
          fabric: '',
          masterName: '',
          masterPaid: false,
          embroidery: { date: '', peice: '', rate: '', name: '', paid: false },
          fabrication: { date: '', peice: '', rate: '', name: '', paid: false },
          tanki: { date: '', peice: '', rate: '', name: '', paid: false },
          washing: { date: '', peice: '', washingType: '', rate: '', name: '', paid: false },
          packing: { lines: createEmptyPackingLines(), paid: false },
          laser: { date: '', peice: '', name: '', paid: false },
          print: { date: '', peice: '', name: '', paid: false },
          updatedBy: state.activeUser,
          updatedAt: Date.now()
        };
      }

      function seedInitialData() {
        const r1 = createRow('101');
        r1.date = todayISO();
        r1.peice = '120';
        r1.size = '28-34';
        r1.fabric = '3/1 Denim';
        r1.masterName = 'Master Akram';
        r1.embroidery = { date: todayISO(), peice: '120', rate: '12', name: 'Raju Emb', paid: false };
        r1.fabrication = { date: todayISO(), peice: '120', rate: '45', name: 'Imran Fab', paid: false };

        const r2 = createRow('102');
        r2.date = todayISO();
        r2.peice = '80';
        r2.size = '30-36';
        r2.fabric = 'Knitted';
        r2.masterName = 'Master Akram';
        r2.masterPaid = false;

        state.rows = [r1, r2];
      }

      function loadLocalState() {
        try {
          const savedUser = localStorage.getItem(USER_KEY);
          if (savedUser === 'Shameem' || savedUser === 'Saleem') {
            state.activeUser = savedUser;
          }
          const savedSync = localStorage.getItem(SYNC_CONFIG_KEY);
          if (savedSync) {
            state.syncConfig = Object.assign(state.syncConfig, JSON.parse(savedSync));
          }
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.rows)) {
              state.rows = parsed.rows.map(r => {
                if (!r.laser && r.damage) { r.laser = r.damage; delete r.damage; }
                if (!r.laser) r.laser = { date: '', peice: '', name: '', paid: false };
                return r;
              });
              state.hisabMeta = Object.assign({ master: {}, embroidery: {}, fabrication: {}, washing: {}, tanki: {}, packing: {}, laser: {}, print: {} }, parsed.hisabMeta || {});
              return;
            }
          }
        } catch (e) {
          // Ignore storage errors in restricted environments
        }
        seedInitialData();
      }

      function saveLocalState(skipBroadcast) {
        try {
          localStorage.setItem(USER_KEY, state.activeUser);
          localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(state.syncConfig));
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            rows: state.rows,
            hisabMeta: state.hisabMeta,
            updatedAt: Date.now()
          }));
        } catch (e) {
          // Ignore storage quota errors
        }
        if (!skipBroadcast && bc) {
          bc.postMessage({ type: 'SYNC_UPDATE', rows: state.rows, hisabMeta: state.hisabMeta });
        }
        scheduleCloudPush();
      }

      function updateSyncBadge(status, text) {
        const dot = document.getElementById('syncStatusDot');
        const label = document.getElementById('syncStatusText');
        if (!dot || !label) return;
        dot.className = 'w-2 h-2 rounded-full ' + (
          status === 'synced' ? 'bg-emerald-400' :
          status === 'syncing' ? 'bg-amber-400 animate-pulse' :
          status === 'error' ? 'bg-rose-400' : 'bg-sky-400'
        );
        label.textContent = text;
      }

      function getFirebaseEndpoint() {
        const base = (state.syncConfig.firebaseUrl || '').trim().replace(/\/+$/, '');
        const room = (state.syncConfig.roomCode || 'default-room').trim().replace(/[^a-zA-Z0-9_-]/g, '');
        if (!base) return null;
        return base + '/lot_tracker/' + room + '.json';
      }

      function scheduleCloudPush() {
        const url = getFirebaseEndpoint();
        if (!url || !state.syncConfig.autoSync) {
          updateSyncBadge('local', 'Local Auto-Sync');
          return;
        }
        updateSyncBadge('syncing', 'Syncing...');
        clearTimeout(syncTimer);
        syncTimer = setTimeout(async () => {
          try {
            const res = await fetch(url, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                rows: state.rows,
                hisabMeta: state.hisabMeta,
                updatedBy: state.activeUser,
                updatedAt: Date.now()
              })
            });
            if (res.ok) {
              state.syncConfig.lastSyncedAt = Date.now();
              updateSyncBadge('synced', 'Cloud Synced');
            } else {
              updateSyncBadge('error', 'Sync Error');
            }
          } catch (err) {
            updateSyncBadge('error', 'Offline (Saved)');
          }
        }, 600);
      }

      async function pullFromCloud(silent) {
        const url = getFirebaseEndpoint();
        if (!url) return;
        try {
          const res = await fetch(url);
          if (!res.ok) return;
          const data = await res.json();
          if (data && Array.isArray(data.rows)) {
            state.rows = data.rows;
            state.hisabMeta = data.hisabMeta || { master: {}, embroidery: {} };
            saveLocalState(true);
            renderTable();
            updateSyncBadge('synced', 'Cloud Synced');
            if (!silent) showToast('Cloud data synced!');
          }
        } catch (err) {
          if (!silent) showToast('Offline: using local data');
        }
      }

      function startSyncPolling() {
        clearInterval(pollTimer);
        if (getFirebaseEndpoint() && state.syncConfig.autoSync) {
          pullFromCloud(true);
          pollTimer = setInterval(() => pullFromCloud(true), 12000);
        }
      }

      if (bc) {
        bc.onmessage = (ev) => {
          if (ev.data && ev.data.type === 'SYNC_UPDATE') {
            state.rows = ev.data.rows;
            state.hisabMeta = ev.data.hisabMeta || state.hisabMeta;
            renderTable();
            updateSyncBadge('synced', 'Tab Synced');
          }
        };
      }

      function getPackingTotalPeice(row) {
        if (!row.packing || !Array.isArray(row.packing.lines)) return 0;
        return row.packing.lines.reduce((sum, l) => sum + (parseFloat(l.peice) || 0), 0);
      }

      function getPackingPrimaryName(row) {
        if (!row.packing || !Array.isArray(row.packing.lines)) return '';
        const names = row.packing.lines.map(l => (l.name || '').trim()).filter(Boolean);
        return names.length ? names[names.length - 1] : '';
      }

      function renderTable() {
        const tbody = document.getElementById('lotTableBody');
        const q = currentSearch.trim().toLowerCase();

        const filtered = state.rows.filter(r => {
          if (!q) return true;
          return [
            r.lotNo, r.size, r.fabric, r.masterName,
            r.embroidery?.name, r.fabrication?.name, r.tanki?.name,
            r.washing?.name, getPackingPrimaryName(r), r.laser?.name, r.print?.name
          ].some(v => (v || '').toLowerCase().includes(q));
        });

        let totalPcs = 0;
        let totalJama = 0;
        state.rows.forEach(r => {
          totalPcs += parseFloat(r.peice) || 0;
          totalJama += getPackingTotalPeice(r);
        });
        document.getElementById('totalLotsCount').textContent = state.rows.length;
        document.getElementById('totalPiecesCount').textContent = totalPcs;
        document.getElementById('totalJamaCount').textContent = totalJama;

        if (!filtered.length) {
          tbody.innerHTML = '<tr><td colspan="13" class="text-center py-8 text-slate-400">No lots found. Click <strong>+ Add Row</strong> to start.</td></tr>';
          return;
        }

        tbody.innerHTML = filtered.map((row, idx) => {
          const isFirst = idx === 0 && !q;
          const jamaTotal = getPackingTotalPeice(row);
          const packName = getPackingPrimaryName(row);

          function renderJobCell(cellType, data, extraSub) {
            const hasName = (data?.name || '').trim() !== '';
            const hasPcs = (data?.peice || '').trim() !== '' || extraSub;
            const paidClass = data?.paid ? 'cell-paid-bright' : 'hover:bg-indigo-50/70';
            return `<td data-row-id="${row.id}" data-cell="${cellType}" class="cell-trigger cursor-pointer px-2 py-2 border-r border-slate-200 text-center align-middle transition ${paidClass}">
              ${hasName ? `<div class="font-semibold text-xs sm:text-sm leading-tight">${escapeHtml(data.name)}</div>` : `<div class="text-slate-300 text-xs">+ Entry</div>`}
              ${hasPcs ? `<div class="sub-text text-[11px] text-slate-600 mt-0.5">${escapeHtml(extraSub !== undefined ? extraSub : (data.peice ? data.peice + ' pcs' : ''))}</div>` : ''}
            </td>`;
          }

          return `<tr class="hover:bg-slate-50/80 transition">
            <!-- Lot no (Bold, manual entry supported) -->
            <td class="sticky-lot px-2 py-2 border-r border-slate-200 text-center">
              <input type="text" data-lot-input="${row.id}" value="${escapeHtml(row.lotNo)}" placeholder="${isFirst ? 'Lot #' : ''}" class="lot-bold w-full text-center bg-transparent border border-transparent hover:border-slate-300 focus:border-indigo-500 focus:bg-white rounded px-1 py-1 text-slate-900 text-sm focus:outline-none" />
            </td>

            <!-- peice (Click opens entry modal) -->
            <td data-row-id="${row.id}" data-cell="peice" class="cell-trigger cursor-pointer px-2 py-2 border-r border-slate-200 text-center hover:bg-indigo-50/70 transition">
              ${row.peice ? `<div class="font-bold text-slate-900">${escapeHtml(row.peice)}</div><div class="text-[10px] text-slate-400">${escapeHtml(row.date || '')}</div>` : `<span class="text-indigo-500 text-xs font-medium">+ Peice</span>`}
            </td>

            <!-- size (Manual or from peice modal) -->
            <td class="px-1.5 py-2 border-r border-slate-200 text-center">

      function addNewRow() {
        let nextLot = '101';
        if (state.rows.length > 0) {
          const lastLot = (state.rows[state.rows.length - 1].lotNo || '').trim();
          const match = lastLot.match(/^(.*?)(\d+)$/);
          if (match) {
            const prefix = match[1];
            const num = parseInt(match[2], 10) + 1;
            nextLot = prefix + String(num).padStart(match[2].length, '0');
          } else if (lastLot === '') {
            nextLot = String(state.rows.length + 1);
          } else {
            nextLot = lastLot + '-2';
          }
        }
        state.rows.push(createRow(nextLot));
        saveLocalState();
        renderTable();
        showToast('Row added: Lot ' + nextLot);
      }

      const DEPT_CONFIG = {
        master: { label: 'Master', hasTableRate: false },
        embroidery: { label: 'Embroidery', hasTableRate: true },
        fabrication: { label: 'Fabrication', hasTableRate: true },
        washing: { label: 'Washing', hasTableRate: true },
        tanki: { label: 'Tanki', hasTableRate: true },
        packing: { label: 'Packing', hasTableRate: true },
        laser: { label: 'Laser', hasTableRate: false },
        print: { label: 'Print', hasTableRate: false }
      };

      function getUnpaidDeptNames(dept) {
        const counts = {};
        state.rows.forEach(r => {
          if (dept === 'master') {
            if (!r.masterPaid && (r.masterName || '').trim()) {
              const n = r.masterName.trim();
              counts[n] = (counts[n] || 0) + 1;
            }
          } else if (dept === 'packing') {
            if (!r.packing?.paid && Array.isArray(r.packing?.lines)) {
              const seenInRow = new Set();
              r.packing.lines.forEach(l => {
                const n = (l.name || '').trim();
                if (n && !seenInRow.has(n)) {
                  seenInRow.add(n);
                  counts[n] = (counts[n] || 0) + 1;
                }
              });
            }
          } else {
            const d = r[dept];
            if (d && !d.paid && (d.name || '').trim()) {
              const n = d.name.trim();
              counts[n] = (counts[n] || 0) + 1;
            }
          }
        });
        return Object.keys(counts).sort().map(n => ({ name: n, count: counts[n] }));
      }

      function getUnpaidDeptRows(dept, name) {
        if (dept === 'master') {
          return state.rows.filter(r => !r.masterPaid && (r.masterName || '').trim() === name);
        }
        if (dept === 'packing') {
          return state.rows.filter(r => !r.packing?.paid && Array.isArray(r.packing?.lines) && r.packing.lines.some(l => (l.name || '').trim() === name));
        }
        return state.rows.filter(r => r[dept] && !r[dept].paid && (r[dept].name || '').trim() === name);
      }

      function getDeptRowValues(dept, r, name, entry) {
        if (dept === 'master') {
          const pcs = parseFloat(r.peice) || 0;
          const rate = parseFloat(entry.rate) || 0;
          return { pcs, rate, amount: pcs * rate, date: entry.date || r.date || '', rateReadonly: false };
        }
        if (dept === 'packing') {
          const matchingLines = (r.packing?.lines || []).filter(l => (l.name || '').trim() === name);
          let pcs = 0;
          let amt = 0;
          let firstDate = '';
          let lastRate = '';
          matchingLines.forEach(l => {
            const lp = parseFloat(l.peice) || 0;
            const lr = parseFloat(l.rate) || 0;
            pcs += lp;
            amt += lp * lr;
            if (!firstDate && l.date) firstDate = l.date;
            if (l.rate) lastRate = l.rate;
          });
          const effRate = pcs > 0 ? (amt / pcs) : (parseFloat(lastRate) || 0);
          return { pcs, rate: effRate, amount: amt, date: entry.date || firstDate || r.date || '', rateReadonly: true };
        }
        const d = r[dept] || {};
        const pcs = parseFloat(d.peice) || 0;
        const hasTableRate = DEPT_CONFIG[dept].hasTableRate;
        const rate = parseFloat(hasTableRate ? (d.rate || entry.rate) : entry.rate) || 0;

      function renderHisabContent() {
        const { type, name } = currentHisab;
        if (!type || !name) return;

        if (!state.hisabMeta[type]) state.hisabMeta[type] = {};
        if (!state.hisabMeta[type][name]) {
          state.hisabMeta[type][name] = { lastBalance: '', entries: {}, extraPayments: [] };
        }
        const meta = state.hisabMeta[type][name];
        if (!Array.isArray(meta.extraPayments)) meta.extraPayments = [];
        const label = DEPT_CONFIG[type]?.label || type;
        const matchingRows = getUnpaidDeptRows(type, name);

        let totalPeice = 0;
        let totalAmount = 0;
        let totalPayment = 0;

        const rowsHtml = matchingRows.map(r => {
          if (!meta.entries[r.id]) {
            meta.entries[r.id] = { rate: '', date: '', payment: '' };
          }
          const entry = meta.entries[r.id];
          const vals = getDeptRowValues(type, r, name, entry);
          if (!entry.date && vals.date) entry.date = vals.date;
          const payment = parseFloat(entry.payment) || 0;

          totalPeice += vals.pcs;
          totalAmount += vals.amount;
          totalPayment += payment;

          return `<tr class="border-b border-slate-200">
            <td class="px-2.5 py-2 font-bold text-slate-900 border-r border-slate-200">${escapeHtml(r.lotNo)}</td>
            <td class="px-2.5 py-2 text-right font-semibold border-r border-slate-200">${vals.pcs}</td>
            <td class="px-2 py-2 border-r border-slate-200">
              ${vals.rateReadonly
                ? `<div class="text-right font-medium text-slate-800">${Number.isInteger(vals.rate) ? vals.rate : vals.rate.toFixed(2)}</div>`
                : `<input type="number" step="0.01" data-hisab-field="rate" data-lot-id="${r.id}" value="${escapeHtml(entry.rate)}" placeholder="0" class="w-20 text-right border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />`
              }
            </td>
            <td class="px-2.5 py-2 text-right font-bold text-slate-900 border-r border-slate-200">₹${vals.amount.toFixed(0)}</td>
            <td class="px-2 py-2 border-r border-slate-200">
              <input type="date" data-hisab-field="date" data-lot-id="${r.id}" value="${escapeHtml(entry.date)}" class="border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
            </td>
            <td class="px-2 py-2">
              <input type="number" step="0.01" data-hisab-field="payment" data-lot-id="${r.id}" value="${escapeHtml(entry.payment)}" placeholder="0" class="w-24 text-right border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
            </td>
          </tr>`;
        }).join('');

        const extraRowsHtml = meta.extraPayments.map((ep, idx) => {
          const payVal = parseFloat(ep.payment) || 0;
          totalPayment += payVal;
          return `<tr class="border-b border-slate-200 bg-emerald-50/40">
            <td class="px-2.5 py-2 text-xs font-semibold text-emerald-800 border-r border-slate-200">
              <div class="flex items-center justify-between gap-1">
                <span>Payment #${idx + 1}</span>
                <button type="button" data-remove-extra-pay="${idx}" class="no-print text-rose-500 hover:text-rose-700 font-bold text-xs px-1" title="Remove row">✕</button>
              </div>
            </td>
            <td class="px-2.5 py-2 text-right text-slate-400 border-r border-slate-200">—</td>
            <td class="px-2.5 py-2 text-right text-slate-400 border-r border-slate-200">—</td>
            <td class="px-2.5 py-2 text-right text-slate-400 border-r border-slate-200">—</td>
            <td class="px-2 py-2 border-r border-slate-200">
              <input type="date" data-extra-pay-field="date" data-extra-idx="${idx}" value="${escapeHtml(ep.date || '')}" class="border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
            </td>
            <td class="px-2 py-2">
              <input type="number" step="0.01" data-extra-pay-field="payment" data-extra-idx="${idx}" value="${escapeHtml(ep.payment || '')}" placeholder="0" class="w-24 text-right border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
            </td>
          </tr>`;
        }).join('');

        const lastBal = parseFloat(meta.lastBalance) || 0;
        const grandKaam = totalAmount + lastBal;
        const balance = grandKaam - totalPayment;

        const area = document.getElementById('hisabPrintArea');
        area.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-slate-900 pb-3 mb-4">
            <div>
              <div class="text-xs uppercase tracking-wider font-bold text-slate-500">${escapeHtml(label)} Hisab Sheet (Unpaid Only)</div>
              <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">${escapeHtml(name)}</h2>
            </div>
            <div class="text-right text-xs text-slate-500">
              <div>Date: <strong>${todayISO()}</strong></div>
              <div>By: <strong>${escapeHtml(state.activeUser)}</strong></div>
            </div>
          </div>

          <!-- Top Summary Cards -->
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 mb-4">
            <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200">
              <div class="text-[11px] text-slate-500 font-semibold">Total Peice</div>
              <div class="text-lg font-extrabold text-slate-900">${totalPeice}</div>
            </div>
            <div class="p-2.5 rounded-xl bg-indigo-50 border border-indigo-200">
              <div class="text-[11px] text-indigo-700 font-semibold">Total Amount (Kaam)</div>
              <div id="hisabTotalAmount" class="text-lg font-extrabold text-indigo-900">₹${totalAmount.toFixed(0)}</div>
            </div>
            <div class="p-2.5 rounded-xl bg-amber-50 border border-amber-200">
              <label class="block text-[11px] text-amber-800 font-semibold">Last Balance (+)</label>
              <input id="hisabLastBalanceInput" type="number" step="0.01" value="${escapeHtml(meta.lastBalance)}" placeholder="0" class="w-full mt-0.5 bg-white border border-amber-300 rounded px-2 py-0.5 text-sm font-bold text-slate-900 focus:outline-none" />
            </div>
            <div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200">
              <div class="text-[11px] text-emerald-700 font-semibold">Total Payment</div>
              <div id="hisabTotalPayment" class="text-lg font-extrabold text-emerald-900">₹${totalPayment.toFixed(0)}</div>
            </div>
            <div class="col-span-2 sm:col-span-1 p-2.5 rounded-xl bg-slate-900 text-white">
              <div class="text-[11px] text-slate-300 font-semibold">Final Balance</div>
              <div id="hisabFinalBalance" class="text-lg font-extrabold text-amber-300">₹${balance.toFixed(0)}</div>
            </div>
          </div>

          <!-- Hisab Table -->
          <div class="overflow-x-auto border border-slate-200 rounded-xl">
            <table class="w-full border-collapse text-xs sm:text-sm">
              <thead class="bg-slate-800 text-white">
                <tr>
                  <th class="px-2.5 py-2 text-left border-r border-slate-700">Lot no</th>
                  <th class="px-2.5 py-2 text-right border-r border-slate-700">Peice</th>
                  <th class="px-2.5 py-2 text-right border-r border-slate-700">Rate</th>
                  <th class="px-2.5 py-2 text-right border-r border-slate-700">Amount (Kaam)</th>
                  <th class="px-2.5 py-2 text-left border-r border-slate-700">Date</th>
                  <th class="px-2.5 py-2 text-right">Payment</th>
                </tr>
              </thead>
              <tbody>
                ${(rowsHtml || extraRowsHtml) ? (rowsHtml + extraRowsHtml) : '<tr><td colspan="6" class="text-center py-6 text-slate-400">No unpaid entries</td></tr>'}
              </tbody>
            </table>
          </div>
          <div class="mt-3 flex justify-end no-print">
            <button id="addExtraPaymentRowBtn" type="button" class="px-3.5 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs sm:text-sm shadow transition">
              + Add Date &amp; Payment Row
            </button>
          </div>
        `;

        document.getElementById('hisabLastBalanceInput').addEventListener('input', (e) => {
          meta.lastBalance = e.target.value;
          saveLocalState();
          recalcHisabTotalsOnly();
        });

        area.querySelectorAll('[data-hisab-field]').forEach(inp => {
          inp.addEventListener('input', (e) => {
            const lotId = e.target.getAttribute('data-lot-id');
            const field = e.target.getAttribute('data-hisab-field');
            if (!meta.entries[lotId]) meta.entries[lotId] = { rate: '', date: '', payment: '' };
            meta.entries[lotId][field] = e.target.value;
            saveLocalState();
            if (field === 'rate') {
              renderHisabContent();
            } else {
              recalcHisabTotalsOnly();
            }
          });
        });

        document.getElementById('addExtraPaymentRowBtn').addEventListener('click', () => {
          meta.extraPayments.push({ date: todayISO(), payment: '' });
          saveLocalState();
          renderHisabContent();
        });

        area.querySelectorAll('[data-extra-pay-field]').forEach(inp => {
          inp.addEventListener('input', (e) => {
            const idx = parseInt(e.target.getAttribute('data-extra-idx'), 10);
            const field = e.target.getAttribute('data-extra-pay-field');
            if (meta.extraPayments[idx]) {
              meta.extraPayments[idx][field] = e.target.value;
              saveLocalState();
              recalcHisabTotalsOnly();
            }
          });
        });

        area.querySelectorAll('[data-remove-extra-pay]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = parseInt(btn.getAttribute('data-remove-extra-pay'), 10);
            meta.extraPayments.splice(idx, 1);
            saveLocalState();
            renderHisabContent();
          });
        });

        function recalcHisabTotalsOnly() {
          let tAmt = 0;
          let tPay = 0;
          matchingRows.forEach(r => {
            const en = meta.entries[r.id] || {};
            const vals = getDeptRowValues(type, r, name, en);
            tAmt += vals.amount;
            tPay += parseFloat(en.payment) || 0;
          });
          meta.extraPayments.forEach(ep => {
            tPay += parseFloat(ep.payment) || 0;
          });
          const lb = parseFloat(meta.lastBalance) || 0;
          const bal = (tAmt + lb) - tPay;
          document.getElementById('hisabTotalAmount').textContent = '₹' + tAmt.toFixed(0);
          document.getElementById('hisabTotalPayment').textContent = '₹' + tPay.toFixed(0);
          document.getElementById('hisabFinalBalance').textContent = '₹' + bal.toFixed(0);
        }
      }

      async function shareHisabAsJpeg() {
        const area = document.getElementById('hisabPrintArea');
        if (!window.html2canvas) {
          showToast('Image library loading, try again');
          return;
        }
        showToast('Generating High-Quality JPEG...');
        try {
          const canvas = await window.html2canvas(area, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true });
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.95));
          const fileName = (currentHisab.type + '_' + currentHisab.name + '_hisab.jpg').replace(/\s+/g, '_');
          const file = new File([blob], fileName, { type: 'image/jpeg' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: currentHisab.name + ' Hisab',
              text: currentHisab.name + ' Hisab Sheet'
            });
            showToast('Shared successfully!');
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showToast('JPEG downloaded! Share on WhatsApp.');
          }
        } catch (err) {
          showToast('Could not share JPEG');
        }
      }

      let lastBackupFileHandle = null;

      function getBackupPayloadString() {
        return JSON.stringify({
          app: 'LotProductionTracker',
          version: 2,
          exportedAt: new Date().toISOString(),
          exportedBy: state.activeUser,
          rows: state.rows,
          hisabMeta: state.hisabMeta
        }, null, 2);
      }

      function applyImportedData(parsed) {
        if (!parsed || !Array.isArray(parsed.rows)) {
          showToast('Invalid backup file');
          return false;
        }
        state.rows = parsed.rows.map(r => {
          if (!r.laser && r.damage) { r.laser = r.damage; delete r.damage; }
          if (!r.laser) r.laser = { date: '', peice: '', name: '', paid: false };
          return r;
        });
        state.hisabMeta = Object.assign({ master: {}, embroidery: {}, fabrication: {}, washing: {}, tanki: {}, packing: {}, laser: {}, print: {} }, parsed.hisabMeta || {});
        saveLocalState();
        renderTable();
        return true;
      }

      async function saveBackupToUserLocation(useLastHandle) {
        const payload = getBackupPayloadString();
        const fileName = 'lot_tracker_backup_' + todayISO() + '.json';

        if (window.showSaveFilePicker) {
          try {
            let handle = (useLastHandle && lastBackupFileHandle) ? lastBackupFileHandle : null;
            if (!handle) {
              handle = await window.showSaveFilePicker({
                suggestedName: fileName,
                types: [{ description: 'JSON Backup File', accept: { 'application/json': ['.json'] } }]
              });
              lastBackupFileHandle = handle;
            }
            const writable = await handle.createWritable();
            await writable.write(payload);
            await writable.close();
            showToast('Backup saved to selected location!');
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }

        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Backup downloaded to device storage!');
      }

      async function restoreBackupFromUserLocation() {
        if (window.showOpenFilePicker) {
          try {
            const [handle] = await window.showOpenFilePicker({
              multiple: false,
              types: [{ description: 'JSON Backup File', accept: { 'application/json': ['.json'] } }]
            });
            const file = await handle.getFile();
            const text = await file.text();
            const parsed = JSON.parse(text);
            if (applyImportedData(parsed)) {
              closeModal();
              showToast('Data restored from selected file!');
            }
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'file';
        hiddenInput.accept = '.json,application/json';
        hiddenInput.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              if (applyImportedData(parsed)) {
                closeModal();
                showToast('Data restored from selected file!');
              }
            } catch (err) {
              showToast('Invalid backup file');
            }
          };
          reader.readAsText(file);
        };
        hiddenInput.click();
      }

        document.getElementById('syncForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          state.syncConfig.firebaseUrl = (fd.get('firebaseUrl') || '').trim();
          state.syncConfig.roomCode = (fd.get('roomCode') || 'shameem-saleem-factory').trim();
          saveLocalState();
          startSyncPolling();
          closeModal();
          showToast('Sync settings saved');
        });

        document.getElementById('exportJsonBtn').addEventListener('click', () => {
          const blob = new Blob([JSON.stringify({ rows: state.rows, hisabMeta: state.hisabMeta }, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'lot_tracker_backup_' + todayISO() + '.json';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('Backup exported');
        });

        document.getElementById('importJsonInput').addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              if (parsed && Array.isArray(parsed.rows)) {
                state.rows = parsed.rows;
                state.hisabMeta = parsed.hisabMeta || state.hisabMeta;
                saveLocalState();
                renderTable();
                closeModal();
                showToast('Backup imported!');
              }
            } catch (err) {
              showToast('Invalid backup file');
            }
          };
          reader.readAsText(file);
        });
      }

      document.addEventListener('click', (e) => {
        if (e.target.closest('[data-close-modal]') || e.target.id === 'modalBackdrop') {
          closeModal();
          return;
        }
        const cell = e.target.closest('.cell-trigger');
        if (cell) {
          const rowId = cell.getAttribute('data-row-id');
          const cellType = cell.getAttribute('data-cell');
          if (cellType === 'peice') openPeiceModal(rowId);
          else if (cellType === 'master') openMasterCellModal(rowId);
          else if (cellType === 'packing') openPackingModal(rowId);
          else openJobModal(rowId, cellType);
        }
      });

      document.getElementById('lotTableBody').addEventListener('input', (e) => {
        const lotId = e.target.getAttribute('data-lot-input');
        if (lotId) {
          const row = getRow(lotId);
          if (row) {
            row.lotNo = e.target.value;
            row.updatedBy = state.activeUser;
            row.updatedAt = Date.now();
            saveLocalState();
          }
          return;
        }
        const inlineField = e.target.getAttribute('data-inline-field');
        if (inlineField) {
          const rowId = e.target.getAttribute('data-row-id');
          const row = getRow(rowId);
          if (row) {
            row[inlineField] = e.target.value;
            row.updatedBy = state.activeUser;
            row.updatedAt = Date.now();
            saveLocalState();
          }
        }
      });

      document.getElementById('addRowBtn').addEventListener('click', addNewRow);
      document.querySelectorAll('[data-hisab-dept]').forEach(btn => {
        btn.addEventListener('click', () => openDeptListModal(btn.getAttribute('data-hisab-dept')));
      });
      document.getElementById('userSwitchBtn').addEventListener('click', openUserSwitchModal);
      document.getElementById('syncSettingsBtn').addEventListener('click', openSyncSettingsModal);
      document.getElementById('backupRestoreBtn').addEventListener('click', openBackupRestoreModal);

      document.getElementById('hisabBackBtn').addEventListener('click', () => {
        document.getElementById('hisabOverlay').classList.add('hidden');
        document.getElementById('hisabOverlay').classList.remove('flex');
      });
      document.getElementById('hisabPrintBtn').addEventListener('click', () => window.print());
      document.getElementById('hisabShareBtn').addEventListener('click', shareHisabAsJpeg);

      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      searchInput.addEventListener('input', () => {
        currentSearch = searchInput.value;
        clearSearchBtn.classList.toggle('hidden', !currentSearch);
        renderTable();
      });
      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        currentSearch = '';
        clearSearchBtn.classList.add('hidden');
        renderTable();
      });

      loadLocalState();
      document.getElementById('activeUserName').textContent = state.activeUser;
      renderTable();
      startSyncPolling();
    })();
  </script>
</body>
</html>
