      async function connectBluetoothPrinter() {
        if (!navigator.bluetooth) {
          showToast('Web Bluetooth Android Chrome me use karein (ya System Print dabayein)');
          return false;
        }
        try {
          if (btPrinterDevice && btPrinterDevice.gatt && btPrinterDevice.gatt.connected && btPrinterChar) {
            return true;
          }
          showToast('Bluetooth Printer search ho raha hai...');
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: BT_PRINTER_SERVICES
          });
          const server = await device.gatt.connect();
          const services = await server.getPrimaryServices();
          let foundChar = null;
          for (const svc of services) {
            const chars = await svc.getCharacteristics();
            for (const ch of chars) {
              if (ch.properties.write || ch.properties.writeWithoutResponse) {
                foundChar = ch;
                break;
              }
            }
            if (foundChar) break;
          }
          if (!foundChar) {
            showToast('Writable printer characteristic nahi mili');
            return false;
          }
          btPrinterDevice = device;
          btPrinterChar = foundChar;
          device.addEventListener('gattserverdisconnected', () => {
            btPrinterChar = null;
          });
          showToast('Connected: ' + (device.name || 'BT Printer'));
          return true;
        } catch (err) {
          if (err && err.name !== 'NotFoundError') {
            showToast('Bluetooth connect failed');
          }
          return false;
        }
      }

      function buildEscPosHisabBytes(receipt) {
        const enc = new TextEncoder();
        const chunks = [];
        const pushBytes = (...b) => chunks.push(new Uint8Array(b));
        const pushText = (txt) => chunks.push(enc.encode(txt + '\n'));
        const padR = (s, n) => String(s).slice(0, n).padEnd(n, ' ');
        const padL = (s, n) => String(s).slice(0, n).padStart(n, ' ');
        const line48 = '-'.repeat(48);
        const eq48 = '='.repeat(48);

        // ESC @ Initialize
        pushBytes(0x1B, 0x40);
        // Center + Bold + Double height
        pushBytes(0x1B, 0x61, 0x01, 0x1B, 0x45, 0x01, 0x1D, 0x21, 0x11);
        pushText('ADDIS JEANS');
        pushBytes(0x1D, 0x21, 0x00);
        pushText(receipt.titleText);
        pushText(receipt.name);
        pushBytes(0x1B, 0x45, 0x00);
        pushText('Date: ' + receipt.dateText + ' | By: ' + receipt.activeUser);
        pushBytes(0x1B, 0x61, 0x00);
        pushText(eq48);

        // Lot Table Header (48 cols: Lot 10 + C/G 12 + Rate 10 + Amt 16)
        pushBytes(0x1B, 0x45, 0x01);
        pushText(padR('Lot', 10) + padL(receipt.isStage ? 'C/G' : 'Pcs', 12) + padL('Rate', 10) + padL('Amt', 16));
        pushBytes(0x1B, 0x45, 0x00);
        pushText(line48);

        receipt.rowsData.forEach(r => {
          const cg = receipt.isStage ? `${r.come}/${r.gone}` : String(r.come);
          pushText(
            padR(r.lotNo, 10) +
            padL(cg, 12) +
            padL(Number(r.rate).toFixed(0), 10) +
            padL('Rs ' + Number(r.amount).toFixed(0), 16)
          );
        });
        pushText(line48);
        pushBytes(0x1B, 0x45, 0x01);
        const totCg = receipt.isStage ? `${receipt.totalPeice}/${receipt.totalGone}` : String(receipt.totalPeice);
        pushText(padR('Total', 10) + padL(totCg, 12) + padL('', 10) + padL('Rs ' + receipt.totalAmount.toFixed(0), 16));
        pushBytes(0x1B, 0x45, 0x00);
        pushText(eq48);

        if (receipt.payData.length) {
          pushBytes(0x1B, 0x45, 0x01);
          pushText('PAYMENTS:');
          pushBytes(0x1B, 0x45, 0x00);
          receipt.payData.forEach((p, idx) => {
            pushText(padR((idx + 1) + '. ' + (p.date || '-'), 30) + padL('Rs ' + Number(p.payment).toFixed(0), 18));
          });
          pushText(line48);
        }

        const sumLine = (lbl, val) => pushText(padR(lbl, 28) + padL(val, 20));
        sumLine('Total Piece:', String(receipt.totalPeice));
        sumLine('Total Kaam:', 'Rs ' + receipt.totalAmount.toFixed(0));
        sumLine('Last Bal (+):', 'Rs ' + receipt.lastBal.toFixed(0));
        if (receipt.isStage) {
          sumLine('Pcs Bal (' + receipt.pcsBal + '):', '-Rs ' + receipt.pcsBalAmt.toFixed(0));
        }
        sumLine('Alter Bal:', String(getAlterBalance(receipt.name)) + ' pcs');
        sumLine('Total Pay (-):', 'Rs ' + receipt.totalPayment.toFixed(0));
        pushText(eq48);
        pushBytes(0x1B, 0x45, 0x01, 0x1D, 0x21, 0x01);
        sumLine('FINAL BAL:', 'Rs ' + receipt.finalBalance.toFixed(0));
        pushBytes(0x1D, 0x21, 0x00, 0x1B, 0x45, 0x00);
        pushText(eq48);

        pushBytes(0x1B, 0x61, 0x01);
        pushText('*** Thank You ***');
        pushText('');
        pushText('');
        pushText('');
        // Partial Cut (GS V 66 0)
        pushBytes(0x1D, 0x56, 0x42, 0x00);

        const totalLen = chunks.reduce((s, c) => s + c.length, 0);
        const merged = new Uint8Array(totalLen);
        let offset = 0;
        chunks.forEach(c => { merged.set(c, offset); offset += c.length; });
        return merged;
      }

      async function sendEscPosBytes(data) {
        const ok = await connectBluetoothPrinter();
        if (!ok || !btPrinterChar) return;
        try {
          showToast('Printing on Bluetooth...');
          const CHUNK = 80;
          for (let i = 0; i < data.length; i += CHUNK) {
            const slice = data.slice(i, i + CHUNK);
            if (btPrinterChar.properties.writeWithoutResponse) {
              await btPrinterChar.writeValueWithoutResponse(slice);
            } else {
              await btPrinterChar.writeValue(slice);
            }
            await new Promise(r => setTimeout(r, 18));
          }
          showToast('Bluetooth Print Complete!');
        } catch (err) {
          showToast('Bluetooth print error — dubara connect karein');
          btPrinterChar = null;
        }
      }

      async function printViaBluetooth(receipt) {
        await sendEscPosBytes(buildEscPosHisabBytes(receipt));
      }

      function buildEscPosPendingBytes(query) {
        const enc = new TextEncoder();
        const chunks = [];
        const pushBytes = (...b) => chunks.push(new Uint8Array(b));
        const pushText = (txt) => chunks.push(enc.encode(txt + '\n'));
        const line48 = '-'.repeat(48);
        const eq48 = '='.repeat(48);
        const q = (query || '').trim().toLowerCase();

        const depts = [
          { key: 'fabrication', label: 'FABRICATION' },
          { key: 'tanki', label: 'TANKI' },
          { key: 'washing', label: 'WASHING' },
          { key: 'packing', label: 'PACKING' }
        ];

        pushBytes(0x1B, 0x40);
        pushBytes(0x1B, 0x61, 0x01, 0x1B, 0x45, 0x01, 0x1D, 0x21, 0x11);
        pushText('ADDIS JEANS');
        pushBytes(0x1D, 0x21, 0x00);
        pushText('PENDING LOTS LIST');
        pushBytes(0x1B, 0x45, 0x00);
        pushText('Date: ' + formatDateDMY(todayISO()) + ' | By: ' + state.activeUser);
        if (q) pushText('Filter: ' + query.trim());
        pushBytes(0x1B, 0x61, 0x00);
        pushText(eq48);

        let grandPending = 0;
        depts.forEach(d => {
          const pendingRows = state.rows.filter(r => {
            if ((r[d.key]?.status || 'Pending') !== 'Pending') return false;
            if (!q) return true;
            return (r.lotNo || '').toLowerCase().includes(q) ||
                   (r[d.key]?.name || '').toLowerCase().includes(q) ||
                   d.label.toLowerCase().includes(q);
          });
          if (q && !pendingRows.length) return;
          grandPending += pendingRows.length;
          pushBytes(0x1B, 0x45, 0x01);
          pushText(`${d.label} (${pendingRows.length} Pending)`);
          pushBytes(0x1B, 0x45, 0x00);
          if (!pendingRows.length) {
            pushText('  No pending lots');
          } else {
            pendingRows.forEach(r => {
              const st = getStageTotals(r, d.key);
              const nm = (r[d.key]?.name || '').trim();
              const info = nm ? ` - ${nm}` : '';
              const pcsInfo = (st.come || st.gone) ? ` [${st.come}-${st.gone}=${st.balance}]` : '';
              pushText(`  Lot ${r.lotNo}${info}${pcsInfo}`.slice(0, 48));
            });
          }
          pushText(line48);
        });

        pushBytes(0x1B, 0x45, 0x01);
        pushText('TOTAL PENDING ENTRIES: ' + grandPending);
        pushBytes(0x1B, 0x45, 0x00);
        pushText(eq48);
        pushText('');
        pushText('');
        pushText('');
        pushBytes(0x1D, 0x56, 0x42, 0x00);

        const totalLen = chunks.reduce((s, c) => s + c.length, 0);
        const merged = new Uint8Array(totalLen);
        let offset = 0;
        chunks.forEach(c => { merged.set(c, offset); offset += c.length; });
        return merged;
      }

      async function shareHisabAsPdf() {
        if (!window.jspdf || !window.jspdf.jsPDF) {
          showToast('PDF library loading, try again');
          return;
        }
        showToast('Generating Full Hisab PDF...');
        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
          const { type, name, isSavedView, savedId } = currentHisab;
          const label = DEPT_CONFIG[type]?.label || type;
          const isStage = ['fabrication', 'tanki', 'washing', 'packing'].includes(type);
          const isTanki = type === 'tanki';
          const isWash = type === 'washing';

          let totalPiece = 0, totalGonePdf = 0, pcsBalPdf = 0, pcsBalAmtPdf = 0, totalAmount = 0, lastBalance = 0, totalPayment = 0, finalBalance = 0;
          let head = [];
          let body = [];
          let payBody = [];
          let titleText = `${label} Hisab — ${name}`;
          let dateText = formatDateDMY(todayISO());

          if (isSavedView && savedId) {
            const h = state.savedHisabs.find(x => x.id === savedId);
            if (!h) return;
            titleText = `${h.title} (${h.deptLabel}) — ${h.name}`;
            dateText = formatDateDMY(h.savedDate);
            totalPiece = h.totalPiece || 0;
            pcsBalPdf = Number(h.pcsBal || 0);
            pcsBalAmtPdf = Number(h.pcsBalAmount || 0);
            totalAmount = Number(h.totalAmount || 0);
            lastBalance = Number(h.lastBalance || 0);
            totalPayment = Number(h.totalPayment || 0);
            finalBalance = Number(h.finalBalance || 0);

            if (isStage) {
              head = [isTanki
                ? ['Lot no', 'Come', 'Gone', 'Fabrication', 'Washing', 'Rate', 'Amount']
                : (isWash
                    ? ['Lot no', 'Come', 'Gone', 'Washing', 'Rate', 'Amount']
                    : ['Lot no', 'Come', 'Gone', 'Rate', 'Amount'])];
              body = h.rows.map(r => isTanki
                ? [r.lotNo, r.come ?? r.peice, r.gone ?? r.peice, r.fabricationName || '-', r.washingName || '-', Number(r.rate || 0).toFixed(2), 'Rs ' + Number(r.amount || 0).toFixed(0)]
                : (isWash
                    ? [r.lotNo, r.come ?? r.peice, r.gone ?? r.peice, r.washingType || '-', Number(r.rate || 0).toFixed(2), 'Rs ' + Number(r.amount || 0).toFixed(0)]
                    : [r.lotNo, r.come ?? r.peice, r.gone ?? r.peice, Number(r.rate || 0).toFixed(2), 'Rs ' + Number(r.amount || 0).toFixed(0)])
              );
            } else {
              head = [['Lot no', 'Piece', 'Rate', 'Amount']];
              body = h.rows.map(r => [r.lotNo, r.peice, Number(r.rate || 0).toFixed(2), 'Rs ' + Number(r.amount || 0).toFixed(0)]);
            }
            payBody = (h.paymentRows || []).map((pr, idx) => [idx + 1, formatDateDMY(pr.date || '') || '-', 'Rs ' + Number(pr.payment || 0).toFixed(0)]);
          } else {
            const meta = state.hisabMeta[type]?.[name] || { lastBalance: '', entries: {}, paymentRows: [] };
            const matchingRows = getHisabSortedRows(getUnpaidDeptRows(type, name).filter(r => !(meta.entries[r.id]?.ignored)), type, name, currentHisab.sortBy || 'lot');
            lastBalance = parseFloat(meta.lastBalance) || 0;

            if (isStage) {
              head = [isTanki
                ? ['Lot no', 'Come', 'Gone', 'Fabrication', 'Washing', 'Rate', 'Amount']
                : (isWash
                    ? ['Lot no', 'Come', 'Gone', 'Washing', 'Rate', 'Amount']
                    : ['Lot no', 'Come', 'Gone', 'Rate', 'Amount'])];
            } else {
              head = [['Lot no', 'Piece', 'Rate', 'Amount']];
            }

            matchingRows.forEach(r => {
              const en = meta.entries[r.id] || {};
              const vals = getDeptRowValues(type, r, name, en);
              totalPiece += vals.pcs;
              totalGonePdf += vals.gone;
              totalAmount += vals.amount;
              if (isStage) {
                body.push(isTanki
                  ? [r.lotNo, vals.come, vals.gone, r.fabrication?.name || '-', r.washing?.name || '-', Number(vals.rate || 0).toFixed(2), 'Rs ' + vals.amount.toFixed(0)]
                  : (isWash
                      ? [r.lotNo, vals.come, vals.gone, r.washing?.washingType || '-', Number(vals.rate || 0).toFixed(2), 'Rs ' + vals.amount.toFixed(0)]
                      : [r.lotNo, vals.come, vals.gone, Number(vals.rate || 0).toFixed(2), 'Rs ' + vals.amount.toFixed(0)])
                );
              } else {
                body.push([r.lotNo, vals.pcs, Number(vals.rate || 0).toFixed(2), 'Rs ' + vals.amount.toFixed(0)]);
              }
            });
            const allPayPdf = [
              ...getDaybookPaymentsForName(name).filter(d => !(meta.ignoredDbPayments && meta.ignoredDbPayments[d.dbId])).map(d => ({ date: d.date, payment: d.payment })),
              ...(meta.paymentRows || []).filter(pr => !pr.ignored)
            ].sort((a, b) => (!a.date && !b.date) ? 0 : (!a.date ? 1 : (!b.date ? -1 : a.date.localeCompare(b.date))));
            allPayPdf.forEach((pr, idx) => {
              const p = parseFloat(pr.payment) || 0;
              totalPayment += p;
              payBody.push([idx + 1, formatDateDMY(pr.date || '') || '-', 'Rs ' + p.toFixed(0)]);
            });
            pcsBalPdf = totalPiece - totalGonePdf;
            pcsBalAmtPdf = isStage ? (parseFloat(meta.pcsBalAmount) || 0) : 0;
            finalBalance = (totalAmount + lastBalance) - totalPayment - pcsBalAmtPdf;
          }

          doc.setFontSize(15);
          doc.setFont('helvetica', 'bold');
          doc.text(titleText, 36, 40);
          doc.setFontSize(9.5);
          doc.setFont('helvetica', 'normal');
          doc.text(`Date: ${dateText}   |   By: ${state.activeUser}`, 36, 56);

          doc.setFontSize(9.5);
          doc.setFont('helvetica', 'bold');
          const alterBalPdf = (isSavedView && savedId)
            ? Number((state.savedHisabs.find(x => x.id === savedId)?.alterBal) ?? getAlterBalance(name))
            : getAlterBalance(name);
          const pcsBalLine = isStage ? `   |   Pcs Bal: ${pcsBalPdf} pcs (-Rs ${pcsBalAmtPdf.toFixed(0)})` : '';
          const alterLine = alterBalPdf ? `   |   Alter Bal: ${alterBalPdf} pcs` : '';
          doc.text(
            `Total Piece: ${totalPeice}   |   Kaam: Rs ${totalAmount.toFixed(0)}   |   Last Bal: Rs ${lastBalance.toFixed(0)}${pcsBalLine}${alterLine}   |   Pay: Rs ${totalPayment.toFixed(0)}   |   Final Bal: Rs ${finalBalance.toFixed(0)}`,
            24,
            76,
            { maxWidth: 547 }
          );

          const hasPay = payBody.length > 0;
          const totalGoneForFoot = body.reduce((s, row) => s + (isStage ? (Number(row[2]) || 0) : 0), 0);
          const foot = isStage
            ? [isTanki
                ? ['Total', totalPeice, totalGoneForFoot, '', '', '', 'Rs ' + totalAmount.toFixed(0)]
                : (isWash
                    ? ['Total', totalPeice, totalGoneForFoot, '', '', 'Rs ' + totalAmount.toFixed(0)]
                    : ['Total', totalPeice, totalGoneForFoot, '', 'Rs ' + totalAmount.toFixed(0)])]
            : [['Total', totalPeice, '', 'Rs ' + totalAmount.toFixed(0)]];

          doc.autoTable({
            startY: 90,
            head,
            body,
            foot,
            theme: 'grid',
            styles: { fontSize: hasPay ? 7.5 : 8.5, cellPadding: hasPay ? 3 : 4, overflow: 'linebreak' },
            headStyles: { fillColor: [15, 23, 42], textColor: 255, fontStyle: 'bold' },
            footStyles: { fillColor: [241, 245, 249], textColor: [15, 23, 42], fontStyle: 'bold' },
            margin: hasPay ? { left: 24, right: 205 } : { left: 32, right: 32 }
          });

          if (hasPay) {
            doc.autoTable({
              startY: 90,
              head: [['#', 'Date', 'Payment']],
              body: payBody,
              theme: 'grid',
              styles: { fontSize: 7.5, cellPadding: 3 },
              headStyles: { fillColor: [6, 95, 70], textColor: 255, fontStyle: 'bold' },
              margin: { left: 400, right: 24 }
            });
          }

          const blob = doc.output('blob');
          const fileName = (type + '_' + name + '_hisab.pdf').replace(/\s+/g, '_');
          const file = new File([blob], fileName, { type: 'application/pdf' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: name + ' Hisab PDF',
              text: name + ' Hisab Sheet (PDF)'
            });
            showToast('PDF shared successfully!');
          } else {
            doc.save(fileName);
            showToast('Full Hisab PDF downloaded! Share on WhatsApp.');
          }
        } catch (err) {
          showToast('Could not generate PDF');
        }
      }

              u.status = 'rejected';
              state.notifications.forEach(n => { if (n.userId === u.id) n.status = 'rejected'; });
              saveLocalState();
              openNotificationsModal();
              showToast(u.name + ' rejected');
            }
          });
        });

        document.querySelectorAll('[data-del-user]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-del-user');
            state.users = state.users.filter(x => x.id !== id);
            saveLocalState();
            openNotificationsModal();
          });
        });

        document.querySelectorAll('[data-notif-action]').forEach(btn => {
          btn.addEventListener('click', () => {
            const act = btn.getAttribute('data-notif-action');

            if (!n) return;
            if (act === 'mark_read') {
              n.status = 'read';

              n.status = 'rejected';

              const row = getRow(n.rowId);

            }
            saveLocalState();
            renderTable();
            openNotificationsModal();
          });
        });
      }

      let lastBackupFileHandle = null;

      function getBackupPayloadString() {
        return JSON.stringify({
          app: 'LotProductionTracker',
          version: 2,
          exportedAt: new Date().toISOString(),
          exportedBy: state.activeUser,
          editPin: state.editPin,
          tables: state.tables,
          rows: state.rows,
          users: state.users,
          notifications: state.notifications,
          savedHisabs: state.savedHisabs,
          alterData: state.alterData,
          daybook: state.daybook,
          settledDaybookKeys: state.settledDaybookKeys,
          hisabMeta: state.hisabMeta
        }, null, 2);
      }

      function applyImportedData(parsed) {
        if (!parsed || !Array.isArray(parsed.rows)) {
          showToast('Invalid backup file');
          return false;
        }
        if (parsed.editPin) state.editPin = String(parsed.editPin);
        if (Array.isArray(parsed.tables) && parsed.tables.length) state.tables = parsed.tables;
        state.rows = parsed.rows.map(normalizeRowStages);
        deduplicateAndSortRows();
        state.users = Array.isArray(parsed.users) ? parsed.users : state.users;
        state.notifications = Array.isArray(parsed.notifications) ? parsed.notifications : state.notifications;
        state.savedHisabs = Array.isArray(parsed.savedHisabs) ? parsed.savedHisabs : [];
        state.hisabMeta = Object.assign({ master: {}, embroidery: {}, fabrication: {}, washing: {}, tanki: {}, packing: {}, laser: {}, print: {} }, parsed.hisabMeta || {});
        saveLocalState();
        renderTable();
        return true;
      }

      async function saveBackupToUserLocation(useLastHandle) {
        const payload = getBackupPayloadString();
        const fileName = 'lot_tracker_backup_' + todayISO() + '.json';

        if (window.showSaveFilePicker) {
          try {
            let handle = (useLastHandle && lastBackupFileHandle) ? lastBackupFileHandle : null;
            if (!handle) {
              handle = await window.showSaveFilePicker({
                suggestedName: fileName,
                types: [{ description: 'JSON Backup File', accept: { 'application/json': ['.json'] } }]
              });
              lastBackupFileHandle = handle;
            }
            const writable = await handle.createWritable();
            await writable.write(payload);
            await writable.close();
            showToast('Backup saved to selected location!');
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }

        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Backup downloaded to device storage!');
      }

      async function restoreBackupFromUserLocation() {
        if (window.showOpenFilePicker) {
          try {
            const [handle] = await window.showOpenFilePicker({
              multiple: false,
              types: [{ description: 'JSON Backup File', accept: { 'application/json': ['.json'] } }]
            });
            const file = await handle.getFile();
            const text = await file.text();
            const parsed = JSON.parse(text);
            if (applyImportedData(parsed)) {
              closeModal();
              showToast('Data restored from selected file!');
            }
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'file';
        hiddenInput.accept = '.json,application/json';
        hiddenInput.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              if (applyImportedData(parsed)) {
                closeModal();
                showToast('Data restored from selected file!');
              }
            } catch (err) {
              showToast('Invalid backup file');
            }
          };
          reader.readAsText(file);
        };
        hiddenInput.click();
      }

            const ep = getFirebaseEndpoint();
            if (!ep) {

              resEl.className = 'text-rose-400 font-bold';
              return;
            }
            resEl.textContent = 'Testing...';
            resEl.className = 'text-amber-300 font-bold';
            try {
              const gRes = await fetch(ep);
              if (!gRes.ok) {
                resEl.textContent = 'Read Error: HTTP ' + gRes.status + (gRes.status === 401 || gRes.status === 403 ? ' (Rules Lock!)' : '');
                resEl.className = 'text-rose-400 font-bold';
                return;
              }
              const pushTs = Date.now();
              const pRes = await fetch(ep, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  editPin: state.editPin, tables: state.tables, activeTable: state.activeTable,
                  rows: state.rows, users: state.users, notifications: state.notifications,
                  savedHisabs: state.savedHisabs, alterData: state.alterData, daybook: state.daybook,
                  settledDaybookKeys: state.settledDaybookKeys, hisabMeta: state.hisabMeta,
                  updatedBy: state.activeUser, updatedAt: pushTs
                })
              });
              if (pRes.ok) {
                lastPushFailed = false;
                lastCloudUpdatedAt = pushTs;
                resEl.textContent = '✅ Read & Write OK (Synced!)';
                resEl.className = 'text-emerald-400 font-bold';
                showToast('Firebase Read & Write OK!');
              } else {
                resEl.textContent = 'Write Error: HTTP ' + pRes.status + (pRes.status === 401 || pRes.status === 403 ? ' (Rules Lock!)' : '');
                resEl.className = 'text-rose-400 font-bold';
              }
            } catch (err) {
              resEl.textContent = 'Network / Offline Error';
              resEl.className = 'text-rose-400 font-bold';
            }
          });
        }

        document.getElementById('syncForm').addEventListener('submit', (e) => {

        document.getElementById('exportJsonBtn').addEventListener('click', () => {

      document.addEventListener('click', (e) => {

      document.getElementById('lotTableBody').addEventListener('change', (e) => {

            const norm = normalizeLotNo(e.target.value);
            const sufMatch = norm.match(/^\d+([A-Za-z]+)$/);
            const tKey = sufMatch ? sufMatch[1].toUpperCase() : (/^\d+$/.test(norm) ? 'Main' : (row.tableKey || 'Main'));
            const dup = norm && state.rows.find(r => r.id !== row.id && (r.tableKey || 'Main') === tKey && normalizeLotNo(r.lotNo) === norm);
            if (dup) {
              showToast('Lot ' + norm + ' is table me pehle se maujood hai!');
              e.target.value = row.lotNo;
              return;

            row.lotNo = norm;

      let userExitedFullscreen = false;

      function isFullscreenActive() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }

      function updateFullscreenBtn() {
        const btn = document.getElementById('fullscreenToggleBtn');
        if (!btn) return;
        btn.textContent = isFullscreenActive() ? '✕' : '⛶';
      }

      async function enterImmersiveFullscreen() {
        if (isFullscreenActive()) return;
        const el = document.documentElement;
        try {
          if (el.requestFullscreen) {
            await el.requestFullscreen({ navigationUI: 'hide' });
          } else if (el.webkitRequestFullscreen) {
            el.webkitRequestFullscreen();
          }
        } catch (e) {
          // Ignore if blocked by iframe policy
        }
        updateFullscreenBtn();
      }

      async function toggleImmersiveFullscreen() {
        try {
          if (isFullscreenActive()) {
            userExitedFullscreen = true;
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          } else {
            userExitedFullscreen = false;
            await enterImmersiveFullscreen();
          }
        } catch (e) {
          // Ignore if blocked
        }
        updateFullscreenBtn();
      }

      document.getElementById('fullscreenToggleBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleImmersiveFullscreen();
      });
      document.addEventListener('fullscreenchange', updateFullscreenBtn);
      document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);

      // Auto-enter immersive fullscreen on first user tap (Android Chrome requirement)
      document.addEventListener('pointerdown', function onFirstTap() {
        if (!userExitedFullscreen && !isFullscreenActive()) {
          enterImmersiveFullscreen();
        }
        document.removeEventListener('pointerdown', onFirstTap);
      }, { passive: true });

      function scrollToLatestLot() {
        const sc = document.getElementById('mainTableScroll');
        if (sc) {

            });
          });
        }
      }

      const ZOOM_KEY = 'lot_tracker_v2_zoom';
      let tableZoom = 1;
      try {
        const z = parseFloat(localStorage.getItem(ZOOM_KEY));
        if (z >= 0.5 && z <= 1.6) tableZoom = z;
      } catch (e) {}

      function applyTableZoom() {
        const tbl = document.getElementById('mainTableElement');
        const lbl = document.getElementById('zoomResetBtn');
        if (tbl) tbl.style.zoom = String(tableZoom);
        if (lbl) lbl.textContent = Math.round(tableZoom * 100) + '%';
        try { localStorage.setItem(ZOOM_KEY, String(tableZoom)); } catch (e) {}
      }

        tableZoom = 1;

      });

      const TOOLBAR_LAYOUT_KEY = 'lot_tracker_v2_toolbar_layout';
      const TOP_ROW_IDS = ['topRow1', 'topRow2', 'topRow3'];
      const MOVABLE_BTN_IDS = [
        'userSwitchBtn', 'notifBellBtn', 'appModeToggleBtn', 'syncSettingsBtn', 'fullscreenToggleBtn',
        'addRowBtn', 'hisabDropdownBtn', 'alterBtn', 'pendingLotsBtn', 'savedHisabBtn', 'backupRestoreBtn',
        'daybookBtn'
      ];
      let activeMoveBtn = null;

      function saveToolbarLayout() {
        try {
          const layout = {};
          TOP_ROW_IDS.forEach(rId => {
            const rowEl = document.getElementById(rId);
            if (!rowEl) return;
            layout[rId] = Array.from(rowEl.children)
              .filter(el => MOVABLE_BTN_IDS.includes(el.id))
              .map(el => el.id);
          });
          localStorage.setItem(TOOLBAR_LAYOUT_KEY, JSON.stringify(layout));
        } catch (e) {}
      }

      function applySavedToolbarLayout() {
        try {
          const raw = localStorage.getItem(TOOLBAR_LAYOUT_KEY);
          if (!raw) return;
          const layout = JSON.parse(raw);
          TOP_ROW_IDS.forEach(rId => {
            const rowEl = document.getElementById(rId);
            if (!rowEl || !Array.isArray(layout[rId])) return;
            layout[rId].forEach(bId => {
              const btn = document.getElementById(bId);
              if (btn) rowEl.appendChild(btn);
            });
          });
        } catch (e) {}
      }

      function openBtnMover(btn) {
        if (activeMoveBtn) activeMoveBtn.classList.remove('ring-2', 'ring-amber-400');
        activeMoveBtn = btn;
        activeMoveBtn.classList.add('ring-2', 'ring-amber-400');
        document.getElementById('btnMoverLabel').textContent = (btn.textContent || 'Button').trim();
        document.getElementById('btnMoverBar').classList.remove('hidden');
      }

      function closeBtnMover() {
        if (activeMoveBtn) activeMoveBtn.classList.remove('ring-2', 'ring-amber-400');
        activeMoveBtn = null;
        document.getElementById('btnMoverBar').classList.add('hidden');
      }

      function getMovableSiblings(rowEl) {
        return Array.from(rowEl.children).filter(el => MOVABLE_BTN_IDS.includes(el.id));
      }

      document.getElementById('moveLeftBtn').addEventListener('click', () => {
        if (!activeMoveBtn) return;
        const parent = activeMoveBtn.parentElement;
        const sibs = getMovableSiblings(parent);
        const idx = sibs.indexOf(activeMoveBtn);
        if (idx > 0) {
          parent.insertBefore(activeMoveBtn, sibs[idx - 1]);
          saveToolbarLayout();
        }
      });

      document.getElementById('moveRightBtn').addEventListener('click', () => {
        if (!activeMoveBtn) return;
        const parent = activeMoveBtn.parentElement;
        const sibs = getMovableSiblings(parent);
        const idx = sibs.indexOf(activeMoveBtn);
        if (idx >= 0 && idx < sibs.length - 1) {
          parent.insertBefore(sibs[idx + 1], activeMoveBtn);
          saveToolbarLayout();
        }
      });

      document.getElementById('moveUpBtn').addEventListener('click', () => {
        if (!activeMoveBtn) return;
        const curRowIdx = TOP_ROW_IDS.indexOf(activeMoveBtn.parentElement.id);
        if (curRowIdx > 0) {
          const targetRow = document.getElementById(TOP_ROW_IDS[curRowIdx - 1]);
          if (targetRow) {
            targetRow.appendChild(activeMoveBtn);
            saveToolbarLayout();
          }
        }
      });

      document.getElementById('moveDownBtn').addEventListener('click', () => {
        if (!activeMoveBtn) return;
        const curRowIdx = TOP_ROW_IDS.indexOf(activeMoveBtn.parentElement.id);
        if (curRowIdx >= 0 && curRowIdx < TOP_ROW_IDS.length - 1) {
          const targetRow = document.getElementById(TOP_ROW_IDS[curRowIdx + 1]);
          if (targetRow) {
            targetRow.appendChild(activeMoveBtn);
            saveToolbarLayout();
          }
        }
      });

      document.getElementById('moveResetBtn').addEventListener('click', () => {
        try { localStorage.removeItem(TOOLBAR_LAYOUT_KEY); } catch (e) {}
        closeBtnMover();
        location.reload();
      });

      document.getElementById('moveDoneBtn').addEventListener('click', closeBtnMover);

      MOVABLE_BTN_IDS.forEach(bId => {
        const btn = document.getElementById(bId);
        if (!btn) return;
        let lpTimer = null;
        let startX = 0, startY = 0;
        let triggered = false;
        btn.addEventListener('pointerdown', (e) => {
          startX = e.clientX;
          startY = e.clientY;
          triggered = false;
          lpTimer = setTimeout(() => {
            triggered = true;
            openBtnMover(btn);
          }, 500);
        });
        btn.addEventListener('pointermove', (e) => {
          if (lpTimer && (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10)) {
            clearTimeout(lpTimer);
            lpTimer = null;
          }
        });
        const cancelLp = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };
        btn.addEventListener('pointerup', cancelLp);
        btn.addEventListener('pointercancel', cancelLp);
        btn.addEventListener('click', (e) => {
          if (triggered) {
            e.preventDefault();
            e.stopImmediatePropagation();
            triggered = false;
          }
        }, true);
      });

      applySavedToolbarLayout();
      loadLocalState();
      applyTableZoom();
      checkAuthGate();
      startSyncPolling();
    })();
  </script>
