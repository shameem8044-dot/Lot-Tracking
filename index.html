            <td data-hisab-amount-cell="${r.id}" class="px-2 py-2 text-right font-bold text-slate-900 border-r border-slate-200 whitespace-nowrap">₹${vals.amount.toFixed(0)}</td>
            <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
              <div class="relative w-24 h-7 border border-slate-300 rounded bg-white flex items-center justify-between px-1.5 text-xs">
                <span data-hisab-date-label="${r.id}" class="font-medium text-slate-800">${escapeHtml(formatDateDMY(entry.date))}</span>
                <span class="text-[10px] text-slate-400 no-print">📅</span>
                <input type="date" data-hisab-field="date" data-lot-id="${r.id}" value="${escapeHtml(entry.date || '')}" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
              </div>
            </td>
            <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
              <input type="number" step="0.01" data-hisab-field="payment" data-lot-id="${r.id}" value="${escapeHtml(entry.payment)}" placeholder="0" class="w-20 text-right border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
            </td>
            <td class="px-2 py-2 text-center no-print" data-html2canvas-ignore="true">
              <button type="button" data-toggle-ignore="${r.id}" class="px-2 py-1 rounded text-[11px] font-bold transition ${isIgnored ? 'bg-amber-500 text-slate-950' : 'bg-slate-200 hover:bg-slate-300 text-slate-700'}">
                ${isIgnored ? 'Ignored' : 'Ignore This Time'}
              </button>
            </td>
          </tr>`;
        }).join('');



        const draftRowsHtml = meta.draftRows.map((dr, dIdx) => {
          const dCome = parseFloat(dr.come || dr.peice) || 0;
          const dRate = parseFloat(dr.rate) || 0;
          const dAmt = dCome * dRate;
          const dPay = parseFloat(dr.payment) || 0;
          totalPeice += dCome;
          totalAmount += dAmt;
          totalPayment += dPay;

          return `<tr class="border-b border-slate-200 bg-indigo-50/40">
            <td class="px-2 py-2 border-r border-slate-200">
              <input type="text" data-draft-lot-input="${dIdx}" value="${escapeHtml(dr.lotNo || '')}" placeholder="Enter Lot" class="w-16 font-bold text-slate-900 border border-indigo-400 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </td>
            ${isStageDept ? `
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="number" inputmode="numeric" data-draft-field="come" data-draft-idx="${dIdx}" value="${escapeHtml(dr.come || '')}" placeholder="0" class="w-16 text-right font-semibold border border-slate-300 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="number" inputmode="numeric" data-draft-field="gone" data-draft-idx="${dIdx}" value="${escapeHtml(dr.gone || '')}" placeholder="0" class="w-16 text-right font-semibold border border-slate-300 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>
              ${isTankiHisab ? `
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="text" list="dl_hisab_fabrication" data-draft-field="fabricationName" data-draft-idx="${dIdx}" value="${escapeHtml(dr.fabricationName || '')}" placeholder="Fabrication" class="w-24 border border-slate-300 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="text" list="dl_hisab_washing" data-draft-field="washingName" data-draft-idx="${dIdx}" value="${escapeHtml(dr.washingName || '')}" placeholder="Washing" class="w-24 border border-slate-300 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>` : ''}
            ` : `
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="number" inputmode="numeric" data-draft-field="peice" data-draft-idx="${dIdx}" value="${escapeHtml(dr.peice || '')}" placeholder="0" class="w-16 text-right font-semibold border border-slate-300 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>
            `}
            <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
              <input type="number" step="0.01" inputmode="decimal" data-draft-field="rate" data-draft-idx="${dIdx}" value="${escapeHtml(dr.rate || '')}" placeholder="0" class="w-16 text-right border border-slate-300 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
            </td>
            <td data-draft-amount-cell="${dIdx}" class="px-2 py-2 text-right font-bold text-slate-900 border-r border-slate-200 whitespace-nowrap">₹${dAmt.toFixed(0)}</td>
            <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
              <div class="relative w-24 h-7 border border-slate-300 rounded bg-white flex items-center justify-between px-1.5 text-xs">
                <span data-draft-date-label="${dIdx}" class="font-medium text-slate-800">${escapeHtml(formatDateDMY(dr.date || ''))}</span>
                <span class="text-[10px] text-slate-400 no-print">📅</span>
                <input type="date" data-draft-field="date" data-draft-idx="${dIdx}" value="${escapeHtml(dr.date || '')}" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
              </div>
            </td>
            <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
              <input type="number" step="0.01" data-draft-field="payment" data-draft-idx="${dIdx}" value="${escapeHtml(dr.payment || '')}" placeholder="0" class="w-20 text-right border border-slate-300 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
            </td>
            <td class="px-2 py-2 text-center no-print" data-html2canvas-ignore="true">
              <button type="button" data-remove-draft="${dIdx}" class="px-2 py-1 rounded text-[11px] font-bold bg-rose-100 hover:bg-rose-200 text-rose-700">Remove</button>
            </td>
          </tr>`;
        }).join('');

        const lastBal = parseFloat(meta.lastBalance) || 0;
        const grandKaam = totalAmount + lastBal;
        const balance = grandKaam - totalPayment;

        const area = document.getElementById('hisabPrintArea');
        area.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-slate-900 pb-3 mb-4">
            <div>
              <div class="text-xs uppercase tracking-wider font-bold text-slate-500">${escapeHtml(label)} Hisab Sheet (Unpaid Only)</div>
              <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">${escapeHtml(name)}</h2>
            </div>
            <div class="text-right text-xs text-slate-500">
              <div>Date: <strong>${formatDateDMY(todayISO())}</strong></div>
              <div>By: <strong>${escapeHtml(state.activeUser)}</strong></div>
            </div>
          </div>

          <!-- Top Summary Cards -->
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 mb-4">
            <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200">
              <div class="text-[11px] text-slate-500 font-semibold">Total Peice</div>
              <div id="hisabTotalPeice" class="text-lg font-extrabold text-slate-900">${totalPeice}</div>
            </div>
            <div class="p-2.5 rounded-xl bg-indigo-50 border border-indigo-200">
              <div class="text-[11px] text-indigo-700 font-semibold">Total Amount (Kaam)</div>
              <div id="hisabTotalAmount" class="text-lg font-extrabold text-indigo-900">₹${totalAmount.toFixed(0)}</div>
            </div>
            <div class="p-2.5 rounded-xl bg-amber-50 border border-amber-200">
              <label class="block text-[11px] text-amber-800 font-semibold">Last Balance (+)</label>
              <input id="hisabLastBalanceInput" type="number" step="0.01" value="${escapeHtml(meta.lastBalance)}" placeholder="0" class="w-full mt-0.5 bg-white border border-amber-300 rounded px-2 py-0.5 text-sm font-bold text-slate-900 focus:outline-none" />
            </div>
            <div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200">
              <div class="text-[11px] text-emerald-700 font-semibold">Total Payment</div>
              <div id="hisabTotalPayment" class="text-lg font-extrabold text-emerald-900">₹${totalPayment.toFixed(0)}</div>
            </div>
            <div class="col-span-2 sm:col-span-1 p-2.5 rounded-xl bg-slate-900 text-white">
              <div class="text-[11px] text-slate-300 font-semibold">Final Balance</div>
              <div id="hisabFinalBalance" class="text-lg font-extrabold text-amber-300">₹${balance.toFixed(0)}</div>
            </div>
          </div>

          ${isTankiHisab ? buildDatalistHtml('dl_hisab_fabrication', 'fabrication') + buildDatalistHtml('dl_hisab_washing', 'washing') : ''}
          <!-- Hisab Table -->
          <div class="overflow-x-auto border border-slate-200 rounded-xl">
            <table class="w-full border-collapse text-xs sm:text-sm">
              <thead class="bg-slate-800 text-white">
                <tr>
                  <th class="px-2.5 py-2 text-left border-r border-slate-700">Lot no</th>
                  ${isStageDept ? `
                    <th class="px-2.5 py-2 text-right border-r border-slate-700">Come</th>
                    <th class="px-2.5 py-2 text-right border-r border-slate-700">Gone</th>
                    ${isTankiHisab ? '<th class="px-2.5 py-2 text-left border-r border-slate-700">Fabrication</th><th class="px-2.5 py-2 text-left border-r border-slate-700">Washing</th>' : ''}
                  ` : `<th class="px-2.5 py-2 text-right border-r border-slate-700">Peice</th>`}
                  <th class="px-2.5 py-2 text-right border-r border-slate-700">Rate</th>
                  <th class="px-2.5 py-2 text-right border-r border-slate-700">Amount (Kaam)</th>
                  <th class="px-2.5 py-2 text-left border-r border-slate-700">Date</th>
                  <th class="px-2.5 py-2 text-right border-r border-slate-700">Payment</th>
                  <th class="px-2.5 py-2 text-center no-print" data-html2canvas-ignore="true">Action</th>
                </tr>
              </thead>
              <tbody>
                ${(rowsHtml || draftRowsHtml) ? (rowsHtml + draftRowsHtml) : `<tr><td colspan="${isTankiHisab ? 10 : (isStageDept ? 8 : 7)}" class="text-center py-6 text-slate-400">No unpaid entries</td></tr>`}
              </tbody>
            </table>
          </div>
          <div class="mt-3 flex justify-end no-print">
            <button id="addHisabLotRowBtn" type="button" class="edit-only-control px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm shadow transition">
              + Add Row
            </button>
          </div>
        `;

        document.getElementById('hisabLastBalanceInput').addEventListener('input', (e) => {
          meta.lastBalance = e.target.value;
          saveLocalState();
          recalcHisabTotalsOnly();
        });

        document.getElementById('addHisabLotRowBtn').addEventListener('click', () => {
          meta.draftRows.push({
            lotNo: '',
            come: '',
            gone: '',
            peice: '',
            fabricationName: '',
            washingName: '',
            rate: '',
            date: '',
            payment: ''
          });
          saveLocalState();
          renderHisabContent();
          const lastLotInp = area.querySelector(`[data-draft-lot-input="${meta.draftRows.length - 1}"]`);
          if (lastLotInp) lastLotInp.focus();
        });

        area.querySelectorAll('[data-draft-field]').forEach(inp => {
          inp.addEventListener('input', (e) => {
            const dIdx = parseInt(e.target.getAttribute('data-draft-idx'), 10);
            const field = e.target.getAttribute('data-draft-field');
            if (meta.draftRows[dIdx]) {
              meta.draftRows[dIdx][field] = e.target.value;
              if (field === 'date') {
                const lbl = area.querySelector(`[data-draft-date-label="${dIdx}"]`);
                if (lbl) lbl.textContent = formatDateDMY(e.target.value);
              }
              saveLocalState();
              recalcHisabTotalsOnly();
            }
          });
        });

        area.querySelectorAll('[data-remove-draft]').forEach(btn => {
          btn.addEventListener('click', () => {
            const dIdx = parseInt(btn.getAttribute('data-remove-draft'), 10);
            meta.draftRows.splice(dIdx, 1);
            saveLocalState();
            renderHisabContent();
          });
        });

        area.querySelectorAll('[data-draft-lot-input]').forEach(inp => {
          inp.addEventListener('change', (e) => {
            const dIdx = parseInt(e.target.getAttribute('data-draft-lot-input'), 10);
            const enteredLot = (e.target.value || '').trim();
            if (!enteredLot) return;
            const dr = meta.draftRows[dIdx];
            if (!dr) return;

            let targetRow = state.rows.find(r => (r.lotNo || '').trim().toLowerCase() === enteredLot.toLowerCase());
            if (!targetRow) {
              // Auto-create all intermediate rows up to enteredLot if numeric
              const targetNum = /^\d+$/.test(enteredLot) ? parseInt(enteredLot, 10) : null;
              let maxNum = 0;
              state.rows.forEach(r => {
                if (/^\d+$/.test((r.lotNo || '').trim())) {
                  const n = parseInt(r.lotNo.trim(), 10);
                  if (n > maxNum) maxNum = n;
                }
              });

              if (targetNum !== null && targetNum > maxNum && maxNum > 0 && (targetNum - maxNum) <= 500) {
                for (let n = maxNum + 1; n <= targetNum; n++) {
                  const created = createRow(String(n));
                  state.rows.push(created);
                  if (n === targetNum) targetRow = created;
                }
              } else {
                targetRow = createRow(enteredLot);
                state.rows.push(targetRow);
              }
            }

            normalizeRowStages(targetRow);

            // Apply Hisab person name & status so it belongs to this Hisab
            if (type === 'master') {
              targetRow.masterName = name;
              targetRow.masterPaid = false;
              if (dr.peice) targetRow.peice = dr.peice;
              if (dr.date) targetRow.date = dr.date;
            } else if (isStageDept) {
              targetRow[type].name = name;
              targetRow[type].paid = false;
              if (['fabrication', 'washing', 'packing'].includes(type)) {
                targetRow[type].status = 'Clear';
              }
              if (dr.rate) targetRow[type].rate = dr.rate;
              if (dr.gone) targetRow[type].goneEntries[0].peice = dr.gone;
              if (dr.date) targetRow[type].goneEntries[0].date = dr.date;
              if (dr.come) {
                if (type === 'fabrication') targetRow.peice = dr.come;
                else if (type === 'tanki') targetRow.fabrication.goneEntries[0].peice = dr.come;
                else if (type === 'washing') targetRow.tanki.goneEntries[0].peice = dr.come;
                else if (type === 'packing') targetRow.washing.goneEntries[0].peice = dr.come;
              }
              if (isTankiHisab && dr.fabricationName) {
                targetRow.fabrication.name = dr.fabricationName;
              }
              if (isTankiHisab && dr.washingName) {
                targetRow.washing.name = dr.washingName;
              }
            } else {
              targetRow[type].name = name;
              targetRow[type].paid = false;
              if (dr.peice) targetRow[type].peice = dr.peice;
              if (dr.rate && DEPT_CONFIG[type]?.hasTableRate) targetRow[type].rate = dr.rate;
              if (dr.date) targetRow[type].date = dr.date;
            }

            meta.entries[targetRow.id] = {
              rate: dr.rate || meta.entries[targetRow.id]?.rate || '',
              date: dr.date || meta.entries[targetRow.id]?.date || '',
              payment: dr.payment || meta.entries[targetRow.id]?.payment || '',
              ignored: false
            };

            targetRow.updatedBy = state.activeUser;
            targetRow.updatedAt = Date.now();
            meta.draftRows.splice(dIdx, 1);
            saveLocalState();
            renderTable();
            renderHisabContent();
            showToast('Lot ' + enteredLot + ' updated in Hisab & Main Table');
          });
        });

        area.querySelectorAll('[data-hisab-lot-field]').forEach(inp => {
          inp.addEventListener('input', (e) => {
            const lotId = e.target.getAttribute('data-lot-id');
            const field = e.target.getAttribute('data-hisab-lot-field');
            const row = getRow(lotId);
            if (!row) return;
            if (field === 'lotNo') {
              row.lotNo = e.target.value;
            } else if (field === 'come') {
              normalizeRowStages(row);
              if (type === 'fabrication') {
                row.peice = e.target.value;
              } else if (type === 'tanki') {
                row.fabrication.goneEntries[0].peice = e.target.value;
              } else if (type === 'washing') {
                row.tanki.goneEntries[0].peice = e.target.value;
              } else if (type === 'packing') {
                row.washing.goneEntries[0].peice = e.target.value;
              }
            } else if (field === 'gone') {
              normalizeRowStages(row);
              row[type].goneEntries[0].peice = e.target.value;
            } else if (field === 'fabricationName') {
              row.fabrication.name = e.target.value;
            } else if (field === 'washingName') {
              row.washing.name = e.target.value;
            } else if (field === 'peice') {
              if (type === 'master') {
                row.peice = e.target.value;
              } else {
                row[type].peice = e.target.value;
              }
            }
            row.updatedBy = state.activeUser;
            row.updatedAt = Date.now();
            saveLocalState();
            renderTable();
            recalcHisabTotalsOnly();
          });
        });

        area.querySelectorAll('[data-hisab-field]').forEach(inp => {
          inp.addEventListener('input', (e) => {
            const lotId = e.target.getAttribute('data-lot-id');
            const field = e.target.getAttribute('data-hisab-field');
            if (!meta.entries[lotId]) meta.entries[lotId] = { rate: '', date: '', payment: '' };
            meta.entries[lotId][field] = e.target.value;
            if (field === 'date') {
              const lbl = area.querySelector(`[data-hisab-date-label="${lotId}"]`);
              if (lbl) lbl.textContent = formatDateDMY(e.target.value);
            }

            const row = getRow(lotId);
            if (row) {
              if (field === 'rate' && DEPT_CONFIG[type]?.hasTableRate) {
                row[type].rate = e.target.value;
              } else if (field === 'date') {
                if (type === 'master') row.date = e.target.value;
                else if (['fabrication', 'tanki', 'washing', 'packing'].includes(type)) {
                  normalizeRowStages(row);
                  row[type].goneEntries[0].date = e.target.value;
                } else {
                  row[type].date = e.target.value;
                }
              }
              row.updatedBy = state.activeUser;
              row.updatedAt = Date.now();
              renderTable();
            }

            saveLocalState();
            recalcHisabTotalsOnly();
          });
        });



        area.querySelectorAll('[data-toggle-ignore]').forEach(btn => {
          btn.addEventListener('click', () => {
            const lotId = btn.getAttribute('data-toggle-ignore');
            if (!meta.entries[lotId]) meta.entries[lotId] = { rate: '', date: '', payment: '', ignored: false };
            meta.entries[lotId].ignored = !meta.entries[lotId].ignored;
            saveLocalState();
            renderHisabContent();
          });
        });

        if (appMode === 'view') {
          area.querySelectorAll('input').forEach(inp => {
            inp.setAttribute('readonly', 'readonly');
            inp.setAttribute('disabled', 'disabled');
          });
          area.querySelectorAll('[data-toggle-ignore], [data-remove-draft]').forEach(btn => btn.classList.add('hidden'));
        }

        function recalcHisabTotalsOnly() {
          let tPcs = 0;
          let tAmt = 0;
          let tPay = 0;
          matchingRows.forEach(r => {
            const en = meta.entries[r.id] || {};
            const vals = getDeptRowValues(type, r, name, en);
            const amtCell = area.querySelector(`[data-hisab-amount-cell="${r.id}"]`);
            if (amtCell) amtCell.textContent = '₹' + vals.amount.toFixed(0);
            if (!en.ignored) {
              tPcs += vals.pcs;
              tAmt += vals.amount;
              tPay += parseFloat(en.payment) || 0;
            }
          });

          meta.draftRows.forEach((dr, dIdx) => {
            const dCome = parseFloat(dr.come || dr.peice) || 0;
            const dRate = parseFloat(dr.rate) || 0;
            const dAmt = dCome * dRate;
            tPcs += dCome;
            tAmt += dAmt;
            tPay += parseFloat(dr.payment) || 0;
            const dAmtCell = area.querySelector(`[data-draft-amount-cell="${dIdx}"]`);
            if (dAmtCell) dAmtCell.textContent = '₹' + dAmt.toFixed(0);
          });
          const lb = parseFloat(meta.lastBalance) || 0;
          const bal = (tAmt + lb) - tPay;
          const pcsEl = document.getElementById('hisabTotalPeice');
          if (pcsEl) pcsEl.textContent = tPcs;
          document.getElementById('hisabTotalAmount').textContent = '₹' + tAmt.toFixed(0);
          document.getElementById('hisabTotalPayment').textContent = '₹' + tPay.toFixed(0);
          document.getElementById('hisabFinalBalance').textContent = '₹' + bal.toFixed(0);
        }
      }

      function saveCurrentHisab() {
        const { type, name, isSavedView } = currentHisab;
        if (!type || !name || isSavedView) return;
        const meta = state.hisabMeta[type]?.[name] || { lastBalance: '', entries: {} };
        const matchingRows = getUnpaidDeptRows(type, name);
        const included = matchingRows.filter(r => !(meta.entries[r.id]?.ignored));

        if (!included.length) {
          showToast('Save karne ke liye kam se kam 1 non-ignored lot chahiye');
          return;
        }

        let totalPeice = 0;
        let totalAmount = 0;
        let totalPayment = 0;
        const snapshotRows = included.map(r => {
          const en = meta.entries[r.id] || {};
          const vals = getDeptRowValues(type, r, name, en);
          const payment = parseFloat(en.payment) || 0;
          totalPeice += vals.pcs;
          totalAmount += vals.amount;
          totalPayment += payment;
          return {
            lotNo: r.lotNo,
            peice: vals.pcs,
            come: vals.come,
            gone: vals.gone,
            fabricationName: r.fabrication?.name || '',
            washingName: r.washing?.name || '',
            rate: vals.rate,
            amount: vals.amount,
            date: en.date || '',
            payment
          };
        });

        const lastBalance = parseFloat(meta.lastBalance) || 0;
        const finalBalance = (totalAmount + lastBalance) - totalPayment;
        const nextNum = (state.savedHisabs.length || 0) + 1;
        const hisabTitle = 'Hisab ' + nextNum;

        const snapshot = {
          id: 'hisab_' + Date.now().toString(36),
          title: hisabTitle,
          dept: type,
          deptLabel: DEPT_CONFIG[type]?.label || type,
          name,
          savedDate: todayISO(),
          savedBy: state.activeUser,
          totalPeice,
          totalAmount,
          lastBalance,
          totalPayment,
          finalBalance,
          rows: snapshotRows
        };

        // Mark included lots Paid & light green in Main Table
        included.forEach(r => {
          if (type === 'master') {
            r.masterPaid = true;
            r.masterPaidLight = true;
          } else {
            r[type].paid = true;
            r[type].paidLight = true;
          }
          r.updatedBy = state.activeUser;
          r.updatedAt = Date.now();
        });

        // Reset ignored flags for remaining rows so next time starts clean
        matchingRows.forEach(r => {
          if (meta.entries[r.id]) meta.entries[r.id].ignored = false;
        });

        state.savedHisabs.push(snapshot);
        saveLocalState();
        renderTable();
        document.getElementById('hisabOverlay').classList.add('hidden');
        document.getElementById('hisabOverlay').classList.remove('flex');
        showToast(hisabTitle + ' saved! Lots marked Paid (Light Green).');
      }

      async function shareHisabAsPdf() {
        if (!window.jspdf || !window.jspdf.jsPDF) {
          showToast('PDF library loading, try again');
          return;
        }
        showToast('Generating Full Hisab PDF...');
        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
          const { type, name, isSavedView, savedId } = currentHisab;
          const label = DEPT_CONFIG[type]?.label || type;
          const isStage = ['fabrication', 'tanki', 'washing', 'packing'].includes(type);
          const isTanki = type === 'tanki';

          let totalPeice = 0, totalAmount = 0, lastBalance = 0, totalPayment = 0, finalBalance = 0;
          let head = [];
          let body = [];
          let titleText = `${label} Hisab — ${name}`;
          let dateText = formatDateDMY(todayISO());

          if (isSavedView && savedId) {
            const h = state.savedHisabs.find(x => x.id === savedId);
            if (!h) return;
            titleText = `${h.title} (${h.deptLabel}) — ${h.name}`;
            dateText = formatDateDMY(h.savedDate);
            totalPeice = h.totalPeice || 0;
            totalAmount = Number(h.totalAmount || 0);
            lastBalance = Number(h.lastBalance || 0);
            totalPayment = Number(h.totalPayment || 0);
            finalBalance = Number(h.finalBalance || 0);

            if (isStage) {
              head = [isTanki
                ? ['Lot no', 'Come', 'Gone', 'Fabrication', 'Washing', 'Rate', 'Amount', 'Date', 'Payment']
                : ['Lot no', 'Come', 'Gone', 'Rate', 'Amount', 'Date', 'Payment']];
              body = h.rows.map(r => isTanki
                ? [r.lotNo, r.come ?? r.peice, r.gone ?? r.peice, r.fabricationName || '-', r.washingName || '-', Number(r.rate || 0).toFixed(2), 'Rs ' + Number(r.amount || 0).toFixed(0), formatDateDMY(r.date || ''), 'Rs ' + Number(r.payment || 0).toFixed(0)]
                : [r.lotNo, r.come ?? r.peice, r.gone ?? r.peice, Number(r.rate || 0).toFixed(2), 'Rs ' + Number(r.amount || 0).toFixed(0), formatDateDMY(r.date || ''), 'Rs ' + Number(r.payment || 0).toFixed(0)]
              );
            } else {
              head = [['Lot no', 'Peice', 'Rate', 'Amount', 'Date', 'Payment']];
              body = h.rows.map(r => [r.lotNo, r.peice, Number(r.rate || 0).toFixed(2), 'Rs ' + Number(r.amount || 0).toFixed(0), formatDateDMY(r.date || ''), 'Rs ' + Number(r.payment || 0).toFixed(0)]);
            }
          } else {
            const meta = state.hisabMeta[type]?.[name] || { lastBalance: '', entries: {} };
            const matchingRows = getUnpaidDeptRows(type, name).filter(r => !(meta.entries[r.id]?.ignored));
            lastBalance = parseFloat(meta.lastBalance) || 0;

            if (isStage) {
              head = [isTanki
                ? ['Lot no', 'Come', 'Gone', 'Fabrication', 'Washing', 'Rate', 'Amount', 'Date', 'Payment']
                : ['Lot no', 'Come', 'Gone', 'Rate', 'Amount', 'Date', 'Payment']];
            } else {
              head = [['Lot no', 'Peice', 'Rate', 'Amount', 'Date', 'Payment']];
            }

            matchingRows.forEach(r => {
              const en = meta.entries[r.id] || {};
              const vals = getDeptRowValues(type, r, name, en);
              const pay = parseFloat(en.payment) || 0;
              totalPeice += vals.pcs;
              totalAmount += vals.amount;
              totalPayment += pay;
              const dStr = formatDateDMY(en.date || '');
              if (isStage) {
                body.push(isTanki
                  ? [r.lotNo, vals.come, vals.gone, r.fabrication?.name || '-', r.washing?.name || '-', Number(vals.rate || 0).toFixed(2), 'Rs ' + vals.amount.toFixed(0), dStr, pay ? 'Rs ' + pay.toFixed(0) : '']
                  : [r.lotNo, vals.come, vals.gone, Number(vals.rate || 0).toFixed(2), 'Rs ' + vals.amount.toFixed(0), dStr, pay ? 'Rs ' + pay.toFixed(0) : '']
                );
              } else {
                body.push([r.lotNo, vals.pcs, Number(vals.rate || 0).toFixed(2), 'Rs ' + vals.amount.toFixed(0), dStr, pay ? 'Rs ' + pay.toFixed(0) : '']);
              }
            });
            finalBalance = (totalAmount + lastBalance) - totalPayment;
          }

          doc.setFontSize(15);
          doc.setFont('helvetica', 'bold');
          doc.text(titleText, 36, 40);
          doc.setFontSize(9.5);
          doc.setFont('helvetica', 'normal');
          doc.text(`Date: ${dateText}   |   By: ${state.activeUser}`, 36, 56);

          doc.setFontSize(10);
          doc.setFont('helvetica', 'bold');
          doc.text(
            `Total Peice: ${totalPeice}   |   Kaam: Rs ${totalAmount.toFixed(0)}   |   Last Bal: Rs ${lastBalance.toFixed(0)}   |   Payment: Rs ${totalPayment.toFixed(0)}   |   Final Bal: Rs ${finalBalance.toFixed(0)}`,
            36,
            76
          );

          doc.autoTable({
            startY: 90,
            head,
            body,
            theme: 'grid',
            styles: { fontSize: 8.5, cellPadding: 4, overflow: 'linebreak' },
            headStyles: { fillColor: [15, 23, 42], textColor: 255, fontStyle: 'bold' },
            margin: { left: 32, right: 32 }
          });

          const blob = doc.output('blob');
          const fileName = (type + '_' + name + '_hisab.pdf').replace(/\s+/g, '_');
          const file = new File([blob], fileName, { type: 'application/pdf' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: name + ' Hisab PDF',
              text: name + ' Hisab Sheet (PDF)'
            });
            showToast('PDF shared successfully!');
          } else {
            doc.save(fileName);
            showToast('Full Hisab PDF downloaded! Share on WhatsApp.');
          }
        } catch (err) {
          showToast('Could not generate PDF');
        }
      }

      let lastBackupFileHandle = null;

      function getBackupPayloadString() {
        return JSON.stringify({
          app: 'LotProductionTracker',
          version: 2,
          exportedAt: new Date().toISOString(),
          exportedBy: state.activeUser,
          editPin: state.editPin,
          rows: state.rows,
          savedHisabs: state.savedHisabs,
          hisabMeta: state.hisabMeta
        }, null, 2);
      }

      function applyImportedData(parsed) {
        if (!parsed || !Array.isArray(parsed.rows)) {
          showToast('Invalid backup file');
          return false;
        }
        state.rows = parsed.rows.map(normalizeRowStages);
        state.savedHisabs = Array.isArray(parsed.savedHisabs) ? parsed.savedHisabs : [];
        state.hisabMeta = Object.assign({ master: {}, embroidery: {}, fabrication: {}, washing: {}, tanki: {}, packing: {}, laser: {}, print: {} }, parsed.hisabMeta || {});
        saveLocalState();
        renderTable();
        return true;
      }

      async function saveBackupToUserLocation(useLastHandle) {
        const payload = getBackupPayloadString();
        const fileName = 'lot_tracker_backup_' + todayISO() + '.json';

        if (window.showSaveFilePicker) {
          try {
            let handle = (useLastHandle && lastBackupFileHandle) ? lastBackupFileHandle : null;
            if (!handle) {
              handle = await window.showSaveFilePicker({
                suggestedName: fileName,
                types: [{ description: 'JSON Backup File', accept: { 'application/json': ['.json'] } }]
              });
              lastBackupFileHandle = handle;
            }
            const writable = await handle.createWritable();
            await writable.write(payload);
            await writable.close();
            showToast('Backup saved to selected location!');
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }

        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Backup downloaded to device storage!');
      }

      async function restoreBackupFromUserLocation() {
        if (window.showOpenFilePicker) {
          try {
            const [handle] = await window.showOpenFilePicker({
              multiple: false,
              types: [{ description: 'JSON Backup File', accept: { 'application/json': ['.json'] } }]
            });
            const file = await handle.getFile();
            const text = await file.text();
            const parsed = JSON.parse(text);
            if (applyImportedData(parsed)) {
              closeModal();
              showToast('Data restored from selected file!');
            }
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'file';
        hiddenInput.accept = '.json,application/json';
        hiddenInput.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              if (applyImportedData(parsed)) {
                closeModal();
                showToast('Data restored from selected file!');
              }
            } catch (err) {
              showToast('Invalid backup file');
            }
          };
          reader.readAsText(file);
        };
        hiddenInput.click();
      }

      function openBackupRestoreModal() {
        openModal(`
          <div class="p-4 sm:p-5">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-4">
              <div>
                <h3 class="text-base font-bold text-slate-900">Local Memory Backup &amp; Restore</h3>
                <p class="text-xs text-slate-500">Apni pasand ke folder / location me backup save ya restore karein</p>
              </div>
              <button type="button" data-close-modal class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold">✕</button>
            </div>
            <div class="space-y-3">
              <div class="p-3.5 rounded-xl bg-sky-50 border border-sky-200 space-y-2">
                <div class="text-sm font-bold text-slate-900">1. Backup to Selected Location</div>
                <p class="text-xs text-slate-600">Phone ya PC memory me apna folder chun kar JSON backup file save karein.</p>
                <div class="flex flex-wrap gap-2">
                  <button id="modalBackupSaveBtn" type="button" class="px-4 py-2 rounded-lg bg-sky-600 hover:bg-sky-700 text-white text-xs sm:text-sm font-bold shadow">
                    📁 Choose Location &amp; Save Backup
                  </button>
                  ${lastBackupFileHandle ? `<button id="modalBackupQuickBtn" type="button" class="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow">⚡ Save to Last File</button>` : ''}
                </div>
              </div>

              <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-200 space-y-2">
                <div class="text-sm font-bold text-slate-900">2. Restore from Selected Location</div>
                <p class="text-xs text-slate-600">Pehle se saved backup file ko phone memory se chun kar data wapas laayein.</p>
                <button id="modalRestoreBtn" type="button" class="px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs sm:text-sm font-bold shadow">
                  📂 Choose File &amp; Restore Data
                </button>
              </div>
            </div>
          </div>
        `);

        document.getElementById('modalBackupSaveBtn').addEventListener('click', () => saveBackupToUserLocation(false));
        const quickBtn = document.getElementById('modalBackupQuickBtn');
        if (quickBtn) quickBtn.addEventListener('click', () => saveBackupToUserLocation(true));
        document.getElementById('modalRestoreBtn').addEventListener('click', restoreBackupFromUserLocation);
      }

      function openSyncSettingsModal() {
        openModal(`
          <div class="p-4 sm:p-5">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-3">
              <div>
                <h3 class="text-base font-bold text-slate-900">Auto-Sync Settings (Shameem &amp; Saleem)</h3>
                <p class="text-xs text-slate-500">Dono Android phones ko sync karne ke liye Firebase Realtime DB URL daalein</p>
              </div>
              <button type="button" data-close-modal class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold">✕</button>
            </div>
            <form id="syncForm" class="space-y-3">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Firebase Realtime Database URL</label>
                <input name="firebaseUrl" type="url" value="${escapeHtml(state.syncConfig.firebaseUrl)}" placeholder="https://your-app-default-rtdb.firebaseio.com" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Factory Sync Code (Same on both phones)</label>
                <input name="roomCode" type="text" value="${escapeHtml(state.syncConfig.roomCode)}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500" />
              </div>
              <div class="p-3 rounded-xl border border-amber-500/40 bg-amber-950/20 space-y-2">
                <div class="text-xs font-bold text-amber-300">🔐 Change Edit Unlock PIN</div>
                <div class="grid grid-cols-2 gap-2">
                  <input id="oldPinInput" type="password" inputmode="numeric" maxlength="6" placeholder="Old PIN" class="border rounded-lg px-2.5 py-1.5 text-xs" />
                  <input id="newPinInput" type="password" inputmode="numeric" maxlength="6" placeholder="New PIN" class="border rounded-lg px-2.5 py-1.5 text-xs" />
                </div>
                <div class="flex items-center justify-between">
                  <span id="pinChangeMsg" class="text-[11px] text-zinc-400">Default PIN: 4311</span>
                  <button type="button" id="changePinBtn" class="px-3 py-1 rounded-lg bg-amber-500 hover:bg-amber-400 text-zinc-950 text-xs font-bold">Update PIN</button>
                </div>
              </div>
              <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-200">
                <button type="button" id="exportJsonBtn" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700">⬇ Export Backup</button>
                <label class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 cursor-pointer">
                  ⬆ Import Backup
                  <input id="importJsonInput" type="file" accept=".json" class="hidden" />
                </label>
                <button type="submit" class="ml-auto px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow">Save &amp; Sync</button>
              </div>
            </form>
          </div>
        `);

        document.getElementById('syncForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          state.syncConfig.firebaseUrl = (fd.get('firebaseUrl') || '').trim();
          state.syncConfig.roomCode = (fd.get('roomCode') || 'shameem-saleem-factory').trim();
          saveLocalState();
          startSyncPolling();
          closeModal();
          showToast('Sync settings saved');
        });

        document.getElementById('changePinBtn').addEventListener('click', () => {
          const oldVal = (document.getElementById('oldPinInput').value || '').trim();
          const newVal = (document.getElementById('newPinInput').value || '').trim();
          const msgEl = document.getElementById('pinChangeMsg');
          if (oldVal !== (state.editPin || DEFAULT_EDIT_PIN)) {
            msgEl.textContent = 'Purana PIN galat hai!';
            msgEl.className = 'text-[11px] text-rose-400 font-semibold';
            return;
          }
          if (newVal.length < 4) {
            msgEl.textContent = 'Naya PIN kam se kam 4 digits ka rakhein';
            msgEl.className = 'text-[11px] text-rose-400 font-semibold';
            return;
          }
          state.editPin = newVal;
          saveLocalState();
          document.getElementById('oldPinInput').value = '';
          document.getElementById('newPinInput').value = '';
          msgEl.textContent = 'PIN successfully updated!';
          msgEl.className = 'text-[11px] text-emerald-400 font-semibold';
          showToast('Edit PIN updated!');
        });

        document.getElementById('exportJsonBtn').addEventListener('click', () => {
          const blob = new Blob([JSON.stringify({ rows: state.rows, hisabMeta: state.hisabMeta }, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'lot_tracker_backup_' + todayISO() + '.json';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('Backup exported');
        });

        document.getElementById('importJsonInput').addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              if (parsed && Array.isArray(parsed.rows)) {
                state.rows = parsed.rows;
                state.hisabMeta = parsed.hisabMeta || state.hisabMeta;
                saveLocalState();
                renderTable();
                closeModal();
                showToast('Backup imported!');
              }
            } catch (err) {
              showToast('Invalid backup file');
            }
          };
          reader.readAsText(file);
        });
      }

      document.addEventListener('click', (e) => {
        if (e.target.closest('[data-close-modal]') || e.target.id === 'modalBackdrop') {
          closeModal();
          return;
        }
        const statusToggle = e.target.closest('[data-toggle-stage-status]');
        if (statusToggle) {
          e.stopPropagation();
          if (appMode === 'view') {
            showToast('View Mode me edit nahi kar sakte');
            return;
          }
          const rId = statusToggle.getAttribute('data-toggle-stage-status');
          const dept = statusToggle.getAttribute('data-stage-dept');
          const row = getRow(rId);
          if (row && row[dept]) {
            row[dept].status = row[dept].status === 'Clear' ? 'Pending' : 'Clear';
            row.updatedBy = state.activeUser;
            row.updatedAt = Date.now();
            saveLocalState();
            renderTable();
            showToast('Lot ' + row.lotNo + ' ' + dept + ': ' + row[dept].status);
          }
          return;
        }
        const cell = e.target.closest('.cell-trigger');
        if (cell) {
          const rowId = cell.getAttribute('data-row-id');
          const cellType = cell.getAttribute('data-cell');
          if (cellType === 'peice') openPeiceModal(rowId);
          else if (cellType === 'master') openMasterCellModal(rowId);
          else if (['fabrication', 'tanki', 'washing', 'packing'].includes(cellType)) openStageModal(rowId, cellType);
          else openJobModal(rowId, cellType);
        }
      });

      document.getElementById('lotTableBody').addEventListener('input', (e) => {
        if (appMode === 'view') return;
        const lotId = e.target.getAttribute('data-lot-input');
        if (lotId) {
          const row = getRow(lotId);
          if (row) {
            row.lotNo = e.target.value;
            row.updatedBy = state.activeUser;
            row.updatedAt = Date.now();
            saveLocalState();
          }
          return;
        }
        const inlineField = e.target.getAttribute('data-inline-field');
        if (inlineField) {
          const rowId = e.target.getAttribute('data-row-id');
          const row = getRow(rowId);
          if (row) {
            row[inlineField] = e.target.value;
            row.updatedBy = state.activeUser;
            row.updatedAt = Date.now();
            saveLocalState();
          }
        }
      });

      document.getElementById('appModeToggleBtn').addEventListener('click', () => {
        appMode = appMode === 'edit' ? 'view' : 'edit';
        const btn = document.getElementById('appModeToggleBtn');
        if (appMode === 'view') {
          document.body.classList.add('view-mode-active');
          btn.textContent = '👁️ View Mode';
          btn.className = 'inline-flex items-center gap-1 bg-sky-600 hover:bg-sky-700 border border-sky-500 px-2.5 py-0.5 rounded-full text-xs font-bold text-white transition';
          showToast('View Mode ON (Read Only)');
        } else {
          document.body.classList.remove('view-mode-active');
          btn.textContent = '✏️ Edit Mode';
          btn.className = 'inline-flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 border border-emerald-500 px-2.5 py-0.5 rounded-full text-xs font-bold text-white transition';
          showToast('Edit Mode ON');
        }
        renderTable();
      });
      document.getElementById('addRowBtn').addEventListener('click', addNewRow);
      document.querySelectorAll('[data-hisab-dept]').forEach(btn => {
        btn.addEventListener('click', () => openDeptListModal(btn.getAttribute('data-hisab-dept')));
      });
      document.getElementById('userSwitchBtn').addEventListener('click', openUserSwitchModal);
      document.getElementById('syncSettingsBtn').addEventListener('click', openSyncSettingsModal);
      document.getElementById('backupRestoreBtn').addEventListener('click', openBackupRestoreModal);

      document.getElementById('hisabBackBtn').addEventListener('click', () => {
        document.getElementById('hisabOverlay').classList.add('hidden');
        document.getElementById('hisabOverlay').classList.remove('flex');
      });
      document.getElementById('hisabSaveBtn').addEventListener('click', saveCurrentHisab);
      document.getElementById('pendingLotsBtn').addEventListener('click', openPendingLotsModal);
      document.getElementById('savedHisabBtn').addEventListener('click', openSavedHisabListModal);
      document.getElementById('hisabPrintBtn').addEventListener('click', () => window.print());
      document.getElementById('hisabShareBtn').addEventListener('click', shareHisabAsPdf);

      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      searchInput.addEventListener('input', () => {
        currentSearch = searchInput.value;
        clearSearchBtn.classList.toggle('hidden', !currentSearch);
        renderTable();
      });
      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        currentSearch = '';
        clearSearchBtn.classList.add('hidden');
        renderTable();
      });

      loadLocalState();
      document.getElementById('activeUserName').textContent = state.activeUser;
      renderTable();
      startSyncPolling();
    })();
  </script>
</body>
</html>
