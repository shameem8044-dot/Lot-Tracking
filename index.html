                  <button type="button" data-close-modal class="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold">Close</button>
                  ${!isLocked ? '<button type="submit" class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow">Save</button>' : ''}
                </div>
              </div>
            </form>
          </div>
        `);

        const unlockJobBtn = document.getElementById('jobUnlockPinBtn');
        if (unlockJobBtn) {
          unlockJobBtn.addEventListener('click', () => {
            const box = document.getElementById('jobPinBox');
            if (box) box.classList.remove('hidden');
            const inp = document.getElementById('jobPinInput');
            if (inp) inp.focus();
          });
          document.getElementById('jobPinSubmitBtn').addEventListener('click', () => {
            const val = (document.getElementById('jobPinInput').value || '').trim();
            if (val === (state.editPin || DEFAULT_EDIT_PIN)) {
              openJobModal(rowId, cellType, true);
              showToast('Fields unlocked! Paid status unchanged.');
            } else {
              document.getElementById('jobPinErr').classList.remove('hidden');
            }
          });
        }

        const form = document.getElementById('jobForm');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          if (isLocked) return;
          const fd = new FormData(form);
          data.date = fd.get('date') || '';
          data.peice = fd.get('peice') || '';
          if (isWashing) data.washingType = (fd.get('washingType') || '').trim();
          if (hasRate) data.rate = fd.get('rate') || '';
          data.name = (fd.get('name') || '').trim();
          row.updatedBy = state.activeUser;
          row.updatedAt = Date.now();
          saveLocalState();
          renderTable();
          closeModal();
          showToast(titles[cellType] + ' saved');
        });

        document.getElementById('jobPaidBtn').addEventListener('click', () => {
          if (appMode === 'view') return;
          if (data.paid) {
            if (!unlocked) {
              const box = document.getElementById('jobPinBox');
              if (box) box.classList.remove('hidden');
              const inp = document.getElementById('jobPinInput');
              if (inp) inp.focus();
              return;
            }
            data.paid = false;
            data.paidLight = false;
            row.updatedBy = state.activeUser;
            row.updatedAt = Date.now();
            saveLocalState();
            renderTable();
            openJobModal(rowId, cellType, true);
            showToast(titles[cellType] + ' marked Unpaid');
            return;
          }
          const fd = new FormData(form);
          data.date = fd.get('date') || data.date;
          data.peice = fd.get('peice') || data.peice;
          if (isWashing) data.washingType = (fd.get('washingType') || data.washingType || '').trim();
          if (hasRate) data.rate = fd.get('rate') || data.rate;
          data.name = (fd.get('name') || data.name || '').trim();
          data.paid = true;
          row.updatedBy = state.activeUser;
          row.updatedAt = Date.now();
          saveLocalState();
          renderTable();
          closeModal();
          showToast(titles[cellType] + ' marked Paid');
        });
      }

      function openStageModal(rowId, dept, isUnlocked) {
        const row = getRow(rowId);
        if (!row) return;
        normalizeRowStages(row);
        const data = row[dept];
        const titles = {
          fabrication: 'Fabrication',
          tanki: 'Tanki',
          washing: 'Washing',
          packing: 'Packing'
        };
        const isWashing = dept === 'washing';
        const isPacking = dept === 'packing';
        const rc = getRoleConfig();
        const isOwnStageUser = !rc.isAdmin && rc.category.toLowerCase() === dept;
        const isWorkerBlocked = !rc.isAdmin && !isOwnStageUser;
        const isFinalSubmitted = !rc.isAdmin && !!data.finalSubmitted;
        const paid = !!data.paid;
        const unlocked = !!isUnlocked;
        const isLocked = (paid && !unlocked) || appMode === 'view' || isWorkerBlocked || isFinalSubmitted;
        const isFabWorker = isOwnStageUser && dept === 'fabrication';
        const isPackWorker = isOwnStageUser && dept === 'packing';
        const ro = isLocked ? 'readonly disabled' : '';
        const roClass = isLocked ? 'bg-slate-100 text-slate-500 cursor-not-allowed' : 'bg-white';
        const roMeta = (isLocked || isFabWorker || isPackWorker) ? 'readonly disabled' : '';
        const roMetaClass = (isLocked || isFabWorker || isPackWorker) ? 'bg-slate-100 text-slate-500 cursor-not-allowed' : 'bg-white';

        function renderStageModalBody() {
          const comeList = getStageComeEntries(row, dept);
          const comeTotal = comeList.reduce((s, x) => s + (parseFloat(x.peice) || 0), 0);
          const goneTotal = (data.goneEntries || []).reduce((s, x) => s + (parseFloat(x.peice) || 0), 0);
          const balance = comeTotal - goneTotal;

          const comeRowsHtml = comeList.length
            ? comeList.map(c => `
                <div class="flex items-center justify-between text-xs py-1 border-b border-slate-200 last:border-b-0">
                  <span class="text-slate-600">${escapeHtml(formatDateDMY(c.date) || '-')}</span>
                  <span class="font-bold text-slate-900">${escapeHtml(c.peice || '0')} pcs</span>
                </div>`).join('')
            : '<div class="text-xs text-slate-400 py-2 text-center">Abhi koi Come entry nahi</div>';

          const goneRowsHtml = (data.goneEntries || []).map((g, idx) => `
            <div class="flex flex-wrap items-center gap-1.5 py-1.5 border-b border-slate-200 last:border-b-0">
              <input type="date" ${ro} data-gone-field="date" data-gone-idx="${idx}" value="${escapeHtml(g.date || '')}" class="flex-1 min-w-[115px] border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />
              <input type="number" inputmode="numeric" ${ro} data-gone-field="peice" data-gone-idx="${idx}" value="${escapeHtml(g.peice || '')}" placeholder="Piece" class="w-20 border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />
              ${isPacking ? `<input type="text" ${ro} data-gone-field="ripit" data-gone-idx="${idx}" value="${escapeHtml(g.ripit || '')}" placeholder="Ripit" class="w-20 border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />` : ''}
              ${(!isLocked && data.goneEntries.length > 1) ? `<button type="button" data-remove-gone="${idx}" class="text-rose-500 hover:text-rose-700 font-bold text-xs px-1.5 py-1" title="Remove">✕</button>` : ''}
            </div>
          `).join('');

          openModal(`
            <div class="p-4 sm:p-5">
              <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-3">
                <div>
                  <h3 class="text-base font-bold text-slate-900">${titles[dept]} — Lot ${escapeHtml(row.lotNo)}</h3>
                  ${paid ? `<div class="flex flex-wrap items-center gap-2 mt-1">
                    <span class="inline-block px-2 py-0.5 bg-green-500 text-white text-[11px] font-bold rounded-full">${unlocked ? '✓ PAID (UNLOCKED)' : '✓ PAID / READ ONLY'}</span>
                    ${(appMode !== 'view' && !unlocked) ? '<button id="stageUnlockPinBtn" type="button" class="px-2.5 py-0.5 rounded-full bg-amber-500 hover:bg-amber-400 text-zinc-950 text-[11px] font-bold">🔓 Edit with PIN</button>' : ''}
                  </div>` : ''}
                </div>
                <button type="button" data-close-modal class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold">✕</button>
              </div>

              ${(paid && appMode !== 'view') ? `
              <div id="stagePinBox" class="hidden mb-3 p-3 rounded-xl border border-amber-500/50 bg-amber-950/30 space-y-2">
                <div class="text-xs font-bold text-amber-300">Read-Only Entry Edit karne ke liye PIN daalein:</div>
                <div class="flex gap-2">
                  <input id="stagePinInput" type="password" inputmode="numeric" maxlength="6" placeholder="Enter PIN" class="flex-1 border rounded-lg px-3 py-1.5 text-sm" />
                  <button id="stagePinSubmitBtn" type="button" class="px-4 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold text-xs">Unlock</button>
                </div>
                <div id="stagePinErr" class="hidden text-xs text-rose-400 font-semibold">Galat PIN!</div>
              </div>` : ''}

              <!-- Name, Rate & Washing Type -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Name</label>
                  <input id="stageNameInput" list="dl_stage_${dept}" type="text" ${roMeta} value="${escapeHtml(data.name || '')}" placeholder="${titles[dept]} Party / Karigar" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm ${roMetaClass}" />
                  ${buildDatalistHtml('dl_stage_' + dept, dept)}
                </div>
                <div>
                  <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs font-semibold text-slate-700">Rate (₹)</label>
                    ${isFabWorker ? '<button id="stageReqRateBtn" type="button" class="text-[10px] font-bold text-amber-400 hover:underline">📩 Request Rate Edit</button>' : ''}
                  </div>
                  <input id="stageRateInput" type="number" step="0.01" inputmode="decimal" ${roMeta} value="${escapeHtml(data.rate || '')}" placeholder="Rate per piece" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm ${roMetaClass}" />
                </div>
                ${dept === 'tanki' ? `
                <div class="sm:col-span-2">
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Send To (Washing)</label>
                  <input id="stageSendToWashingInput" list="dl_send_washing" type="text" ${ro} value="${escapeHtml(row.washing?.name || '')}" placeholder="Washing party ka naam (auto Washing column me jayega)" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm ${roClass}" />
                  ${buildDatalistHtml('dl_send_washing', 'washing')}
                </div>` : ''}
                ${isWashing ? `
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Washing Type</label>
                  <input id="stageWashingTypeInput" type="text" ${ro} value="${escapeHtml(data.washingType || '')}" placeholder="e.g. Double Dye / Enzyme" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm ${roClass}" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Send To (Packing)</label>
                  <input id="stageSendToPackingInput" list="dl_send_packing" type="text" ${ro} value="${escapeHtml(row.packing?.name || '')}" placeholder="Packing party ka naam" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm ${roClass}" />
                  ${buildDatalistHtml('dl_send_packing', 'packing')}
                </div>` : ''}
              </div>

              <!-- Summary Strip: Come - Gone (Balance) -->
              <div class="grid grid-cols-3 gap-2 mb-3 text-center">
                <div class="p-2 rounded-lg bg-sky-50 border border-sky-200">
                  <div class="text-[10px] font-semibold text-sky-700 uppercase">Come</div>
                  <div class="text-base font-extrabold text-sky-900">${comeTotal}</div>
                </div>
                <div class="p-2 rounded-lg bg-emerald-50 border border-emerald-200">
                  <div class="text-[10px] font-semibold text-emerald-700 uppercase">Gone</div>
                  <div id="stageGoneTotalBox" class="text-base font-extrabold text-emerald-900">${goneTotal}</div>
                </div>
                <div class="p-2 rounded-lg bg-amber-50 border border-amber-200">
                  <div class="text-[10px] font-semibold text-amber-800 uppercase">Balance</div>
                  <div id="stageBalanceBox" class="text-base font-extrabold text-amber-900">${balance}</div>
                </div>
              </div>

              <!-- Come & Gone Table -->
              <div class="border border-slate-200 rounded-xl overflow-hidden mb-3">
                <div class="grid grid-cols-1 sm:grid-cols-12 bg-slate-800 text-white text-xs font-bold">
                  <div class="sm:col-span-4 px-3 py-2 border-b sm:border-b-0 sm:border-r border-slate-700">Come (Date &amp; Peice)</div>
                  <div class="sm:col-span-8 px-3 py-2 flex items-center justify-between">
                    <span>Gone (Date &amp; Peice)</span>
                    ${!isLocked ? `<button id="addGoneRowBtn" type="button" class="px-2 py-0.5 rounded bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-[11px] font-bold">+ Add Gone</button>` : ''}
                  </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-12">
                  <div class="sm:col-span-4 p-2.5 bg-slate-50 border-b sm:border-b-0 sm:border-r border-slate-200">
                    ${comeRowsHtml}
                  </div>
                  <div class="sm:col-span-8 p-2.5 bg-white">
                    ${goneRowsHtml}
                  </div>
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="pt-2 flex flex-wrap items-center justify-between gap-2 border-t border-slate-200">
                <button id="stagePaidBtn" type="button" ${(!rc.isAdmin || appMode === 'view') ? 'disabled' : ''} class="${!rc.isAdmin ? 'hidden' : ''} px-4 py-2 rounded-lg font-bold text-xs sm:text-sm shadow transition ${paid ? 'bg-green-600 hover:bg-green-500 text-white' : (appMode === 'view' ? 'hidden' : 'bg-rose-600 hover:bg-rose-500 text-white')}">
                  ${paid ? '✓ Paid' : 'Unpaid'}
                </button>
                <div class="flex flex-wrap gap-2 ml-auto">
                  <button type="button" data-close-modal class="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold">Close</button>
                  ${!isLocked ? '<button id="stageSaveBtn" type="button" class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow">Save</button>' : ''}
                  ${(isOwnStageUser && !isLocked && ['fabrication', 'tanki', 'washing', 'packing'].includes(dept)) ? '<button id="stageFinalSubmitBtn" type="button" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-extrabold shadow">✓ Final Submit</button>' : ''}
                </div>
              </div>
            </div>
          `);

          function syncInputsToData() {
            if (isLocked) return;
            const nameEl = document.getElementById('stageNameInput');
            const rateEl = document.getElementById('stageRateInput');
            const washEl = document.getElementById('stageWashingTypeInput');
            const sendWashEl = document.getElementById('stageSendToWashingInput');
            const sendPackEl = document.getElementById('stageSendToPackingInput');
            if (nameEl) data.name = nameEl.value.trim();
            if (rateEl) data.rate = rateEl.value;
            if (washEl) data.washingType = washEl.value.trim();
            if (sendWashEl) row.washing.name = sendWashEl.value.trim();
            if (sendPackEl) row.packing.name = sendPackEl.value.trim();

            document.querySelectorAll('[data-gone-field]').forEach(inp => {
              const idx = parseInt(inp.getAttribute('data-gone-idx'), 10);
              const field = inp.getAttribute('data-gone-field');
              if (data.goneEntries[idx]) data.goneEntries[idx][field] = inp.value;
            });

            const newGone = (data.goneEntries || []).reduce((s, x) => s + (parseFloat(x.peice) || 0), 0);
            const gBox = document.getElementById('stageGoneTotalBox');
            const bBox = document.getElementById('stageBalanceBox');
            if (gBox) gBox.textContent = newGone;
            if (bBox) bBox.textContent = comeTotal - newGone;
          }

          ['stageNameInput', 'stageRateInput', 'stageWashingTypeInput', 'stageSendToWashingInput', 'stageSendToPackingInput'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', syncInputsToData);
          });
          document.querySelectorAll('[data-gone-field]').forEach(inp => {
            inp.addEventListener('input', syncInputsToData);
          });

          const addBtn = document.getElementById('addGoneRowBtn');
          if (addBtn) {
            addBtn.addEventListener('click', () => {
              syncInputsToData();
              data.goneEntries.push(isPacking ? { date: todayISO(), peice: '', ripit: '' } : { date: todayISO(), peice: '' });
              renderStageModalBody();
            });
          }

          document.querySelectorAll('[data-remove-gone]').forEach(btn => {
            btn.addEventListener('click', () => {
              syncInputsToData();
              const idx = parseInt(btn.getAttribute('data-remove-gone'), 10);
              data.goneEntries.splice(idx, 1);
              renderStageModalBody();
            });
          });

          const unlockStageBtn = document.getElementById('stageUnlockPinBtn');
          if (unlockStageBtn) {
            unlockStageBtn.addEventListener('click', () => {
              const box = document.getElementById('stagePinBox');
              if (box) box.classList.remove('hidden');
              const inp = document.getElementById('stagePinInput');
              if (inp) inp.focus();
            });
            document.getElementById('stagePinSubmitBtn').addEventListener('click', () => {
              const val = (document.getElementById('stagePinInput').value || '').trim();
              if (val === (state.editPin || DEFAULT_EDIT_PIN)) {
                openStageModal(rowId, dept, true);
                showToast('Fields unlocked! Paid status unchanged.');
              } else {
                document.getElementById('stagePinErr').classList.remove('hidden');
              }
            });
          }

          const reqRateBtn = document.getElementById('stageReqRateBtn');
          if (reqRateBtn) {
            reqRateBtn.addEventListener('click', () => {
              openRateRequestModal(row.id, 'fabrication', data.rate || '');
            });
          }

          const stageFinalBtn = document.getElementById('stageFinalSubmitBtn');
          if (stageFinalBtn) {
            stageFinalBtn.addEventListener('click', () => {
              syncInputsToData();
              data.finalSubmitted = true;
              row.updatedBy = state.activeUser;
              row.updatedAt = Date.now();
              const stTotals = getStageTotals(row, dept);
              const commonDetails = `Lot: ${row.lotNo || '-'} | Piece: ${row.peice || '-'} (Come: ${stTotals.come || 0}, Gone/Jama: ${stTotals.gone || 0}) | Size: ${row.size || '-'} | Fabric: ${row.fabric || '-'} | Fabrication: ${row.fabrication?.name || '-'} | Tanki: ${row.tanki?.name || '-'} | Washing: ${row.washing?.name || '-'}${row.washing?.washingType ? ' (' + row.washing.washingType + ')' : ''}${row.packing?.name ? ' | Packing: ' + row.packing.name : ''}`;
              if (dept === 'fabrication') {
                addNotification({
                  targetRole: 'tanki',
                  targetName: row.tanki?.name || '',
                  type: 'fab_submit',
                  title: 'Fabrication Final Submit — Lot ' + (row.lotNo || '-'),
                  message: `${commonDetails}. Approve karne par Fabrication Clear hokar aapke naam aa jayegi.`,
                  rowId: row.id,
                  lotNo: row.lotNo,
                  dept: 'fabrication',
                  fromUser: rc.userName
                });
                showToast('Final Submit ho gaya! Tanki user ko approval request bhej di gayi.');
              } else {
                addNotification({
                  targetRole: 'admin',
                  type: dept + '_submit',
                  title: titles[dept] + ' Final Submit — Lot ' + (row.lotNo || '-'),
                  message: `${commonDetails}. Approve karne par ${titles[dept]} status Clear ho jayega.`,
                  rowId: row.id,
                  lotNo: row.lotNo,
                  dept: dept,
                  fromUser: rc.userName
                });
                showToast('Final Submit ho gaya! Admin ko notification bhej di gayi.');
              }
              saveLocalState();
              renderTable();
              closeModal();
            });
          }

          const saveBtn = document.getElementById('stageSaveBtn');
          if (saveBtn) {
            saveBtn.addEventListener('click', () => {
              syncInputsToData();
              if (dept === 'packing') applyJamaAutoClear(row);
              row.updatedBy = state.activeUser;
              row.updatedAt = Date.now();
              saveLocalState();
              renderTable();
              closeModal();
              showToast(titles[dept] + ' saved');
            });
          }

          document.getElementById('stagePaidBtn').addEventListener('click', () => {
            if (appMode === 'view') return;
            if (data.paid) {
              if (!unlocked) {
                const box = document.getElementById('stagePinBox');
                if (box) box.classList.remove('hidden');
                const inp = document.getElementById('stagePinInput');
                if (inp) inp.focus();
                return;
              }
              syncInputsToData();
              data.paid = false;
              data.paidLight = false;
              row.updatedBy = state.activeUser;
              row.updatedAt = Date.now();
              saveLocalState();
              renderTable();
              openStageModal(rowId, dept, true);
              showToast(titles[dept] + ' marked Unpaid');
              return;
            }
            syncInputsToData();
            if (dept === 'packing') applyJamaAutoClear(row);
            data.paid = true;
            row.updatedBy = state.activeUser;
            row.updatedAt = Date.now();
            saveLocalState();
            renderTable();
            closeModal();
            showToast(titles[dept] + ' marked Paid');
          });
        }

        renderStageModalBody();
      }

      function openPackingModal(rowId) {
        const row = getRow(rowId);
        if (!row) return;
        const paid = row.packing.paid;
        const ro = paid ? 'readonly disabled' : '';
        const roClass = paid ? 'bg-slate-100 text-slate-500 cursor-not-allowed' : 'bg-white';

        const linesHtml = row.packing.lines.map((line, i) => `
          <div class="p-2.5 rounded-xl border border-slate-200 bg-slate-50/70 space-y-2">

            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">

                <label class="block text-[10px] font-semibold text-slate-600">Date</label>

              <div>
                <label class="block text-[10px] font-semibold text-slate-600">Piece</label>
                <input name="peice_${i}" type="number" inputmode="numeric" ${ro} value="${escapeHtml(line.peice)}" placeholder="0" class="w-full border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />

              <div>
                <label class="block text-[10px] font-semibold text-slate-600">Rate</label>
                <input name="rate_${i}" type="number" step="0.01" inputmode="decimal" ${ro} value="${escapeHtml(line.rate)}" placeholder="0" class="w-full border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />
              </div>
              <div>
                <label class="block text-[10px] font-semibold text-slate-600">Ripit</label>
                <input name="ripit_${i}" type="text" ${ro} value="${escapeHtml(line.ripit)}" placeholder="Ripit" class="w-full border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />
              </div>
              <div class="col-span-2 sm:col-span-1">
                <label class="block text-[10px] font-semibold text-slate-600">Name</label>
                <input name="name_${i}" type="text" ${ro} value="${escapeHtml(line.name)}" placeholder="Name" class="w-full border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />

            </div>
          </div>
        `).join('');

        openModal(`
          <div class="p-4 sm:p-5">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-3">
              <div>
                <h3 class="text-base font-bold text-slate-900">Packing (4 Lines) — Lot ${escapeHtml(row.lotNo)}</h3>
                <p class="text-xs text-slate-500">Total Packing Piece auto Jama column me jayega</p>
              </div>
              <button type="button" data-close-modal class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold">✕</button>
            </div>
            <form id="packingForm" class="space-y-2.5">
              ${linesHtml}
              <div class="pt-3 flex flex-wrap items-center justify-between gap-2 border-t border-slate-200">
                <button id="packingPaidBtn" type="button" ${paid ? 'disabled' : ''} class="px-4 py-2 rounded-lg font-bold text-xs sm:text-sm shadow transition ${paid ? 'bg-green-600 text-white opacity-80 cursor-not-allowed' : 'bg-emerald-500 hover:bg-emerald-600 text-slate-950'}">
                  ${paid ? '✓ Payment Done' : 'Payment Done'}
                </button>
                <div class="flex gap-2">
                  <button type="button" data-close-modal class="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold">Close</button>
                  ${!paid ? '<button type="submit" class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow">Save Packing</button>' : ''}
                </div>
              </div>
            </form>
          </div>
        `);

        function readLines(formEl) {
          const fd = new FormData(formEl);
          for (let i = 0; i < 4; i++) {
            row.packing.lines[i] = {
              date: fd.get('date_' + i) || '',
              peice: fd.get('peice_' + i) || '',
              rate: fd.get('rate_' + i) || '',
              ripit: (fd.get('ripit_' + i) || '').trim(),
              name: (fd.get('name_' + i) || '').trim()
            };
          }
        }

        const form = document.getElementById('packingForm');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          if (row.packing.paid) return;
          readLines(form);
          row.updatedBy = state.activeUser;
          row.updatedAt = Date.now();
          saveLocalState();
          renderTable();
          closeModal();
          showToast('Packing saved (Jama: ' + getPackingTotalPeice(row) + ')');
        });

        document.getElementById('packingPaidBtn').addEventListener('click', () => {
          if (row.packing.paid) return;
          readLines(form);
          row.packing.paid = true;
          row.updatedBy = state.activeUser;
          row.updatedAt = Date.now();
          saveLocalState();
          renderTable();
          closeModal();
          showToast('Packing Payment Done');
        });
      }

      const DEPT_CONFIG = {
        master: { label: 'Master', hasTableRate: false },
        embroidery: { label: 'Embroidery', hasTableRate: true },
        fabrication: { label: 'Fabrication', hasTableRate: true },
        washing: { label: 'Washing', hasTableRate: true },
        tanki: { label: 'Tanki', hasTableRate: true },
        packing: { label: 'Packing', hasTableRate: true },
        laser: { label: 'Laser', hasTableRate: false },
        print: { label: 'Print', hasTableRate: false }
      };

      function getUnpaidDeptNames(dept) {
        const counts = {};
        state.rows.forEach(r => {
          if (dept === 'master') {
            if (!r.masterPaid && (r.masterName || '').trim()) {
              const n = r.masterName.trim();
              counts[n] = (counts[n] || 0) + 1;
            }
          } else {
            const d = r[dept];
            const needsClear = ['fabrication', 'washing', 'packing'].includes(dept);
            if (d && !d.paid && (!needsClear || d.status === 'Clear') && (d.name || '').trim()) {
              const n = d.name.trim();
              counts[n] = (counts[n] || 0) + 1;
            }
          }
        });
        return Object.keys(counts).sort().map(n => ({ name: n, count: counts[n] }));
      }

      function getUnpaidDeptRows(dept, name) {
        if (dept === 'master') {
          return state.rows.filter(r => !r.masterPaid && (r.masterName || '').trim() === name);
        }

        const needsClear = ['fabrication', 'washing', 'packing'].includes(dept);
        return state.rows.filter(r => r[dept] && !r[dept].paid && (!needsClear || r[dept].status === 'Clear') && (r[dept].name || '').trim() === name);
      }

      function getDeptRowValues(dept, r, name, entry) {
        if (dept === 'master') {
          const pcs = parseFloat(r.peice) || 0;
          const rate = parseFloat(entry.rate) || 0;
          return { pcs, rate, amount: pcs * rate, date: entry.date || r.date || '', rateReadonly: false };
        }
        if (['fabrication', 'tanki', 'washing', 'packing'].includes(dept)) {
          const d = r[dept] || {};
          const st = getStageTotals(r, dept);
          const come = st.come;
          const gone = st.gone;
          const rate = parseFloat(d.rate || entry.rate) || 0;
          const firstGoneDate = (st.goneList[0] && st.goneList[0].date) ? st.goneList[0].date : '';
          return { pcs: come, come, gone, rate, amount: come * rate, date: entry.date || firstGoneDate || r.date || '', rateReadonly: true };
        }
        const d = r[dept] || {};
        const pcs = parseFloat(d.peice) || 0;
        const hasTableRate = DEPT_CONFIG[dept].hasTableRate;
        const rate = parseFloat(hasTableRate ? (d.rate || entry.rate) : entry.rate) || 0;
        return { pcs, come: pcs, gone: pcs, rate, amount: pcs * rate, date: entry.date || d.date || r.date || '', rateReadonly: hasTableRate };
      }

      function openDeptListModal(dept) {
        const cfg = DEPT_CONFIG[dept];
        if (!cfg) return;
        const items = getUnpaidDeptNames(dept);

        openModal(`
          <div class="p-4 sm:p-5">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-3">
              <div>
                <h3 class="text-base font-bold text-slate-900">Select ${cfg.label} (Unpaid Lots Only)</h3>
                <p class="text-xs text-slate-500">Sirf unpaid status wali lots hi hisab me judengi</p>
              </div>
              <button type="button" data-close-modal class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold">✕</button>
            </div>
            ${items.length ? `
              <div class="space-y-2">
                ${items.map(it => `
                  <button type="button" data-select-hisab-name="${escapeHtml(it.name)}" class="w-full flex items-center justify-between px-4 py-3 rounded-xl bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 text-left transition">
                    <span class="font-bold text-slate-900">${escapeHtml(it.name)}</span>
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800">${it.count} Unpaid Lots</span>
                  </button>
                `).join('')}
              </div>
            ` : `<p class="text-sm text-slate-500 py-6 text-center">Koi unpaid ${cfg.label} entry nahi mili.</p>`}
          </div>
        `);

        document.querySelectorAll('[data-select-hisab-name]').forEach(btn => {
          btn.addEventListener('click', () => {
            const name = btn.getAttribute('data-select-hisab-name');
            closeModal();
            openHisabOverlay(dept, name);
          });
        });
      }

      let currentHisab = { type: null, name: '' };

      function getHisabSortedRows(rows, type, name, sortBy) {
        const list = rows.slice();
        const meta = state.hisabMeta[type]?.[name] || { entries: {} };
        list.sort((a, b) => {
          if (sortBy === 'rate_asc' || sortBy === 'rate_desc') {
            const ra = getDeptRowValues(type, a, name, meta.entries?.[a.id] || {}).rate || 0;
            const rb = getDeptRowValues(type, b, name, meta.entries?.[b.id] || {}).rate || 0;
            if (ra !== rb) return sortBy === 'rate_asc' ? (ra - rb) : (rb - ra);
          } else if (sortBy === 'washing') {
            const wa = (type === 'washing' ? (a.washing?.washingType || '') : (a.washing?.name || a.washing?.washingType || '')).trim().toLowerCase();
            const wb = (type === 'washing' ? (b.washing?.washingType || '') : (b.washing?.name || b.washing?.washingType || '')).trim().toLowerCase();
            if (wa !== wb) return wa.localeCompare(wb);
          }
          const ka = parseLotSortKey(a.lotNo);
          const kb = parseLotSortKey(b.lotNo);
          if (ka.suf !== kb.suf) return ka.suf.localeCompare(kb.suf);
          return ka.num - kb.num;
        });
        return list;
      }

      function openHisabOverlay(type, name) {
        const rc = getRoleConfig();
        currentHisab = { type, name, isSavedView: false, sortBy: 'lot', readOnlyUser: !rc.isAdmin };
        const overlay = document.getElementById('hisabOverlay');
        const label = DEPT_CONFIG[type]?.label || type;
        document.getElementById('hisabTitle').textContent = label + ' Hisab: ' + name + (!rc.isAdmin ? ' (Read Only)' : '');
        document.getElementById('hisabSaveBtn').classList.toggle('hidden', appMode === 'view' || !rc.isAdmin);
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        renderHisabContent();
      }

      function renderHisabContent() {
        const { type, name } = currentHisab;
        if (!type || !name) return;

        if (!state.hisabMeta[type]) state.hisabMeta[type] = {};
        if (!state.hisabMeta[type][name]) {
          state.hisabMeta[type][name] = { lastBalance: '', entries: {}, paymentRows: [], draftRows: [] };
        }
        const meta = state.hisabMeta[type][name];
        if (!Array.isArray(meta.paymentRows)) meta.paymentRows = [];
        if (!Array.isArray(meta.draftRows)) meta.draftRows = [];
        if (!meta.ignoredDbPayments) meta.ignoredDbPayments = {};

        // Migrate any old per-lot payments into paymentRows once
        Object.keys(meta.entries || {}).forEach(k => {
          const en = meta.entries[k];
          if (en && parseFloat(en.payment) > 0) {
            meta.paymentRows.push({ date: en.date || '', payment: String(en.payment) });
            en.payment = '';
          }
        });

        const label = DEPT_CONFIG[type]?.label || type;
        const sortBy = currentHisab.sortBy || 'lot';
        const matchingRows = getHisabSortedRows(getUnpaidDeptRows(type, name), type, name, sortBy);
        const isStageDept = ['fabrication', 'tanki', 'washing', 'packing'].includes(type);
        const isTankiHisab = type === 'tanki';
        const isWashingHisab = type === 'washing';

        // Sort independent paymentRows by date ascending (blank dates at end)
        meta.paymentRows.sort((a, b) => {
          const da = (a.date || '').trim();
          const db = (b.date || '').trim();
          if (!da && !db) return 0;
          if (!da) return 1;
          if (!db) return -1;
          return da.localeCompare(db);
        });

        let totalPeice = 0;
        let totalGonePcs = 0;
        let totalAmount = 0;
        let totalPayment = 0;

        const rowsHtml = matchingRows.map(r => {
          if (!meta.entries[r.id]) {
            meta.entries[r.id] = { rate: '', date: '', payment: '', ignored: false };
          }
          const entry = meta.entries[r.id];
          const isIgnored = !!entry.ignored;
          const vals = getDeptRowValues(type, r, name, entry);

          if (!isIgnored) {
            totalPeice += vals.pcs;
            totalGonePcs += vals.gone;
            totalAmount += vals.amount;
          }

          const displayRate = vals.rateReadonly ? (r[type]?.rate || '') : (entry.rate || '');
          return `<tr class="border-b border-slate-200 ${isIgnored ? 'bg-slate-100 opacity-50 no-print' : ''}" ${isIgnored ? 'data-html2canvas-ignore="true"' : ''}>
            <td class="px-2 py-2 border-r border-slate-200">
              <input type="text" data-hisab-lot-field="lotNo" data-lot-id="${r.id}" value="${escapeHtml(r.lotNo)}" placeholder="Lot" class="w-16 font-bold text-slate-900 border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
            </td>
            ${isStageDept ? `
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="number" inputmode="numeric" data-hisab-lot-field="come" data-lot-id="${r.id}" value="${escapeHtml(vals.come ? String(vals.come) : '')}" placeholder="0" class="w-16 text-right font-semibold border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="number" inputmode="numeric" data-hisab-lot-field="gone" data-lot-id="${r.id}" value="${escapeHtml(vals.gone ? String(vals.gone) : '')}" placeholder="0" class="w-16 text-right font-semibold border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>
              ${isTankiHisab ? `
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="text" list="dl_hisab_fabrication" data-hisab-lot-field="fabricationName" data-lot-id="${r.id}" value="${escapeHtml(r.fabrication?.name || '')}" placeholder="Fabrication" class="w-24 border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="text" list="dl_hisab_washing" data-hisab-lot-field="washingName" data-lot-id="${r.id}" value="${escapeHtml(r.washing?.name || '')}" placeholder="Washing" class="w-24 border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>` : ''}
              ${isWashingHisab ? `
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="text" data-hisab-lot-field="washingType" data-lot-id="${r.id}" value="${escapeHtml(r.washing?.washingType || '')}" placeholder="Washing Type" class="w-24 border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>` : ''}
            ` : `
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="number" inputmode="numeric" data-hisab-lot-field="peice" data-lot-id="${r.id}" value="${escapeHtml(vals.pcs ? String(vals.pcs) : '')}" placeholder="0" class="w-16 text-right font-semibold border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>
            `}
            <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
              <input type="number" step="0.01" inputmode="decimal" data-hisab-field="rate" data-lot-id="${r.id}" value="${escapeHtml(displayRate)}" placeholder="0" class="w-16 text-right border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
            </td>
            <td data-hisab-amount-cell="${r.id}" class="px-2 py-2 text-right font-bold text-slate-900 border-r border-slate-200 whitespace-nowrap">₹${vals.amount.toFixed(0)}</td>
            <td class="px-2 py-2 text-center no-print" data-html2canvas-ignore="true">
              ${currentHisab.readOnlyUser
                ? (type === 'fabrication' ? `<button type="button" data-req-rate-lot="${r.id}" data-curr-rate="${escapeHtml(displayRate)}" class="px-2 py-1 rounded text-[11px] font-bold bg-amber-500 hover:bg-amber-400 text-zinc-950">📩 Req Rate</button>` : '<span class="text-[10px] text-zinc-500">Read Only</span>')
                : `<button type="button" data-toggle-ignore="${r.id}" class="px-2 py-1 rounded text-[11px] font-bold transition ${isIgnored ? 'bg-amber-500 text-slate-950' : 'bg-slate-200 hover:bg-slate-300 text-slate-700'}">${isIgnored ? 'Ignored' : 'Ignore This Time'}</button>`}
            </td>
          </tr>`;
        }).join('');

        const draftRowsHtml = meta.draftRows.map((dr, dIdx) => {
          const dCome = parseFloat(dr.come || dr.peice) || 0;
          const dRate = parseFloat(dr.rate) || 0;
          const dAmt = dCome * dRate;
          totalPeice += dCome;
          totalGonePcs += (parseFloat(dr.gone) || 0);
          totalAmount += dAmt;

          return `<tr class="border-b border-slate-200 bg-indigo-50/40">
            <td class="px-2 py-2 border-r border-slate-200">
              <input type="text" data-draft-lot-input="${dIdx}" value="${escapeHtml(dr.lotNo || '')}" placeholder="Enter Lot" class="w-16 font-bold text-slate-900 border border-indigo-400 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </td>
            ${isStageDept ? `
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="number" inputmode="numeric" data-draft-field="come" data-draft-idx="${dIdx}" value="${escapeHtml(dr.come || '')}" placeholder="0" class="w-16 text-right font-semibold border border-slate-300 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="number" inputmode="numeric" data-draft-field="gone" data-draft-idx="${dIdx}" value="${escapeHtml(dr.gone || '')}" placeholder="0" class="w-16 text-right font-semibold border border-slate-300 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>
              ${isTankiHisab ? `
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="text" list="dl_hisab_fabrication" data-draft-field="fabricationName" data-draft-idx="${dIdx}" value="${escapeHtml(dr.fabricationName || '')}" placeholder="Fabrication" class="w-24 border border-slate-300 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="text" list="dl_hisab_washing" data-draft-field="washingName" data-draft-idx="${dIdx}" value="${escapeHtml(dr.washingName || '')}" placeholder="Washing" class="w-24 border border-slate-300 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>` : ''}
              ${isWashingHisab ? `
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="text" data-draft-field="washingType" data-draft-idx="${dIdx}" value="${escapeHtml(dr.washingType || '')}" placeholder="Washing Type" class="w-24 border border-slate-300 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>` : ''}
            ` : `
              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="number" inputmode="numeric" data-draft-field="peice" data-draft-idx="${dIdx}" value="${escapeHtml(dr.peice || '')}" placeholder="0" class="w-16 text-right font-semibold border border-slate-300 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
              </td>
            `}
            <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
              <input type="number" step="0.01" inputmode="decimal" data-draft-field="rate" data-draft-idx="${dIdx}" value="${escapeHtml(dr.rate || '')}" placeholder="0" class="w-16 text-right border border-slate-300 bg-white rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />
            </td>
            <td data-draft-amount-cell="${dIdx}" class="px-2 py-2 text-right font-bold text-slate-900 border-r border-slate-200 whitespace-nowrap">₹${dAmt.toFixed(0)}</td>
            <td class="px-2 py-2 text-center no-print" data-html2canvas-ignore="true">
              <button type="button" data-remove-draft="${dIdx}" class="px-2 py-1 rounded text-[11px] font-bold bg-rose-100 hover:bg-rose-200 text-rose-700">Remove</button>
            </td>
          </tr>`;
        }).join('');

        const daybookPayRows = getDaybookPaymentsForName(name);
        const combinedPayList = [
          ...daybookPayRows.map(d => ({ dbId: d.dbId, date: d.date, payment: d.payment, isDaybook: true, ignored: !!meta.ignoredDbPayments[d.dbId] })),
          ...meta.paymentRows.map((pr, pIdx) => ({ date: pr.date || '', payment: pr.payment || '', isDaybook: false, pIdx, ignored: !!pr.ignored }))
        ].sort((a, b) => (!a.date && !b.date) ? 0 : (!a.date ? 1 : (!b.date ? -1 : a.date.localeCompare(b.date))));

        const payRowsHtml = combinedPayList.map((pr, dispIdx) => {
          const pVal = parseFloat(pr.payment) || 0;
          if (!pr.ignored) totalPayment += pVal;
          if (pr.isDaybook) {
            return `<tr class="border-b border-slate-200 ${pr.ignored ? 'opacity-45 bg-zinc-900 no-print' : 'bg-amber-500/10'}" ${pr.ignored ? 'data-html2canvas-ignore="true"' : ''}>
              <td class="px-2.5 py-2 font-bold text-xs text-amber-300 border-r border-slate-200">${dispIdx + 1}</td>
              <td class="px-2 py-2 border-r border-slate-200 whitespace-nowrap text-xs font-semibold">${escapeHtml(formatDateDMY(pr.date))} <span class="text-[10px] text-amber-300">(Daybook)</span></td>
              <td class="px-2 py-2 border-r border-slate-200 whitespace-nowrap text-right font-bold text-emerald-400 text-xs">₹${pVal.toFixed(0)}</td>
              <td class="px-2 py-2 text-center no-print" data-html2canvas-ignore="true">
                <button type="button" data-toggle-db-ignore="${escapeHtml(pr.dbId)}" class="px-2 py-1 rounded text-[10px] font-bold transition ${pr.ignored ? 'bg-amber-500 text-zinc-950' : 'bg-zinc-700 hover:bg-zinc-600 text-zinc-200'}">
                  ${pr.ignored ? 'Ignored' : 'Ignore'}
                </button>
              </td>
            </tr>`;
          }
          const pIdx = pr.pIdx;
          return `<tr class="border-b border-slate-200 ${pr.ignored ? 'opacity-45 bg-zinc-900 no-print' : ''}" ${pr.ignored ? 'data-html2canvas-ignore="true"' : ''}>
            <td class="px-2.5 py-2 font-bold text-xs text-zinc-400 border-r border-slate-200">${dispIdx + 1}</td>
            <td class="px-2 py-2 border-r border-slate-200 whitespace-nowrap">
              <div class="relative w-28 h-7 border border-slate-300 rounded bg-white flex items-center justify-between px-1.5 text-xs">
                <span data-pay-date-label="${pIdx}" class="font-medium">${escapeHtml(formatDateDMY(pr.date || ''))}</span>
                <span class="text-[10px] text-slate-400 no-print">📅</span>
                <input type="date" data-pay-row-field="date" data-pay-idx="${pIdx}" value="${escapeHtml(pr.date || '')}" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
              </div>
            </td>
            <td class="px-2 py-2 border-r border-slate-200 whitespace-nowrap">
              <input type="number" step="0.01" inputmode="decimal" data-pay-row-field="payment" data-pay-idx="${pIdx}" value="${escapeHtml(pr.payment || '')}" placeholder="0" class="w-24 text-right font-bold border border-slate-300 rounded px-2 py-1 text-xs focus:outline-none" />
            </td>
            <td class="px-2 py-2 text-center no-print" data-html2canvas-ignore="true">
              <div class="flex items-center justify-center gap-1">
                <button type="button" data-toggle-pay-ignore="${pIdx}" class="px-1.5 py-1 rounded text-[10px] font-bold ${pr.ignored ? 'bg-amber-500 text-zinc-950' : 'bg-zinc-700 hover:bg-zinc-600 text-zinc-200'}">${pr.ignored ? 'Ignored' : 'Ignore'}</button>
                <button type="button" data-remove-pay-row="${pIdx}" class="px-1.5 py-1 rounded text-[10px] font-bold bg-rose-900/60 hover:bg-rose-800 text-rose-200">✕</button>
              </div>
            </td>
          </tr>`;
        }).join('');

        const lastBal = parseFloat(meta.lastBalance) || 0;
        const pcsBal = totalPeice - totalGonePcs;
        const pcsBalAmt = isStageDept ? (parseFloat(meta.pcsBalAmount) || 0) : 0;
        const alterBal = getAlterBalance(name);
        const grandKaam = totalAmount + lastBal;
        const balance = grandKaam - totalPayment - pcsBalAmt;

        const area = document.getElementById('hisabPrintArea');
        area.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-amber-500 pb-3 mb-4">
            <div>
              <div class="text-xs uppercase tracking-wider font-bold text-amber-400">${escapeHtml(label)} Hisab Sheet (Unpaid Only)</div>
              <h2 class="text-xl sm:text-2xl font-extrabold text-white">${escapeHtml(name)}</h2>

            const row = getRow(lotId);
            if (!row) return;
            if (field === 'lotNo') {
              row.lotNo = normalizeLotNo(e.target.value) || e.target.value;
            } else if (field === 'come') {
              normalizeRowStages(row);
              if (type === 'fabrication') row.peice = e.target.value;
              else if (type === 'tanki') row.fabrication.goneEntries[0].peice = e.target.value;
              else if (type === 'washing') row.tanki.goneEntries[0].peice = e.target.value;
              else if (type === 'packing') row.washing.goneEntries[0].peice = e.target.value;
            } else if (field === 'gone') {
              normalizeRowStages(row);
              row[type].goneEntries[0].peice = e.target.value;
              if (type === 'packing') applyJamaAutoClear(row);
            } else if (field === 'fabricationName') {
              row.fabrication.name = e.target.value;

              row.washing.name = e.target.value;

        function recalcHisabTotalsOnly() {
          let tPcs = 0;
          let tGone = 0;
          let tAmt = 0;
          let tPay = 0;
          matchingRows.forEach(r => {
            const en = meta.entries[r.id] || {};
            const vals = getDeptRowValues(type, r, name, en);
            const amtCell = area.querySelector(`[data-hisab-amount-cell="${r.id}"]`);
            if (amtCell) amtCell.textContent = '₹' + vals.amount.toFixed(0);
            if (!en.ignored) {
              tPcs += vals.pcs;
              tGone += vals.gone;
              tAmt += vals.amount;
            }
          });
          meta.draftRows.forEach((dr, dIdx) => {
            const dCome = parseFloat(dr.come || dr.peice) || 0;
            const dRate = parseFloat(dr.rate) || 0;
            const dAmt = dCome * dRate;
            tPcs += dCome;
            tGone += (parseFloat(dr.gone) || 0);
            tAmt += dAmt;
            const dAmtCell = area.querySelector(`[data-draft-amount-cell="${dIdx}"]`);
            if (dAmtCell) dAmtCell.textContent = '₹' + dAmt.toFixed(0);
          });
          getDaybookPaymentsForName(name).forEach(d => {
            if (!meta.ignoredDbPayments?.[d.dbId]) tPay += parseFloat(d.payment) || 0;
          });
          meta.paymentRows.forEach(pr => {
            if (!pr.ignored) tPay += parseFloat(pr.payment) || 0;
          });
          const lb = parseFloat(meta.lastBalance) || 0;
          const pBal = tPcs - tGone;
          const pBalAmt = isStageDept ? (parseFloat(meta.pcsBalAmount) || 0) : 0;
          const bal = (tAmt + lb) - tPay - pBalAmt;
          const pcsEl = document.getElementById('hisabTotalPeice');
          if (pcsEl) pcsEl.textContent = tPcs;
          const fComeEl = document.getElementById('hisabFooterComeTotal');
          if (fComeEl) fComeEl.textContent = tPcs;
          const fGoneEl = document.getElementById('hisabFooterGoneTotal');
          if (fGoneEl) fGoneEl.textContent = tGone;
          const fPeiceEl = document.getElementById('hisabFooterPeiceTotal');
          if (fPeiceEl) fPeiceEl.textContent = tPcs;
          const fAmtEl = document.getElementById('hisabFooterAmountTotal');
          if (fAmtEl) fAmtEl.textContent = '₹' + tAmt.toFixed(0);
          const pBalEl = document.getElementById('hisabPcsBal');
          if (pBalEl) pBalEl.textContent = pBal + ' pcs';
          document.getElementById('hisabTotalAmount').textContent = '₹' + tAmt.toFixed(0);
          document.getElementById('hisabTotalPayment').textContent = '₹' + tPay.toFixed(0);
          document.getElementById('hisabFinalBalance').textContent = '₹' + bal.toFixed(0);
        }
      }

      function saveCurrentHisab() {
        const { type, name, isSavedView } = currentHisab;
        if (!type || !name || isSavedView) return;
        const meta = state.hisabMeta[type]?.[name] || { lastBalance: '', entries: {} };
        const matchingRows = getUnpaidDeptRows(type, name);
        const ignoredIds = new Set(matchingRows.filter(r => Boolean(meta.entries[r.id] && meta.entries[r.id].ignored)).map(r => r.id));
        const included = matchingRows.filter(r => !ignoredIds.has(r.id));

        if (!included.length) {
          showToast('Save karne ke liye kam se kam 1 non-ignored lot chahiye');
          return;
        }

        let totalPiece = 0;
        let totalGone = 0;
        let totalAmount = 0;
        const snapshotRows = included.map(r => {
          const en = meta.entries[r.id] || {};
          const vals = getDeptRowValues(type, r, name, en);
          totalPiece += vals.pcs;
          totalGone += vals.gone;
          totalAmount += vals.amount;
          return {
            lotNo: r.lotNo,
            peice: vals.pcs,
            come: vals.come,
            gone: vals.gone,
            fabricationName: r.fabrication?.name || '',
            washingName: r.washing?.name || '',
            washingType: r.washing?.washingType || '',
            rate: vals.rate,
            amount: vals.amount
          };
        });
        const allDbPays = getDaybookPaymentsForName(name);
        const includedDbPays = allDbPays.filter(d => !(meta.ignoredDbPayments && meta.ignoredDbPayments[d.dbId]));
        const includedManualPays = (meta.paymentRows || []).filter(pr => !pr.ignored);
        const keptManualPays = (meta.paymentRows || []).filter(pr => pr.ignored).map(pr => ({ ...pr, ignored: false }));

        const paymentRows = [
          ...includedDbPays.map(d => ({ date: d.date, payment: parseFloat(d.payment) || 0 })),
          ...includedManualPays.map(pr => ({ date: pr.date || '', payment: parseFloat(pr.payment) || 0 }))
        ].sort((a, b) => (!a.date && !b.date) ? 0 : (!a.date ? 1 : (!b.date ? -1 : a.date.localeCompare(b.date))));
        const totalPayment = paymentRows.reduce((sum, p) => sum + (parseFloat(p.payment) || 0), 0);

        const isStage = ['fabrication', 'tanki', 'washing', 'packing'].includes(type);
        const pcsBal = totalPiece - totalGone;
        const pcsBalAmount = isStage ? (parseFloat(meta.pcsBalAmount) || 0) : 0;
        const lastBalance = parseFloat(meta.lastBalance) || 0;
        const finalBalance = (totalAmount + lastBalance) - totalPayment - pcsBalAmount;
        const sameNameCount = state.savedHisabs.filter(
          h => (h.name || '').trim().toLowerCase() === name.trim().toLowerCase()
        ).length;
        const nextNum = String(sameNameCount + 1).padStart(2, '0');
        const hisabTitle = name.trim() + ' ' + nextNum;

        const snapshot = {
          id: 'hisab_' + Date.now().toString(36),
          title: hisabTitle,
          dept: type,
          deptLabel: DEPT_CONFIG[type]?.label || type,
          name,
          savedDate: todayISO(),
          savedBy: state.activeUser,
          totalPeice,
          pcsBal,
          pcsBalAmount,
          alterBal: getAlterBalance(name),
          totalAmount,
          lastBalance,
          totalPayment,
          finalBalance,
          rows: snapshotRows,
          paymentRows
        };

        // Mark ONLY non-ignored included lots Paid & green; keep ignored lots strictly Unpaid for future Hisab
        matchingRows.forEach(r => {
          if (ignoredIds.has(r.id)) {
            if (type === 'master') {
              r.masterPaid = false;
              r.masterPaidLight = false;
            } else {
              r[type].paid = false;
              r[type].paidLight = false;
            }
          } else {
            if (type === 'master') {
              r.masterPaid = true;
              r.masterPaidLight = true;
            } else {
              r[type].paid = true;
              r[type].paidLight = true;
            }
          }
          r.updatedBy = state.activeUser;
          r.updatedAt = Date.now();
        });

        // Reset ignored flags and clear settled paymentRows for next cycle
        matchingRows.forEach(r => {
          if (meta.entries[r.id]) meta.entries[r.id].ignored = false;
        });
        if (!Array.isArray(state.settledDaybookKeys)) state.settledDaybookKeys = [];
        includedDbPays.forEach(d => {
          if (!state.settledDaybookKeys.includes(d.dbId)) state.settledDaybookKeys.push(d.dbId);
        });
        meta.ignoredDbPayments = {};
        meta.paymentRows = keptManualPays;
        meta.pcsBalAmount = '';

        state.savedHisabs.push(snapshot);
        saveLocalState();
        renderTable();
        document.getElementById('hisabOverlay').classList.add('hidden');
        document.getElementById('hisabOverlay').classList.remove('flex');
        showToast(hisabTitle + ' saved! Lots marked Paid (Light Green).');
      }

      function openSavedHisabListModal() {
        const rc = getRoleConfig();
        let list = [...state.savedHisabs].reverse();
        if (!rc.isAdmin) {
          const deptKey = rc.category.toLowerCase();
          const uname = rc.userName.trim().toLowerCase();
          list = list.filter(h => (h.dept || '').toLowerCase() === deptKey && (h.name || '').trim().toLowerCase() === uname);
        }
        openModal(`

        function recalcSavedTotals() {
          let tCome = 0, tGone = 0, tAmt = 0;
          h.rows.forEach((r, idx) => {
            const c = Number(isStage ? (r.come ?? r.peice) : r.peice) || 0;
            const g = Number(r.gone ?? r.peice) || 0;
            const rt = Number(r.rate) || 0;
            r.amount = c * rt;
            tCome += c;
            tGone += g;
            tAmt += r.amount;
            const cell = area.querySelector(`[data-saved-amt-cell="${idx}"]`);
            if (cell) cell.textContent = '₹' + r.amount.toFixed(0);
          });
          h.totalPiece = tCome;
          h.totalAmount = tAmt;
          h.pcsBal = tCome - tGone;
          h.totalPayment = h.paymentRows.reduce((sum, item) => sum + (parseFloat(item.payment) || 0), 0);
          h.finalBalance = (tAmt + Number(h.lastBalance || 0)) - h.totalPayment - Number(h.pcsBalAmount || 0);

          const tpEl = document.getElementById('savedHisabTotalPeice'); if (tpEl) tpEl.textContent = tCome;
          const taEl = document.getElementById('savedHisabTotalAmt'); if (taEl) taEl.textContent = '₹' + tAmt.toFixed(0);
          const fcEl = document.getElementById('savedFooterCome'); if (fcEl) fcEl.textContent = tCome;
          const fgEl = document.getElementById('savedFooterGone'); if (fgEl) fgEl.textContent = tGone;
          const fpEl = document.getElementById('savedFooterPeice'); if (fpEl) fpEl.textContent = tCome;
          const faEl = document.getElementById('savedFooterAmt'); if (faEl) faEl.textContent = '₹' + tAmt.toFixed(0);
          const pbEl = document.getElementById('savedPcsBal'); if (pbEl) pbEl.textContent = h.pcsBal + ' pcs';
          document.getElementById('savedHisabTotalPay').textContent = '₹' + h.totalPayment.toFixed(0);
          document.getElementById('savedHisabFinalBal').textContent = '₹' + h.finalBalance.toFixed(0);
          saveLocalState();
        }

        if (unlocked) {
          document.getElementById('savedLastBalInput').addEventListener('input', (e) => {
            h.lastBalance = parseFloat(e.target.value) || 0;
            recalcSavedTotals();
          });
          const spb = document.getElementById('savedPcsBalAmtInput');
          if (spb) {
            spb.addEventListener('input', (e) => {
              h.pcsBalAmount = parseFloat(e.target.value) || 0;
              recalcSavedTotals();
            });
          }
          area.querySelectorAll('[data-saved-row-field]').forEach(inp => {
            inp.addEventListener('input', (e) => {
              const idx = parseInt(e.target.getAttribute('data-saved-row-idx'), 10);
              const f = e.target.getAttribute('data-saved-row-field');
              if (!h.rows[idx]) return;
              h.rows[idx][f] = parseFloat(e.target.value) || 0;
              if (f === 'come') h.rows[idx].peice = h.rows[idx][f];
              recalcSavedTotals();
            });
          });
          const addSavedPayBtn = document.getElementById('addSavedPayRowBtn');
          if (addSavedPayBtn) {
            addSavedPayBtn.addEventListener('click', () => {
              h.paymentRows.push({ date: '', payment: 0 });
              saveLocalState();
              openSavedHisabDetail(id, true);
            });
          }
          area.querySelectorAll('[data-saved-pdate-idx]').forEach(inp => {
            inp.addEventListener('change', (e) => {
              const idx = parseInt(e.target.getAttribute('data-saved-pdate-idx'), 10);
              if (!h.paymentRows[idx]) return;
              h.paymentRows[idx].date = e.target.value;
              h.paymentRows.sort((a, b) => (!a.date && !b.date) ? 0 : (!a.date ? 1 : (!b.date ? -1 : a.date.localeCompare(b.date))));
              saveLocalState();
              openSavedHisabDetail(id, true);
            });
          });
          area.querySelectorAll('[data-saved-pay-idx]').forEach(inp => {
            inp.addEventListener('input', (e) => {
              const idx = parseInt(e.target.getAttribute('data-saved-pay-idx'), 10);
              if (!h.paymentRows[idx]) return;
              h.paymentRows[idx].payment = parseFloat(e.target.value) || 0;
              recalcSavedTotals();
            });
          });
        }
      }

      function openPendingThermalPreviewModal(query) {
        const q = (query || '').trim().toLowerCase();
        const depts = [
          { key: 'fabrication', label: 'FABRICATION' },
          { key: 'tanki', label: 'TANKI' },
          { key: 'washing', label: 'WASHING' },
          { key: 'packing', label: 'PACKING' }
        ];
        let grandPending = 0;
        const deptBlocksHtml = depts.map(d => {
          const pendingRows = state.rows.filter(r => {
            if ((r[d.key]?.status || 'Pending') !== 'Pending') return false;
            if (!q) return true;
            return (r.lotNo || '').toLowerCase().includes(q) ||
                   (r[d.key]?.name || '').toLowerCase().includes(q) ||
                   d.label.toLowerCase().includes(q);
          });
          if (q && !pendingRows.length) return '';
          grandPending += pendingRows.length;
          return `
            <div class="border-b border-dashed border-black pb-1.5 mb-1.5">
              <div class="font-extrabold text-[11px]">${d.label} (${pendingRows.length} Pending)</div>
              ${pendingRows.length ? pendingRows.map(r => {
                const st = getStageTotals(r, d.key);
                const nm = (r[d.key]?.name || '').trim();
                const info = nm ? ` - ${escapeHtml(nm)}` : '';
                const pcsInfo = (st.come || st.gone) ? ` [${st.come}-${st.gone}=${st.balance}]` : '';
                return `<div class="text-[10.5px] pl-1">Lot ${escapeHtml(r.lotNo)}${info}${pcsInfo}</div>`;
              }).join('') : '<div class="text-[10px] pl-1 text-zinc-600">No pending lots</div>'}
            </div>
          `;
        }).join('');

        openModal(`
          <div class="p-4 sm:p-5">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-3 no-print">
              <div>
                <h3 class="text-base font-bold">Pending Lots — 3" Print Preview</h3>

              <div id="thermalPrintReceipt" class="w-[76mm] max-w-full bg-white text-black p-3 rounded shadow-md font-mono text-[11px] leading-snug">
                <div class="text-center border-b-2 border-dashed border-black pb-2 mb-2">
                  <div class="text-sm font-extrabold tracking-wider">ADDIS JEANS</div>
                  <div class="font-bold text-xs">PENDING LOTS LIST</div>
                  <div class="text-[10px] mt-0.5">Date: ${escapeHtml(formatDateDMY(todayISO()))} | By: ${escapeHtml(state.activeUser)}</div>
                  ${q ? `<div class="text-[10px] font-bold mt-0.5">Filter: ${escapeHtml(query.trim())}</div>` : ''}
                </div>
                ${deptBlocksHtml}
                <div class="font-extrabold text-xs pt-1 border-t border-black flex justify-between">
                  <span>TOTAL PENDING:</span><span>${grandPending}</span>
                </div>
              </div>
            </div>

            <div class="mt-3 flex flex-wrap items-center justify-between gap-2 no-print">
              <button id="pendingPreviewBackBtn" type="button" class="px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-semibold">← Back</button>
              <div class="flex flex-wrap gap-2 ml-auto">
                <button id="pendingSysPrintBtn" type="button" class="px-3 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-zinc-950 text-xs font-extrabold">🖨️ System Print</button>

      function getAllPartyNameSuggestions() {
        const set = new Set();
        state.rows.forEach(r => {
          if ((r.masterName || '').trim()) set.add(r.masterName.trim());
          ['embroidery', 'fabrication', 'tanki', 'washing', 'packing', 'laser', 'print'].forEach(d => {
            const n = (r[d]?.name || '').trim();
            if (n) set.add(n);
          });
        });
        Object.keys(state.alterData || {}).forEach(n => { if (n.trim()) set.add(n.trim()); });
        Object.values(state.daybook || {}).forEach(dayVal => {
          if (Array.isArray(dayVal)) {
            dayVal.forEach(item => { if ((item.name || '').trim()) set.add(item.name.trim()); });
          } else if (dayVal && Array.isArray(dayVal.columns)) {
            dayVal.columns.forEach(col => { if ((col.name || '').trim()) set.add(col.name.trim()); });
          }
        });
        return Array.from(set).sort((a, b) => a.localeCompare(b));
      }

      function normalizeDaybookDay(dayVal, dtKey) {
        let cols = [];
        if (dayVal && Array.isArray(dayVal.columns)) {
          cols = dayVal.columns;
        } else if (Array.isArray(dayVal)) {
          const byName = new Map();
          dayVal.forEach(item => {
            const nm = (item.name || '').trim();
            if (!nm) return;
            const key = nm.toLowerCase();
            if (!byName.has(key)) {
              const col = { name: nm, payments: [] };
              byName.set(key, col);
              cols.push(col);
            }
            if (item.payment !== undefined && item.payment !== '') {
              byName.get(key).payments.push({ id: 'db_' + dtKey + '_' + cols.length + '_' + byName.get(key).payments.length, val: String(item.payment) });
            }
          });
        }
        cols.forEach((col, cIdx) => {
          if (!Array.isArray(col.payments)) col.payments = [];
          col.payments = col.payments.map((p, pIdx) => {
            if (p && typeof p === 'object') {
              if (!p.id) p.id = 'db_' + (dtKey || 'd') + '_' + cIdx + '_' + pIdx + '_' + Math.random().toString(36).slice(2, 5);
              return p;
            }
            return { id: 'db_' + (dtKey || 'd') + '_' + cIdx + '_' + pIdx, val: String(p ?? '') };
          });
        });
        return { columns: cols };
      }

      function getDaybookPaymentsForName(name) {
        if (!name) return [];
        const target = name.trim().toLowerCase();
        const settled = new Set(state.settledDaybookKeys || []);
        const list = [];
        Object.keys(state.daybook || {}).sort().forEach(dt => {
          const dayObj = normalizeDaybookDay(state.daybook[dt], dt);
          state.daybook[dt] = dayObj;
          dayObj.columns.forEach(col => {
            if ((col.name || '').trim().toLowerCase() === target) {
              (col.payments || []).forEach(pObj => {
                const p = parseFloat(pObj.val) || 0;
                if (p > 0 && !settled.has(pObj.id)) {
                  list.push({
                    dbId: pObj.id,
                    date: dt,
                    payment: p,
                    isDaybook: true
                  });
                }
              });
            }
          });
        });
        return list;
      }

            const parts = curDate.split('-').map(Number);
            const dt = new Date(parts[0], parts[1] - 1, parts[2] + deltaDays);
            const y = dt.getFullYear();
            const m = String(dt.getMonth() + 1).padStart(2, '0');
            const d = String(dt.getDate()).padStart(2, '0');
            curDate = `${y}-${m}-${d}`;
            renderDaybook();
          }

          if (swipeArea) {
            let swX = 0, swY = 0;
            swipeArea.addEventListener('touchstart', (e) => {
              if (e.target.closest('table')) return;
              swX = e.touches[0].clientX;
              swY = e.touches[0].clientY;
            }, { passive: true });
            swipeArea.addEventListener('touchend', (e) => {
              if (!swX || e.target.closest('table')) return;
              const dx = e.changedTouches[0].clientX - swX;
              const dy = e.changedTouches[0].clientY - swY;
              swX = 0; swY = 0;
              if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {

      let btPrinterDevice = null;

      const BT_PRINTER_SERVICES = [
        '000018f0-0000-1000-8000-00805f9b34fb',
        'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
        '49535343-fe7d-4ae5-8fa9-9fafd205e455',
