  <style>
    #modalContent input, #modalContent select, #modalContent textarea {
      background-color: #0b0d11;
      color: #f8fafc;
      border-color: #3f3f46;
    }
    #modalContent input:disabled, #modalContent input[readonly] {
      background-color: #27272a !important;
      color: #a1a1aa !important;
    }
    #modalContent label { color: #d4d4d8; }
    #modalContent h3 { color: #fbbf24; }
    #modalContent p.text-slate-500 { color: #a1a1aa; }
    #modalContent .bg-slate-50, #modalContent .bg-slate-100 { background-color: #20242e; color: #f4f4f5; border-color: #3f3f46; }
    #modalContent .text-slate-900, #modalContent .text-slate-700 { color: #f4f4f5; }
    #modalContent .border-slate-200 { border-color: #2e3440; }
    * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0b0d11; color: #f8fafc; }
    .lot-bold { font-weight: 800; letter-spacing: 0.02em; }
    .cell-paid-bright {
      background-color: #22c55e !important;
      color: #052e16 !important;
      border-color: #16a34a !important;
    }
    .cell-paid-bright .sub-text {
      color: #064e3b !important;
      font-weight: 600;
    }
    .cell-paid-light {
      background-color: #bbf7d0 !important;
      color: #064e3b !important;
      border-color: #4ade80 !important;
    }
    .cell-paid-light .sub-text {
      color: #065f46 !important;
      font-weight: 600;
    }
    .cell-status-clear {
      background-color: #fef08a !important;
      color: #713f12 !important;
      border-color: #eab308 !important;
    }
    .cell-status-clear .sub-text {
      color: #854d0e !important;
    }
    body.view-mode-active .edit-only-control {
      display: none !important;
    }
    .sticky-lot {
      position: sticky;
      left: 0;
      z-index: 10;
      background: #14171f;
      box-shadow: 2px 0 8px -2px rgba(0, 0, 0, 0.65);
    }
    thead .sticky-lot {
      z-index: 20;
      background: #f59e0b;
      color: #09090b;
    }
    .table-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
    .table-scroll::-webkit-scrollbar-track { background: #14171f; }
    .table-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    @media print {
      body * { visibility: hidden !important; }
      #hisabPrintArea, #hisabPrintArea * { visibility: visible !important; }
      #hisabPrintArea {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        background: #ffffff !important;
        padding: 16px !important;
        box-shadow: none !important;
      }
      .no-print { display: none !important; }
    }
  </style>

      <button type="button" id="topEmbroideryBtn" data-hisab-dept="embroidery" class="px-2.5 py-1 rounded-md bg-purple-700 hover:bg-purple-600 text-white font-bold text-xs shrink-0 transition">Embroidery</button>

      <button type="button" data-hisab-dept="print" class="px-2.5 py-1 rounded-md bg-zinc-800 hover:bg-zinc-700 border border-zinc-600 text-zinc-100 font-bold text-xs shrink-0 transition">Print</button>
    </div>
  </header>

  <!-- Main Table Container (Obsidian Dark Surface & Amber-Gold Header) -->
  <main class="flex-1 p-2 sm:p-3 overflow-hidden flex flex-col">
    <div class="bg-[#14171f] rounded-xl shadow-xl border border-zinc-800 flex-1 flex flex-col overflow-hidden">
      <div class="table-scroll overflow-x-auto overflow-y-auto flex-1">
        <table class="w-full border-collapse text-left text-xs sm:text-sm min-w-[1250px]">
          <thead class="bg-amber-500 text-zinc-950 font-extrabold sticky top-0 z-20 uppercase text-xs tracking-wide">
            <tr>
              <th class="sticky-lot px-3 py-2.5 border-b border-r border-amber-600/40 w-24 text-center">Lot no</th>
              <th class="px-3 py-2.5 border-b border-r border-amber-600/40 w-24 text-center">peice</th>

              <th class="px-3 py-2.5 border-b border-r border-amber-600/40 w-28 text-center">fabric</th>
              <th class="px-3 py-2.5 border-b border-r border-amber-600/40 w-28 text-center">Master</th>
              <th class="px-3 py-2.5 border-b border-r border-amber-600/40 w-32 text-center">Embroidery</th>

              <th class="px-3 py-2.5 border-b border-r border-amber-600/40 w-28 text-center">Tanki</th>
              <th class="px-3 py-2.5 border-b border-r border-amber-600/40 w-32 text-center">washing</th>
              <th class="px-3 py-2.5 border-b border-r border-amber-600/40 w-32 text-center">packing</th>
              <th class="px-3 py-2.5 border-b border-r border-amber-600/40 w-24 text-center">Jama</th>
              <th class="px-3 py-2.5 border-b border-r border-amber-600/40 w-28 text-center">Laser</th>

  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-amber-500 text-zinc-950 px-4 py-2 rounded-full text-xs sm:text-sm font-bold shadow-xl opacity-0 pointer-events-none transition-opacity duration-200 z-50"></div>

  <!-- Generic Modal Backdrop -->
  <div id="modalBackdrop" class="fixed inset-0 bg-black/75 backdrop-blur-xs hidden items-center justify-center p-3 z-40">
    <div id="modalContent" class="bg-[#181b22] text-zinc-100 rounded-2xl shadow-2xl w-full max-w-lg max-h-[92vh] overflow-y-auto border border-zinc-700">
      <!-- Dynamic Modal Body -->
    </div>
  </div>

  <!-- Hisab Fullscreen Overlay -->
  <div id="hisabOverlay" class="fixed inset-0 bg-[#0b0d11] hidden flex-col z-40 overflow-y-auto">
    <div class="bg-[#161922] text-white px-3 py-2.5 flex items-center justify-between sticky top-0 z-10 border-b border-zinc-800 no-print">
      <div class="flex items-center gap-2">
        <button id="hisabBackBtn" type="button" class="px-3 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-xs sm:text-sm font-semibold">← Back</button>
        <h2 id="hisabTitle" class="text-sm sm:text-base font-bold text-amber-400">Hisab</h2>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="hisabSaveBtn" type="button" class="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold text-xs sm:text-sm">💾 Save Hisab</button>
        <button id="hisabPrintBtn" type="button" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs sm:text-sm">🖨️ Print</button>
        <button id="hisabShareBtn" type="button" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm">📄 PDF / WhatsApp</button>
      </div>
    </div>
    <div class="p-3 sm:p-5 max-w-4xl w-full mx-auto">
      <div id="hisabPrintArea" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6">
        <!-- Dynamic Hisab Content -->
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'lot_tracker_v2_data';
      const SYNC_CONFIG_KEY = 'lot_tracker_v2_sync_cfg';
      const USER_KEY = 'lot_tracker_v2_user';
      const DEFAULT_EDIT_PIN = '4311';

      const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('lot_tracker_sync_channel') : null;

      let appMode = 'edit'; // 'edit' | 'view'
      let state = {
        activeUser: 'Shameem',
        editPin: DEFAULT_EDIT_PIN,
        rows: [],
        savedHisabs: [],
        hisabMeta: {
          master: {},
          embroidery: {},
          fabrication: {},
          washing: {},
          tanki: {},
          packing: {},
          laser: {},
          print: {}
        },
        syncConfig: {
          firebaseUrl: '',
          roomCode: 'shameem-saleem-factory',
          autoSync: true,
          lastSyncedAt: null
        }
      };

      let currentSearch = '';
      let syncTimer = null;
      let pollTimer = null;

      function todayISO() {
        const d = new Date();
        const off = d.getTimezoneOffset();
        const local = new Date(d.getTime() - off * 60000);
        return local.toISOString().slice(0, 10);
      }

      function formatDateDMY(val) {
        if (!val) return '';
        const m = String(val).match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return `${m[3]}-${m[2]}-${m[1]}`;
        return String(val);
      }

      function getColumnNameSuggestions(dept) {
        const set = new Set();
        state.rows.forEach(r => {
          const n = dept === 'master' ? (r.masterName || '') : (r[dept]?.name || '');
          if (n.trim()) set.add(n.trim());
        });
        return Array.from(set).sort((a, b) => a.localeCompare(b));
      }

      function buildDatalistHtml(id, dept) {
        const list = getColumnNameSuggestions(dept);
        return `<datalist id="${id}">${list.map(n => `<option value="${escapeHtml(n)}"></option>`).join('')}</datalist>`;
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('opacity-0');
        el.classList.add('opacity-100');
        clearTimeout(el._t);
        el._t = setTimeout(() => {
          el.classList.remove('opacity-100');
          el.classList.add('opacity-0');
        }, 2500);
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function uid() {
        return 'lot_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      function createEmptyPackingLines() {
        return [
          { date: '', peice: '', rate: '', ripit: '', name: '' },
          { date: '', peice: '', rate: '', ripit: '', name: '' },
          { date: '', peice: '', rate: '', ripit: '', name: '' },
          { date: '', peice: '', rate: '', ripit: '', name: '' }
        ];
      }

      function createRow(lotNo) {
        return {
          id: uid(),
          lotNo: lotNo !== undefined ? String(lotNo) : '',
          date: todayISO(),
          peice: '',
          size: '',
          fabric: '',
          masterName: '',
          masterPaid: false,
          embroidery: { date: '', peice: '', rate: '', name: '', paid: false },
          fabrication: { rate: '', name: '', goneEntries: [{ date: '', peice: '' }], status: 'Pending', paid: false },
          tanki: { rate: '', name: '', goneEntries: [{ date: '', peice: '' }], status: 'Pending', paid: false },
          washing: { washingType: '', rate: '', name: '', goneEntries: [{ date: '', peice: '' }], status: 'Pending', paid: false },
          packing: { rate: '', name: '', goneEntries: [{ date: '', peice: '', ripit: '' }], status: 'Pending', paid: false },
          laser: { date: '', peice: '', name: '', paid: false },
          print: { date: '', peice: '', name: '', paid: false },
          updatedBy: state.activeUser,
          updatedAt: Date.now()
        };
      }

      function seedInitialData() {
        const r1 = createRow('101');
        r1.date = todayISO();
        r1.peice = '120';
        r1.size = '28-34';
        r1.fabric = '3/1 Denim';
        r1.masterName = 'Master Akram';
        r1.embroidery = { date: todayISO(), peice: '120', rate: '12', name: 'Raju Emb', paid: false };
        r1.fabrication = { rate: '45', name: 'Imran Fab', goneEntries: [{ date: todayISO(), peice: '100' }], paid: false };

        const r2 = createRow('102');
        r2.date = todayISO();
        r2.peice = '80';
        r2.size = '30-36';
        r2.fabric = 'Knitted';
        r2.masterName = 'Master Akram';
        r2.masterPaid = false;

        state.rows = [r1, r2];
      }

      function normalizeRowStages(r) {
        if (!r.laser && r.damage) { r.laser = r.damage; delete r.damage; }
        if (!r.laser) r.laser = { date: '', peice: '', name: '', paid: false };

        ['fabrication', 'tanki', 'washing'].forEach(d => {
          if (!r[d]) r[d] = { rate: '', name: '', goneEntries: [{ date: '', peice: '' }], status: 'Pending', paid: false };
          if (!r[d].status) r[d].status = 'Pending';
          if (!Array.isArray(r[d].goneEntries)) {
            r[d].goneEntries = (r[d].peice || r[d].date)
              ? [{ date: r[d].date || '', peice: r[d].peice || '' }]
              : [{ date: '', peice: '' }];
          }
          if (r[d].goneEntries.length === 0) r[d].goneEntries.push({ date: '', peice: '' });
        });

        if (!r.packing) r.packing = { rate: '', name: '', goneEntries: [{ date: '', peice: '', ripit: '' }], status: 'Pending', paid: false };
        if (!r.packing.status) r.packing.status = 'Pending';
        if (!Array.isArray(r.packing.goneEntries)) {
          const oldLines = Array.isArray(r.packing.lines) ? r.packing.lines.filter(l => l.peice || l.date || l.name) : [];
          const firstNamed = oldLines.find(l => l.name);
          if (!r.packing.name && firstNamed) r.packing.name = firstNamed.name;
          if (!r.packing.rate && firstNamed) r.packing.rate = firstNamed.rate || '';
          r.packing.goneEntries = oldLines.length
            ? oldLines.map(l => ({ date: l.date || '', peice: l.peice || '', ripit: l.ripit || '' }))
            : [{ date: '', peice: '', ripit: '' }];
        }
        if (r.packing.goneEntries.length === 0) r.packing.goneEntries.push({ date: '', peice: '', ripit: '' });
        return r;
      }

      function loadLocalState() {
        try {
          const savedUser = localStorage.getItem(USER_KEY);
          if (savedUser === 'Shameem' || savedUser === 'Saleem') {
            state.activeUser = savedUser;
          }
          const savedSync = localStorage.getItem(SYNC_CONFIG_KEY);
          if (savedSync) {
            state.syncConfig = Object.assign(state.syncConfig, JSON.parse(savedSync));
          }
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.rows)) {
              if (parsed.editPin) state.editPin = String(parsed.editPin);
              if (parsed.editPin) state.editPin = String(parsed.editPin);
        state.rows = parsed.rows.map(normalizeRowStages);
              state.savedHisabs = Array.isArray(parsed.savedHisabs) ? parsed.savedHisabs : [];
              state.hisabMeta = Object.assign({ master: {}, embroidery: {}, fabrication: {}, washing: {}, tanki: {}, packing: {}, laser: {}, print: {} }, parsed.hisabMeta || {});
              return;
            }
          }
        } catch (e) {
          // Ignore storage errors in restricted environments
        }
        seedInitialData();
      }

      function saveLocalState(skipBroadcast) {
        try {
          localStorage.setItem(USER_KEY, state.activeUser);
          localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(state.syncConfig));
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            editPin: state.editPin,
            rows: state.rows,
            savedHisabs: state.savedHisabs,
            hisabMeta: state.hisabMeta,
            updatedAt: Date.now()
          }));
        } catch (e) {
          // Ignore storage quota errors
        }
        if (!skipBroadcast && bc) {
          bc.postMessage({ type: 'SYNC_UPDATE', rows: state.rows, savedHisabs: state.savedHisabs, hisabMeta: state.hisabMeta });
        }
        scheduleCloudPush();
      }

      function updateSyncBadge(status, text) {
        const dot = document.getElementById('syncStatusDot');
        const label = document.getElementById('syncStatusText');
        if (!dot || !label) return;
        dot.className = 'w-2 h-2 rounded-full ' + (
          status === 'synced' ? 'bg-emerald-400' :
          status === 'syncing' ? 'bg-amber-400 animate-pulse' :
          status === 'error' ? 'bg-rose-400' : 'bg-sky-400'
        );
        label.textContent = text;
      }

      function getFirebaseEndpoint() {
        const base = (state.syncConfig.firebaseUrl || '').trim().replace(/\/+$/, '');
        const room = (state.syncConfig.roomCode || 'default-room').trim().replace(/[^a-zA-Z0-9_-]/g, '');
        if (!base) return null;
        return base + '/lot_tracker/' + room + '.json';
      }

      function scheduleCloudPush() {
        const url = getFirebaseEndpoint();
        if (!url || !state.syncConfig.autoSync) {
          updateSyncBadge('local', 'Local Auto-Sync');
          return;
        }
        updateSyncBadge('syncing', 'Syncing...');
        clearTimeout(syncTimer);
        syncTimer = setTimeout(async () => {
          try {
            const res = await fetch(url, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                editPin: state.editPin,
                rows: state.rows,
                savedHisabs: state.savedHisabs,
                hisabMeta: state.hisabMeta,
                updatedBy: state.activeUser,
                updatedAt: Date.now()
              })
            });
            if (res.ok) {
              state.syncConfig.lastSyncedAt = Date.now();
              updateSyncBadge('synced', 'Cloud Synced');
            } else {
              updateSyncBadge('error', 'Sync Error');
            }
          } catch (err) {
            updateSyncBadge('error', 'Offline (Saved)');
          }
        }, 600);
      }

      async function pullFromCloud(silent) {
        const url = getFirebaseEndpoint();
        if (!url) return;
        try {
          const res = await fetch(url);
          if (!res.ok) return;
          const data = await res.json();
          if (data && Array.isArray(data.rows)) {
            if (data.editPin) state.editPin = String(data.editPin);
            state.rows = data.rows.map(normalizeRowStages);
            state.savedHisabs = Array.isArray(data.savedHisabs) ? data.savedHisabs : [];
            state.hisabMeta = Object.assign({ master: {}, embroidery: {}, fabrication: {}, washing: {}, tanki: {}, packing: {}, laser: {}, print: {} }, data.hisabMeta || {});
            saveLocalState(true);
            renderTable();
            updateSyncBadge('synced', 'Cloud Synced');
            if (!silent) showToast('Cloud data synced!');
          }
        } catch (err) {
          if (!silent) showToast('Offline: using local data');
        }
      }

      function startSyncPolling() {
        clearInterval(pollTimer);
        if (getFirebaseEndpoint() && state.syncConfig.autoSync) {
          pullFromCloud(true);
          pollTimer = setInterval(() => pullFromCloud(true), 12000);
        }
      }

      if (bc) {
        bc.onmessage = (ev) => {
          if (ev.data && ev.data.type === 'SYNC_UPDATE') {
            state.rows = ev.data.rows;
            state.savedHisabs = ev.data.savedHisabs || state.savedHisabs;
            state.hisabMeta = ev.data.hisabMeta || state.hisabMeta;
            renderTable();
            updateSyncBadge('synced', 'Tab Synced');
          }
        };
      }

      function getStageComeEntries(row, dept) {
        if (dept === 'fabrication') {
          return (row.peice || row.date) ? [{ date: row.date || '', peice: row.peice || '' }] : [];
        }
        if (dept === 'tanki') {
          return (row.fabrication?.goneEntries || []).filter(g => (g.peice || '').trim() !== '' || (g.date || '').trim() !== '');
        }
        if (dept === 'washing') {
          return (row.tanki?.goneEntries || []).filter(g => (g.peice || '').trim() !== '' || (g.date || '').trim() !== '');
        }
        if (dept === 'packing') {
          return (row.washing?.goneEntries || []).filter(g => (g.peice || '').trim() !== '' || (g.date || '').trim() !== '');
        }
        return [];
      }

      function getStageTotals(row, dept) {
        const comeList = getStageComeEntries(row, dept);
        const goneList = (row[dept]?.goneEntries || []).filter(g => (g.peice || '').trim() !== '' || (g.date || '').trim() !== '');
        const come = comeList.reduce((s, x) => s + (parseFloat(x.peice) || 0), 0);
        const gone = goneList.reduce((s, x) => s + (parseFloat(x.peice) || 0), 0);
        return { come, gone, balance: come - gone, comeList, goneList };
      }

      function getPackingTotalPeice(row) {
        return getStageTotals(row, 'packing').gone;
      }

      function getPackingPrimaryName(row) {
        return (row.packing?.name || '').trim();
      }

      function renderTable() {
        const tbody = document.getElementById('lotTableBody');
        const q = currentSearch.trim().toLowerCase();

        const filtered = state.rows.filter(r => {
          if (!q) return true;
          return [
            r.lotNo, r.size, r.fabric, r.masterName,
            r.embroidery?.name, r.fabrication?.name, r.tanki?.name,
            r.washing?.name, getPackingPrimaryName(r), r.laser?.name, r.print?.name
          ].some(v => (v || '').toLowerCase().includes(q));
        });

        let totalPcs = 0;
        let totalJama = 0;
        state.rows.forEach(r => {
          totalPcs += parseFloat(r.peice) || 0;
          totalJama += getPackingTotalPeice(r);
        });
        document.getElementById('totalLotsCount').textContent = state.rows.length;
        document.getElementById('totalPiecesCount').textContent = totalPcs;
        document.getElementById('totalJamaCount').textContent = totalJama;

        if (!filtered.length) {
          tbody.innerHTML = '<tr><td colspan="13" class="text-center py-8 text-slate-400">No lots found. Click <strong>+ Add Row</strong> to start.</td></tr>';
          return;
        }

        tbody.innerHTML = filtered.map((row, idx) => {
          const isFirst = idx === 0 && !q;
          const jamaTotal = getPackingTotalPeice(row);
          const packName = getPackingPrimaryName(row);

          function renderJobCell(cellType, data, stageStats) {
            const hasName = (data?.name || '').trim() !== '';
            const isStage = !!stageStats;
            const isClear = isStage && data?.status === 'Clear';
            const isLightCell = data?.paid || isClear;
            const paidClass = data?.paid
              ? (data?.paidLight ? 'cell-paid-light' : 'cell-paid-bright')
              : (isClear ? 'cell-status-clear' : 'hover:bg-zinc-800/80');

            let subHtml = '';
            if (isStage) {
              if (stageStats.come || stageStats.gone) {
                const balColor = isLightCell ? 'text-rose-700' : 'text-rose-400';
                subHtml = `<div class="sub-text text-[11px] ${isLightCell ? 'text-zinc-800' : 'text-zinc-300'} mt-0.5 font-medium">${stageStats.come} - ${stageStats.gone} <span class="${balColor} font-bold">(${stageStats.balance})</span></div>`;
              }
            } else if (data?.peice) {
              subHtml = `<div class="sub-text text-[11px] ${isLightCell ? 'text-zinc-800' : 'text-zinc-400'} mt-0.5">${escapeHtml(data.peice + ' pcs')}</div>`;
            }

            const statusBtnHtml = isStage
              ? `<div class="mt-1"><button type="button" data-toggle-stage-status="${row.id}" data-stage-dept="${cellType}" class="px-2 py-0.5 rounded-full text-[10px] font-bold border transition ${isClear ? 'bg-amber-400 border-amber-600 text-zinc-950' : 'bg-zinc-800 border-zinc-600 text-zinc-300 hover:bg-zinc-700'}">${isClear ? 'Clear' : 'Pending'}</button></div>`
              : '';

            return `<td data-row-id="${row.id}" data-cell="${cellType}" class="cell-trigger cursor-pointer px-2 py-2 border-r border-zinc-800 text-center align-middle transition ${paidClass}">
              ${hasName ? `<div class="font-semibold text-xs sm:text-sm leading-tight">${escapeHtml(data.name)}</div>` : `<div class="text-zinc-600 text-xs">+ Entry</div>`}
              ${subHtml}
              ${statusBtnHtml}
            </td>`;
          }

          return `<tr class="hover:bg-zinc-900/60 transition">
            <!-- Lot no (Bold, manual entry supported) -->
            <td class="sticky-lot px-2 py-2 border-r border-zinc-800 text-center">
              <input type="text" ${appMode === 'view' ? 'readonly disabled' : ''} data-lot-input="${row.id}" value="${escapeHtml(row.lotNo)}" placeholder="${isFirst ? 'Lot #' : ''}" class="lot-bold w-full text-center bg-transparent border border-transparent hover:border-zinc-600 focus:border-amber-400 focus:bg-zinc-900 rounded px-1 py-1 text-amber-400 text-sm focus:outline-none" />
            </td>

            <!-- peice (Click opens entry modal) -->
            <td data-row-id="${row.id}" data-cell="peice" class="cell-trigger cursor-pointer px-2 py-2 border-r border-zinc-800 text-center hover:bg-zinc-800/80 transition">

      function getNextLotNo() {
        let nextLot = '101';
        if (state.rows.length > 0) {
          const lastLot = (state.rows[state.rows.length - 1].lotNo || '').trim();
          const match = lastLot.match(/^(.*?)(\d+)$/);
          if (match) {
            const prefix = match[1];
            const num = parseInt(match[2], 10) + 1;
            nextLot = prefix + String(num).padStart(match[2].length, '0');
          } else if (lastLot === '') {
            nextLot = String(state.rows.length + 1);
          } else {
            nextLot = lastLot + '-2';
          }
        }
        return nextLot;
      }

      function addNewRow() {
        const nextLot = getNextLotNo();
        state.rows.push(createRow(nextLot));
        saveLocalState();
        renderTable();
        showToast('Row added: Lot ' + nextLot);
      }

      function openStageModal(rowId, dept, isUnlocked) {
        const row = getRow(rowId);
        if (!row) return;
        normalizeRowStages(row);
        const data = row[dept];
        const titles = {
          fabrication: 'Fabrication',
          tanki: 'Tanki',
          washing: 'Washing',
          packing: 'Packing'
        };
        const isWashing = dept === 'washing';
        const isPacking = dept === 'packing';
        const paid = !!data.paid;
        const unlocked = !!isUnlocked;
        const isLocked = (paid && !unlocked) || appMode === 'view';
        const ro = isLocked ? 'readonly disabled' : '';
        const roClass = isLocked ? 'bg-slate-100 text-slate-500 cursor-not-allowed' : 'bg-white';

        function renderStageModalBody() {
          const comeList = getStageComeEntries(row, dept);
          const comeTotal = comeList.reduce((s, x) => s + (parseFloat(x.peice) || 0), 0);
          const goneTotal = (data.goneEntries || []).reduce((s, x) => s + (parseFloat(x.peice) || 0), 0);
          const balance = comeTotal - goneTotal;

          const comeRowsHtml = comeList.length
            ? comeList.map(c => `
                <div class="flex items-center justify-between text-xs py-1 border-b border-slate-200 last:border-b-0">
                  <span class="text-slate-600">${escapeHtml(formatDateDMY(c.date) || '-')}</span>
                  <span class="font-bold text-slate-900">${escapeHtml(c.peice || '0')} pcs</span>
                </div>`).join('')
            : '<div class="text-xs text-slate-400 py-2 text-center">Abhi koi Come entry nahi</div>';

          const goneRowsHtml = (data.goneEntries || []).map((g, idx) => `
            <div class="flex flex-wrap items-center gap-1.5 py-1.5 border-b border-slate-200 last:border-b-0">
              <input type="date" ${ro} data-gone-field="date" data-gone-idx="${idx}" value="${escapeHtml(g.date || '')}" class="flex-1 min-w-[115px] border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />
              <input type="number" inputmode="numeric" ${ro} data-gone-field="peice" data-gone-idx="${idx}" value="${escapeHtml(g.peice || '')}" placeholder="Peice" class="w-20 border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />
              ${isPacking ? `<input type="text" ${ro} data-gone-field="ripit" data-gone-idx="${idx}" value="${escapeHtml(g.ripit || '')}" placeholder="Ripit" class="w-20 border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />` : ''}
              ${(!isLocked && data.goneEntries.length > 1) ? `<button type="button" data-remove-gone="${idx}" class="text-rose-500 hover:text-rose-700 font-bold text-xs px-1.5 py-1" title="Remove">✕</button>` : ''}
            </div>
          `).join('');

          openModal(`
            <div class="p-4 sm:p-5">
              <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-3">
                <div>
                  <h3 class="text-base font-bold text-slate-900">${titles[dept]} — Lot ${escapeHtml(row.lotNo)}</h3>
                  ${paid ? `<div class="flex flex-wrap items-center gap-2 mt-1">
                    <span class="inline-block px-2 py-0.5 bg-green-500 text-white text-[11px] font-bold rounded-full">${unlocked ? '✓ PAID (UNLOCKED)' : '✓ PAID / READ ONLY'}</span>
                    ${(appMode !== 'view' && !unlocked) ? '<button id="stageUnlockPinBtn" type="button" class="px-2.5 py-0.5 rounded-full bg-amber-500 hover:bg-amber-400 text-zinc-950 text-[11px] font-bold">🔓 Edit with PIN</button>' : ''}
                  </div>` : ''}
                </div>
                <button type="button" data-close-modal class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold">✕</button>
              </div>

              ${(paid && appMode !== 'view') ? `
              <div id="stagePinBox" class="hidden mb-3 p-3 rounded-xl border border-amber-500/50 bg-amber-950/30 space-y-2">
                <div class="text-xs font-bold text-amber-300">Read-Only Entry Edit karne ke liye PIN daalein:</div>
                <div class="flex gap-2">
                  <input id="stagePinInput" type="password" inputmode="numeric" maxlength="6" placeholder="Enter PIN" class="flex-1 border rounded-lg px-3 py-1.5 text-sm" />

                </div>
                <div id="stagePinErr" class="hidden text-xs text-rose-400 font-semibold">Galat PIN!</div>
              </div>` : ''}

              <!-- Name, Rate & Washing Type -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Name</label>
                  <input id="stageNameInput" list="dl_stage_${dept}" type="text" ${ro} value="${escapeHtml(data.name || '')}" placeholder="${titles[dept]} Party / Karigar" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm ${roClass}" />
                  ${buildDatalistHtml('dl_stage_' + dept, dept)}
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Rate (₹)</label>
                  <input id="stageRateInput" type="number" step="0.01" inputmode="decimal" ${ro} value="${escapeHtml(data.rate || '')}" placeholder="Rate per peice" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm ${roClass}" />
                </div>
                ${dept === 'tanki' ? `
                <div class="sm:col-span-2">
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Send To (Washing)</label>
                  <input id="stageSendToWashingInput" list="dl_send_washing" type="text" ${ro} value="${escapeHtml(row.washing?.name || '')}" placeholder="Washing party ka naam (auto Washing column me jayega)" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm ${roClass}" />
                  ${buildDatalistHtml('dl_send_washing', 'washing')}
                </div>` : ''}
                ${isWashing ? `
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Washing Type</label>
                  <input id="stageWashingTypeInput" type="text" ${ro} value="${escapeHtml(data.washingType || '')}" placeholder="e.g. Double Dye / Enzyme" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm ${roClass}" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Send To (Packing)</label>
                  <input id="stageSendToPackingInput" list="dl_send_packing" type="text" ${ro} value="${escapeHtml(row.packing?.name || '')}" placeholder="Packing party ka naam" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm ${roClass}" />
                  ${buildDatalistHtml('dl_send_packing', 'packing')}
                </div>` : ''}
              </div>

              <!-- Summary Strip: Come - Gone (Balance) -->
              <div class="grid grid-cols-3 gap-2 mb-3 text-center">
                <div class="p-2 rounded-lg bg-sky-50 border border-sky-200">
                  <div class="text-[10px] font-semibold text-sky-700 uppercase">Come</div>
                  <div class="text-base font-extrabold text-sky-900">${comeTotal}</div>
                </div>
                <div class="p-2 rounded-lg bg-emerald-50 border border-emerald-200">
                  <div class="text-[10px] font-semibold text-emerald-700 uppercase">Gone</div>
                  <div id="stageGoneTotalBox" class="text-base font-extrabold text-emerald-900">${goneTotal}</div>
                </div>
                <div class="p-2 rounded-lg bg-amber-50 border border-amber-200">
                  <div class="text-[10px] font-semibold text-amber-800 uppercase">Balance</div>
                  <div id="stageBalanceBox" class="text-base font-extrabold text-amber-900">${balance}</div>
                </div>
              </div>

              <!-- Come & Gone Table -->
              <div class="border border-slate-200 rounded-xl overflow-hidden mb-3">
                <div class="grid grid-cols-1 sm:grid-cols-12 bg-slate-800 text-white text-xs font-bold">
                  <div class="sm:col-span-4 px-3 py-2 border-b sm:border-b-0 sm:border-r border-slate-700">Come (Date &amp; Peice)</div>
                  <div class="sm:col-span-8 px-3 py-2 flex items-center justify-between">
                    <span>Gone (Date &amp; Peice)</span>
                    ${!isLocked ? `<button id="addGoneRowBtn" type="button" class="px-2 py-0.5 rounded bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-[11px] font-bold">+ Add Gone</button>` : ''}
                  </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-12">
                  <div class="sm:col-span-4 p-2.5 bg-slate-50 border-b sm:border-b-0 sm:border-r border-slate-200">
                    ${comeRowsHtml}
                  </div>
                  <div class="sm:col-span-8 p-2.5 bg-white">
                    ${goneRowsHtml}
                  </div>
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="pt-2 flex flex-wrap items-center justify-between gap-2 border-t border-slate-200">
                <button id="stagePaidBtn" type="button" ${appMode === 'view' ? 'disabled' : ''} class="px-4 py-2 rounded-lg font-bold text-xs sm:text-sm shadow transition ${paid ? 'bg-green-600 hover:bg-green-500 text-white' : (appMode === 'view' ? 'hidden' : 'bg-rose-600 hover:bg-rose-500 text-white')}">
                  ${paid ? '✓ Paid' : 'Unpaid'}
                </button>
                <div class="flex gap-2">
                  <button type="button" data-close-modal class="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold">Close</button>
                  ${!isLocked ? '<button id="stageSaveBtn" type="button" class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow">Save</button>' : ''}
                </div>
              </div>
            </div>
          `);

          function syncInputsToData() {
            if (isLocked) return;
            const nameEl = document.getElementById('stageNameInput');
            const rateEl = document.getElementById('stageRateInput');
            const washEl = document.getElementById('stageWashingTypeInput');
            const sendWashEl = document.getElementById('stageSendToWashingInput');
            const sendPackEl = document.getElementById('stageSendToPackingInput');
            if (nameEl) data.name = nameEl.value.trim();
            if (rateEl) data.rate = rateEl.value;
            if (washEl) data.washingType = washEl.value.trim();
            if (sendWashEl) row.washing.name = sendWashEl.value.trim();
            if (sendPackEl) row.packing.name = sendPackEl.value.trim();

            document.querySelectorAll('[data-gone-field]').forEach(inp => {
              const idx = parseInt(inp.getAttribute('data-gone-idx'), 10);
              const field = inp.getAttribute('data-gone-field');
              if (data.goneEntries[idx]) data.goneEntries[idx][field] = inp.value;
            });

            const newGone = (data.goneEntries || []).reduce((s, x) => s + (parseFloat(x.peice) || 0), 0);
            const gBox = document.getElementById('stageGoneTotalBox');
            const bBox = document.getElementById('stageBalanceBox');
            if (gBox) gBox.textContent = newGone;
            if (bBox) bBox.textContent = comeTotal - newGone;
          }

          ['stageNameInput', 'stageRateInput', 'stageWashingTypeInput', 'stageSendToWashingInput', 'stageSendToPackingInput'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', syncInputsToData);
          });
          document.querySelectorAll('[data-gone-field]').forEach(inp => {
            inp.addEventListener('input', syncInputsToData);
          });

          const addBtn = document.getElementById('addGoneRowBtn');
          if (addBtn) {
            addBtn.addEventListener('click', () => {
              syncInputsToData();
              data.goneEntries.push(isPacking ? { date: todayISO(), peice: '', ripit: '' } : { date: todayISO(), peice: '' });
              renderStageModalBody();
            });
          }

          document.querySelectorAll('[data-remove-gone]').forEach(btn => {
            btn.addEventListener('click', () => {
              syncInputsToData();
              const idx = parseInt(btn.getAttribute('data-remove-gone'), 10);
              data.goneEntries.splice(idx, 1);
              renderStageModalBody();
            });
          });

          const unlockStageBtn = document.getElementById('stageUnlockPinBtn');
          if (unlockStageBtn) {
            unlockStageBtn.addEventListener('click', () => {
              const box = document.getElementById('stagePinBox');
              if (box) box.classList.remove('hidden');
              const inp = document.getElementById('stagePinInput');
              if (inp) inp.focus();
            });
            document.getElementById('stagePinSubmitBtn').addEventListener('click', () => {
              const val = (document.getElementById('stagePinInput').value || '').trim();
              if (val === (state.editPin || DEFAULT_EDIT_PIN)) {
                openStageModal(rowId, dept, true);
                showToast('Fields unlocked! Paid status unchanged.');
              } else {
                document.getElementById('stagePinErr').classList.remove('hidden');
              }
            });
          }

          const saveBtn = document.getElementById('stageSaveBtn');
          if (saveBtn) {
            saveBtn.addEventListener('click', () => {
              syncInputsToData();
              row.updatedBy = state.activeUser;
              row.updatedAt = Date.now();
              saveLocalState();
              renderTable();
              closeModal();
              showToast(titles[dept] + ' saved');
            });
          }

          document.getElementById('stagePaidBtn').addEventListener('click', () => {
            if (appMode === 'view') return;
            if (data.paid) {
              if (!unlocked) {
                const box = document.getElementById('stagePinBox');
                if (box) box.classList.remove('hidden');
                const inp = document.getElementById('stagePinInput');
                if (inp) inp.focus();
                return;
              }
              syncInputsToData();
              data.paid = false;
              data.paidLight = false;
              row.updatedBy = state.activeUser;
              row.updatedAt = Date.now();
              saveLocalState();
              renderTable();
              openStageModal(rowId, dept, true);
              showToast(titles[dept] + ' marked Unpaid');
              return;
            }
            syncInputsToData();
            data.paid = true;
            row.updatedBy = state.activeUser;
            row.updatedAt = Date.now();
            saveLocalState();
            renderTable();
            closeModal();
            showToast(titles[dept] + ' marked Paid');
          });
        }

        renderStageModalBody();
      }

      function openPackingModal(rowId) {
        const row = getRow(rowId);
        if (!row) return;
        const paid = row.packing.paid;
        const ro = paid ? 'readonly disabled' : '';
        const roClass = paid ? 'bg-slate-100 text-slate-500 cursor-not-allowed' : 'bg-white';

        const linesHtml = row.packing.lines.map((line, i) => `
          <div class="p-2.5 rounded-xl border border-slate-200 bg-slate-50/70 space-y-2">
            <div class="text-[11px] font-bold text-slate-500 uppercase">Line ${i + 1}</div>
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
              <div>
                <label class="block text-[10px] font-semibold text-slate-600">Date</label>
                <input name="date_${i}" type="date" ${ro} value="${escapeHtml(line.date)}" class="w-full border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />
              </div>
              <div>
                <label class="block text-[10px] font-semibold text-slate-600">Peice</label>
                <input name="peice_${i}" type="number" inputmode="numeric" ${ro} value="${escapeHtml(line.peice)}" placeholder="0" class="w-full border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />
              </div>
              <div>
                <label class="block text-[10px] font-semibold text-slate-600">Rate</label>
                <input name="rate_${i}" type="number" step="0.01" inputmode="decimal" ${ro} value="${escapeHtml(line.rate)}" placeholder="0" class="w-full border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />
              </div>
              <div>
                <label class="block text-[10px] font-semibold text-slate-600">Ripit</label>
                <input name="ripit_${i}" type="text" ${ro} value="${escapeHtml(line.ripit)}" placeholder="Ripit" class="w-full border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />
              </div>
              <div class="col-span-2 sm:col-span-1">
                <label class="block text-[10px] font-semibold text-slate-600">Name</label>
                <input name="name_${i}" type="text" ${ro} value="${escapeHtml(line.name)}" placeholder="Name" class="w-full border border-slate-300 rounded px-2 py-1 text-xs ${roClass}" />
              </div>
            </div>
          </div>
        `).join('');

        openModal(`
          <div class="p-4 sm:p-5">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-3">
              <div>
                <h3 class="text-base font-bold text-slate-900">Packing (4 Lines) — Lot ${escapeHtml(row.lotNo)}</h3>
                <p class="text-xs text-slate-500">Total Packing Peice auto Jama column me jayega</p>
              </div>
              <button type="button" data-close-modal class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold">✕</button>
            </div>
            <form id="packingForm" class="space-y-2.5">
              ${linesHtml}
              <div class="pt-3 flex flex-wrap items-center justify-between gap-2 border-t border-slate-200">
                <button id="packingPaidBtn" type="button" ${paid ? 'disabled' : ''} class="px-4 py-2 rounded-lg font-bold text-xs sm:text-sm shadow transition ${paid ? 'bg-green-600 text-white opacity-80 cursor-not-allowed' : 'bg-emerald-500 hover:bg-emerald-600 text-slate-950'}">
                  ${paid ? '✓ Payment Done' : 'Payment Done'}
                </button>
                <div class="flex gap-2">
                  <button type="button" data-close-modal class="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold">Close</button>
                  ${!paid ? '<button type="submit" class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow">Save Packing</button>' : ''}
                </div>
              </div>
            </form>
          </div>
        `);

        function readLines(formEl) {
          const fd = new FormData(formEl);
          for (let i = 0; i < 4; i++) {
            row.packing.lines[i] = {
              date: fd.get('date_' + i) || '',
              peice: fd.get('peice_' + i) || '',
              rate: fd.get('rate_' + i) || '',
              ripit: (fd.get('ripit_' + i) || '').trim(),
              name: (fd.get('name_' + i) || '').trim()
            };
          }
        }

        const form = document.getElementById('packingForm');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          if (row.packing.paid) return;
          readLines(form);
          row.updatedBy = state.activeUser;
          row.updatedAt = Date.now();
          saveLocalState();
          renderTable();
          closeModal();
          showToast('Packing saved (Jama: ' + getPackingTotalPeice(row) + ')');
        });

        document.getElementById('packingPaidBtn').addEventListener('click', () => {
          if (row.packing.paid) return;
          readLines(form);
          row.packing.paid = true;
          row.updatedBy = state.activeUser;
          row.updatedAt = Date.now();
          saveLocalState();
          renderTable();
          closeModal();
          showToast('Packing Payment Done');
        });
      }

      const DEPT_CONFIG = {
        master: { label: 'Master', hasTableRate: false },
        embroidery: { label: 'Embroidery', hasTableRate: true },
        fabrication: { label: 'Fabrication', hasTableRate: true },
        washing: { label: 'Washing', hasTableRate: true },
        tanki: { label: 'Tanki', hasTableRate: true },
        packing: { label: 'Packing', hasTableRate: true },
        laser: { label: 'Laser', hasTableRate: false },
        print: { label: 'Print', hasTableRate: false }
      };

      function getUnpaidDeptNames(dept) {
        const counts = {};
        state.rows.forEach(r => {
          if (dept === 'master') {
            if (!r.masterPaid && (r.masterName || '').trim()) {
              const n = r.masterName.trim();
              counts[n] = (counts[n] || 0) + 1;
            }
          } else {
            const d = r[dept];
            const needsClear = ['fabrication', 'washing', 'packing'].includes(dept);
            if (d && !d.paid && (!needsClear || d.status === 'Clear') && (d.name || '').trim()) {
              const n = d.name.trim();
              counts[n] = (counts[n] || 0) + 1;
            }
          }
        });
        return Object.keys(counts).sort().map(n => ({ name: n, count: counts[n] }));
      }

      function getUnpaidDeptRows(dept, name) {
        if (dept === 'master') {
          return state.rows.filter(r => !r.masterPaid && (r.masterName || '').trim() === name);
        }

        const needsClear = ['fabrication', 'washing', 'packing'].includes(dept);
        return state.rows.filter(r => r[dept] && !r[dept].paid && (!needsClear || r[dept].status === 'Clear') && (r[dept].name || '').trim() === name);
      }

      function getDeptRowValues(dept, r, name, entry) {
        if (dept === 'master') {
          const pcs = parseFloat(r.peice) || 0;
          const rate = parseFloat(entry.rate) || 0;
          return { pcs, rate, amount: pcs * rate, date: entry.date || r.date || '', rateReadonly: false };
        }
        if (['fabrication', 'tanki', 'washing', 'packing'].includes(dept)) {
          const d = r[dept] || {};
          const st = getStageTotals(r, dept);
          const come = st.come;
          const gone = st.gone;
          const rate = parseFloat(d.rate || entry.rate) || 0;
          const firstGoneDate = (st.goneList[0] && st.goneList[0].date) ? st.goneList[0].date : '';
          return { pcs: come, come, gone, rate, amount: come * rate, date: entry.date || firstGoneDate || r.date || '', rateReadonly: true };
        }
        const d = r[dept] || {};
        const pcs = parseFloat(d.peice) || 0;
        const hasTableRate = DEPT_CONFIG[dept].hasTableRate;
        const rate = parseFloat(hasTableRate ? (d.rate || entry.rate) : entry.rate) || 0;
        return { pcs, come: pcs, gone: pcs, rate, amount: pcs * rate, date: entry.date || d.date || r.date || '', rateReadonly: hasTableRate };
      }

      function openDeptListModal(dept) {
        const cfg = DEPT_CONFIG[dept];
        if (!cfg) return;
        const items = getUnpaidDeptNames(dept);

        openModal(`
          <div class="p-4 sm:p-5">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-3">
              <div>
                <h3 class="text-base font-bold text-slate-900">Select ${cfg.label} (Unpaid Lots Only)</h3>
                <p class="text-xs text-slate-500">Sirf unpaid status wali lots hi hisab me judengi</p>
              </div>
              <button type="button" data-close-modal class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold">✕</button>
            </div>
            ${items.length ? `
              <div class="space-y-2">
                ${items.map(it => `
                  <button type="button" data-select-hisab-name="${escapeHtml(it.name)}" class="w-full flex items-center justify-between px-4 py-3 rounded-xl bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 text-left transition">
                    <span class="font-bold text-slate-900">${escapeHtml(it.name)}</span>
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800">${it.count} Unpaid Lots</span>
                  </button>
                `).join('')}
              </div>
            ` : `<p class="text-sm text-slate-500 py-6 text-center">Koi unpaid ${cfg.label} entry nahi mili.</p>`}
          </div>
        `);

        document.querySelectorAll('[data-select-hisab-name]').forEach(btn => {
          btn.addEventListener('click', () => {
            const name = btn.getAttribute('data-select-hisab-name');
            closeModal();
            openHisabOverlay(dept, name);
          });
        });
      }

      let currentHisab = { type: null, name: '' };

      function openHisabOverlay(type, name) {
        currentHisab = { type, name, isSavedView: false };
        const overlay = document.getElementById('hisabOverlay');
        const label = DEPT_CONFIG[type]?.label || type;
        document.getElementById('hisabTitle').textContent = label + ' Hisab: ' + name;
        document.getElementById('hisabSaveBtn').classList.toggle('hidden', appMode === 'view');
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        renderHisabContent();
      }

      function renderHisabContent() {
        const { type, name } = currentHisab;
        if (!type || !name) return;

        if (!state.hisabMeta[type]) state.hisabMeta[type] = {};
        if (!state.hisabMeta[type][name]) {
          state.hisabMeta[type][name] = { lastBalance: '', entries: {}, extraPayments: [], draftRows: [] };
        }
        const meta = state.hisabMeta[type][name];
        if (!Array.isArray(meta.extraPayments)) meta.extraPayments = [];
        if (!Array.isArray(meta.draftRows)) meta.draftRows = [];
        const label = DEPT_CONFIG[type]?.label || type;
        const matchingRows = getUnpaidDeptRows(type, name);
        const isStageDept = ['fabrication', 'tanki', 'washing', 'packing'].includes(type);
        const isTankiHisab = type === 'tanki';

        let totalPeice = 0;
        let totalAmount = 0;
        let totalPayment = 0;

        const rowsHtml = matchingRows.map(r => {
          if (!meta.entries[r.id]) {
            meta.entries[r.id] = { rate: '', date: '', payment: '', ignored: false };
          }
          const entry = meta.entries[r.id];
          const isIgnored = !!entry.ignored;
          const vals = getDeptRowValues(type, r, name, entry);
          const payment = parseFloat(entry.payment) || 0;

          if (!isIgnored) {
            totalPeice += vals.pcs;
            totalAmount += vals.amount;
            totalPayment += payment;
          }

          const displayRate = vals.rateReadonly ? (r[type]?.rate || '') : (entry.rate || '');
          return `<tr class="border-b border-slate-200 ${isIgnored ? 'bg-slate-100 opacity-50 no-print' : ''}" ${isIgnored ? 'data-html2canvas-ignore="true"' : ''}>
            <td class="px-2 py-2 border-r border-slate-200">

            ${isStageDept ? `

              <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
                <input type="number" inputmode="numeric" data-hisab-lot-field="gone" data-lot-id="${r.id}" value="${escapeHtml(vals.gone ? String(vals.gone) : '')}" placeholder="0" class="w-16 text-right font-semibold border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />

              ${isTankiHisab ? `

                <input type="number" inputmode="numeric" data-hisab-lot-field="peice" data-lot-id="${r.id}" value="${escapeHtml(vals.pcs ? String(vals.pcs) : '')}" placeholder="0" class="w-16 text-right font-semibold border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none focus:border-indigo-500" />

            <td class="px-1.5 py-2 border-r border-slate-200 whitespace-nowrap">
